name: Publish web packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this exact main commit as a durable engine snapshot
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'sdk/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'content/**'
      - 'packages/core/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'COPYING'
      - 'COPYING.LESSER'
      - 'COPYING.EXAMPLES'
      - 'LICENSE.md'
      - 'docs/distribution-licensing.md'
      - '.github/workflows/publish.yml'
      - '.github/install-ubuntu-dependencies.py'
      - '.github/engine-release.py'
      - '.github/test-engine-release.py'

permissions:
  contents: read

env:
  EMSDK_VERSION: 6.0.10
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  packages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      engine: ${{ steps.candidate.outputs.engine }}
      artifact: ${{ steps.candidate.outputs.artifact }}
      complete: ${{ steps.release.outputs.complete }}
    concurrency:
      group: engine-packages-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: engine
    env:
      LIBCLANG_ROOT: /usr/lib/llvm-18
      NATIVE_TOOLCHAIN_FLAGS: -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: engine
      - name: Select the exact main commit
        id: candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "engine=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact=engine-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Check immutable release
        id: release
        run: python3 .github/engine-release.py inspect --engine "${{ steps.candidate.outputs.engine }}" --repository "$GH_REPO"
      - name: Validate SDK release pins
        if: steps.release.outputs.complete != 'true'
        run: sh tools/check_publish_pins.sh
      - name: Install build dependencies
        if: steps.release.outputs.complete != 'true'
        run: |
          python3 .github/install-ubuntu-dependencies.py --no-install-recommends \
            ninja-build ccache clang-18 clang-tools-18 libclang-18-dev libclang-rt-18-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxrandr-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          pip install 'cmake==4.2.3'
      - uses: mymindstorm/setup-emsdk@v14
        if: steps.release.outputs.complete != 'true'
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: Restore compiler cache
        if: steps.release.outputs.complete != 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: publish-v1-ubuntu24-x64-clang18-${{ env.EMSDK_VERSION }}
      - name: Build relocatable export tools and browser SDK
        if: steps.release.outputs.complete != 'true'
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          make package-sdk package-web-sdk package-web-player \
            SDK_CMAKE_FLAGS='-DCMAKE_BUILD_TYPE=Release -DCHIBI_ENABLE_SANITIZERS=OFF -DCHIBI_ENABLE_CCACHE=ON' \
            WEB_SDK_CMAKE_FLAGS='-DCHIBI_ENABLE_CCACHE=ON' WEB_THREADS=0 JOBS=4
      - name: Assemble release archives
        if: steps.release.outputs.complete != 'true'
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          export RELEASE_DIR="$RUNNER_TEMP/engine-release"
          mkdir -p "$RELEASE_DIR"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          for sdk in ('sdk', 'web-sdk'):
              source = json.loads(Path(f'dist/{sdk}/share/chibi/package.json').read_text())['source']
              if source['dirty'] or source['revision'] != os.environ['GITHUB_SHA']:
                  raise SystemExit(f'{sdk} package does not identify the clean candidate')
          record = {'format': 1, 'engine_sha': os.environ['GITHUB_SHA'],
                    'emsdk_version': os.environ['EMSDK_VERSION'],
                    'platform': 'ubuntu-24.04-x64', 'web_threads': False}
          (Path(os.environ['RELEASE_DIR']) / 'build.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
          tar -czf "$RELEASE_DIR/chibi-export-linux-x64.tar.gz" -C dist sdk/bin/chibi sdk/share/chibi web-player
          tar -czf "$RELEASE_DIR/chibi-sdk-linux-x64.tar.gz" -C dist/sdk .
          tar -czf "$RELEASE_DIR/chibi-web-sdk.tar.gz" -C dist/web-sdk .
          cd "$RELEASE_DIR"
          sha256sum chibi-export-linux-x64.tar.gz chibi-sdk-linux-x64.tar.gz chibi-web-sdk.tar.gz build.json > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Verify the complete package handoff
        if: steps.release.outputs.complete != 'true'
        run: python3 .github/engine-release.py validate --engine "${{ steps.candidate.outputs.engine }}" --emsdk "$EMSDK_VERSION" --directory "$RUNNER_TEMP/engine-release"
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.complete != 'true'
        with:
          name: ${{ steps.candidate.outputs.artifact }}
          path: ${{ runner.temp }}/engine-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: packages
    # Keep push publication during the Studio handoff. Remove that clause only
    # after explicit Studio selection and matching game exports are verified.
    if: >-
      github.ref == 'refs/heads/main' && needs.packages.outputs.complete != 'true' &&
      (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: engine-release-${{ needs.packages.outputs.engine }}
      cancel-in-progress: false
    env:
      ENGINE: ${{ needs.packages.outputs.engine }}
      ENGINE_TAG: engine-${{ needs.packages.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.packages.outputs.engine }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.packages.outputs.artifact }}
          path: ${{ runner.temp }}/engine-release
      - name: Verify the selected package identity and all five files
        run: |
          test "$(git rev-parse HEAD)" = "$ENGINE"
          python3 .github/engine-release.py validate --engine "$ENGINE" --emsdk "$EMSDK_VERSION" --directory "$RUNNER_TEMP/engine-release"
      - name: Recheck immutable release before publication
        id: release
        run: python3 .github/engine-release.py inspect --engine "$ENGINE" --repository "$GH_REPO"
      - name: Publish complete release
        if: steps.release.outputs.complete != 'true'
        env:
          TAG_EXISTS: ${{ steps.release.outputs.tag_exists }}
          RELEASE_EXISTS: ${{ steps.release.outputs.release_exists }}
        run: |
          # Only a verified absent tag/release may be created. API errors fail
          # closed; an interrupted draft can resume, published bytes never change.
          if [ "$TAG_EXISTS" = false ]; then
            gh api --method POST 'repos/{owner}/{repo}/git/refs' \
              -f ref="refs/tags/$ENGINE_TAG" -f sha="$ENGINE" >/dev/null
          fi
          if [ "$RELEASE_EXISTS" = false ]; then
            gh release create "$ENGINE_TAG" --target "$ENGINE" --draft --prerelease \
              --title "Web packages $ENGINE" \
              --notes "Serial browser SDK and Linux export tools. Emscripten $EMSDK_VERSION. Verify SHA256SUMS before extraction."
          fi
          test "$(gh release view "$ENGINE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$ENGINE_TAG" "$RUNNER_TEMP/engine-release/"* --clobber
          python3 .github/engine-release.py verify-draft --engine "$ENGINE" --repository "$GH_REPO" --emsdk "$EMSDK_VERSION" --directory "$RUNNER_TEMP/engine-release"
          gh release edit "$ENGINE_TAG" --draft=false --prerelease --latest=false
