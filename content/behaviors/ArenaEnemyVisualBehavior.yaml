      Source: {declaration_id: 3, type: handle, type_name: ecs.entity, kind: data}
  - id: 35
    type: Call Function
    reference_id: 96
    reference_name: Bump
    inputs:
      Strength: {type: float, kind: data, default: 1.6}
  edges:
  - {from: 2.Then, to: 8.Exec}
  - {from: 4.Result, to: 8.Value}
  - {from: 8.Then, to: 18.Exec}
  - {from: 14.Result, to: 18.Value}
  - {from: 24.Then, to: 27.Exec}
  - {from: 31.Then, to: 35.Exec}
- id: 96
