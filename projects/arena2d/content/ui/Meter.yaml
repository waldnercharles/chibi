rml: |
  <div class="meter">
    <div class="head">
      <span class="label"><slot/></span>
      <span class="readout"/>
    </div>
    <progress class="bar" value="1" max="1"/>
  </div>
rcss: |
  .meter { display: block; }
  .head { display: block; height: 18dp; line-height: 18dp; font-size: 12dp; }
  .label { color: #7fa6b3; text-transform: uppercase; }
  .readout { float: right; color: #ccf8fb; }
  .bar {
    display: block; width: 100%; height: 6dp; margin-top: 4dp;
    background-color: #0e2630; border-radius: 3dp;
  }
  .bar fill { background-color: #4fe3f0; border-radius: 3dp; }
  body.critical {
    .readout { color: #ff8c96; }
    .bar fill { background-color: #ff5f6d; }
  }
