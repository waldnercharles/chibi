name: Native compiler seed

# Builds the native compiler on each platform: native stage two, which the
# build checks byte-identical to the stage three it compiles. Once
# tools/bootstrap/native-seed.tsv pins a platform, its stage one is that pinned
# compiler, so this is the recovery from the native seed (goal item 7);
# otherwise stage one comes from the bytecode seed. With publish, the stage
# twos are released and their pins printed; commit them to native-seed.tsv.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Release the native compilers and print their pins
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: native-seed-${{ github.sha }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TAG: native-seed-${{ github.sha }}

jobs:
  build:
    name: Native compiler (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the native LLVM tools
        run: sh .github/native-llvm.sh
      - name: Install the build and LLVM tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -y -q clang-18 clang-tools-18 libclang-18-dev libclang-rt-18-dev llvm-18 lld-18 \
              libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
              libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
              libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
            echo "LIBCLANG_ROOT=/usr/lib/llvm-18" >> "$GITHUB_ENV"
          else
            LLVM="$(brew --prefix llvm@22)"
            echo "LIBCLANG_ROOT=$LLVM" >> "$GITHUB_ENV"
            echo "CC=$LLVM/bin/clang" >> "$GITHUB_ENV"
            echo "CXX=$LLVM/bin/clang++" >> "$GITHUB_ENV"
          fi
      - name: Build native stage two and check that stage three equals it
        shell: bash
        run: |
          set -o pipefail
          stage_one=()
          if grep -q "^${{ matrix.platform }}	" tools/bootstrap/native-seed.tsv; then
            sh tools/bootstrap/native-seed.sh "${{ matrix.platform }}" "$RUNNER_TEMP/native-seed/chibi"
            stage_one=(--stage-one "$RUNNER_TEMP/native-seed/chibi")
          fi
          sh tools/build.sh build native-self-host --llvm "$LLVM_BIN" --libclang-root "$LIBCLANG_ROOT" --jobs 4 --skip-vm "${stage_one[@]}" 2>&1 \
            | tee "$RUNNER_TEMP/native-seed.log"
      - name: Keep the native compiler
        shell: bash
        run: |
          mkdir out
          # Stage two, or stage three when a seeded stage two came from an older compiler.
          fixed=$(sed -n 's/^native-self-host: the fixed point is //p' "$RUNNER_TEMP/native-seed.log")
          test -x "$fixed"
          cp "$fixed" "out/chibi-native-${{ matrix.platform }}"
          { echo '### Native compiler (${{ matrix.platform }})'; echo '```'; grep -E '^(stage|native-self-host)' "$RUNNER_TEMP/native-seed.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: native-seed-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-seed-log-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-seed.log

  publish:
    name: Publish the native compilers
    needs: build
    # Publishes the platforms that built, so one platform's failure does not
    # hold back the others' pins.
    if: always() && inputs.publish && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-seed-*
          path: out
          merge-multiple: true
      - name: Publish the release and print the pins
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          ls chibi-native-* > /dev/null
          sha256sum chibi-native-* > SHA256SUMS
          # A tag names one commit's compilers; never replace published assets.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Native compiler seed $TAG" \
              --notes "Native stage two of $GITHUB_SHA, byte-identical to stage three. Pinned by tools/bootstrap/native-seed.tsv." \
              chibi-native-* SHA256SUMS
          fi
          {
            echo '### Pins for tools/bootstrap/native-seed.tsv'
            echo '```'
            for platform in linux-x64 macos-arm64; do
              if [ -f "chibi-native-$platform" ]; then
                printf '%s\t%s\tchibi-native-%s\t%s\n' "$platform" "$TAG" "$platform" "$(sha256sum "chibi-native-$platform" | cut -d' ' -f1)"
              fi
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
