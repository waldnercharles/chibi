<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>WebGPU staging regression</title>
<canvas id="canvas" width="64" height="64"></canvas>
<pre id="output"></pre>
<template>{{{ SCRIPT }}}</template>
<script>
'use strict';
const output = document.getElementById('output');
let completed = false;
let device;
let realLost;
let resolveOldLoss;
let oldLossDelivered = false;
let expectedLoss = false;
let lossDelivered = false;
let validationDelivered = false;
const diagnostic = message => fetch('/diagnostic', {
    method: 'POST', body: String(message).slice(0, 240)
}).catch(() => {});
const fail = reason => {
    console.error(reason);
    diagnostic(reason);
    window.chibiStagingResult('1 0 0 0 0 0 0');
};
window.addEventListener('error', event => fail(event.message));
window.addEventListener('unhandledrejection', event => fail(event.reason));
diagnostic('shell-start');
const watchdog = setTimeout(() => {
    fail('startup/execution watchdog expired');
    if (device) device.destroy();
}, 55000);
window.chibiStagingResult = body => {
    if (completed) return;
    completed = true;
    clearTimeout(watchdog);
    output.textContent += body + '\n';
    fetch('/result', { method: 'POST', body }).catch(error => {
        output.textContent += String(error) + '\n';
    });
};
var Module = {
    canvas: document.getElementById('canvas'),
    arguments: ['--webgpu-staging'],
    onRuntimeInitialized: () => diagnostic('runtime-ready'),
    print: text => { output.textContent += text + '\n'; console.log(text); },
    printErr: text => { output.textContent += text + '\n'; console.error(text); },
    onAbort: reason => {
        output.textContent += String(reason) + '\n';
        fail(reason);
        if (device) device.destroy();
    }
};
window.chibiStagingRestoreDeviceLoss = () => {
    Object.defineProperty(device, 'lost', { configurable: true, value: realLost });
};
window.chibiStagingResolveOldLoss = () => {
    resolveOldLoss({ reason: 'unknown', message: 'stale app device loss regression' });
    queueMicrotask(() => { oldLossDelivered = true; });
};
window.chibiStagingOldLossDelivered = () => oldLossDelivered;
window.chibiStagingValidationDelivered = () => validationDelivered;
window.chibiStagingLossDelivered = () => lossDelivered;
window.chibiStagingValidationError = () => {
    // A real WebGPU validation error, rather than a synthetic DOM event.
    device.createBuffer({ size: 4, usage: 0 });
    device.queue.submit([]);
};
window.chibiStagingLoseDevice = () => {
    expectedLoss = true;
    device.destroy();
};
(async () => {
    if (@CHIBI_TEST_ADOPT_DEVICE@) {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) throw new Error('No WebGPU adapter');
        device = await adapter.requestDevice();
        if (completed) {
            device.destroy();
            return;
        }
        realLost = device.lost;
        // The first app subscribes to a loss that we can deliver after teardown.
        Object.defineProperty(device, 'lost', {
            configurable: true,
            value: new Promise(resolve => { resolveOldLoss = resolve; })
        });
        Module.preinitializedWebGPUDevice = device;
        device.addEventListener('uncapturederror', event => {
            validationDelivered = event.error instanceof GPUValidationError;
            if (!validationDelivered) fail(event.error.message);
            event.preventDefault();
        });
        realLost.then(info => {
            lossDelivered = true;
            if (!expectedLoss) fail('Unexpected device loss: ' + info.message);
        });
    }
    const script = document.createElement('script');
    script.src = 'test_tools.js';
    script.onload = () => diagnostic('script-loaded');
    script.onerror = () => {
        fail('test_tools.js failed to load');
        if (device) device.destroy();
    };
    document.body.appendChild(script);
})().catch(error => {
    output.textContent += String(error) + '\n';
    fail(error);
    if (device) device.destroy();
});
</script>
</html>
