<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <title>{{TITLE}}</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; overscroll-behavior: none; }
    html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    /* Keep authored controls clear of the notch and home indicator. */
    body { box-sizing: border-box; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #canvas { display: block; width: 100%; height: 100%; border: 0; outline: none; touch-action: pinch-zoom; }
    #status {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      box-sizing: border-box; max-width: calc(100% - 32px); margin: 0; padding: 10px 16px;
      border: 1px solid #303746; border-radius: 8px; background: #101620;
      color: #d9e1ed; font: 14px/1.5 system-ui, sans-serif; text-align: center;
      overflow-wrap: anywhere; pointer-events: none;
    }
    #status[data-error] { border-color: #9d4b55; color: #ffd9dd; }
    #diagnostics {
      position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right));
      max-width: calc(100% - 32px); margin: 0; padding: 8px 10px; background: #101620e8;
      color: #d9e1ed; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap;
      overflow-wrap: anywhere; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="{{TITLE}}"></canvas>
  <p id="status" role="status" aria-live="polite">Loading...</p>
  <pre id="diagnostics" hidden aria-label="Graphics diagnostics"></pre>
  <noscript>JavaScript is required to play this game.</noscript>
  <script>
    var Module = (() => {
      const canvas = document.getElementById('canvas');
      const status = document.getElementById('status');
      const diagnostics = document.getElementById('diagnostics');
      const showDiagnostics = new URLSearchParams(location.search).get('diagnostics') === '1';
      const graphics = { renderer: 'Starting', fps: 0, frameMs: 0, error: '' };
      let frames = 0;
      let started;
      const updateDiagnostics = () => {
        if (!showDiagnostics) return;
        diagnostics.hidden = false;
        diagnostics.textContent = `${graphics.renderer}\n${graphics.fps.toFixed(1)} FPS | ${graphics.frameMs.toFixed(1)} ms/frame\n` +
          `Canvas ${canvas.width} × ${canvas.height}\nDisplay ${Math.round(canvas.clientWidth)} × ${Math.round(canvas.clientHeight)} | DPR ${devicePixelRatio}` +
          (graphics.error ? `\n${graphics.error}` : '');
      };
      let lastError = '';
      const fail = message => {
        graphics.fps = 0;
        graphics.frameMs = 0;
        graphics.error = String(message);
        updateDiagnostics();
        status.dataset.error = '';
        status.textContent = String(message);
        status.hidden = false;
      };
      canvas.addEventListener('contextmenu', event => event.preventDefault());
      canvas.addEventListener('pointerdown', () => canvas.focus({ preventScroll: true }));
      // SDL listens to window resize; canvas layout can change independently.
      new ResizeObserver(() => window.dispatchEvent(new Event('resize'))).observe(canvas);
      canvas.addEventListener('webglcontextlost', event => {
        event.preventDefault();
        fail('Graphics context lost. Reload this page to continue.');
      });
      return {
        canvas,
        chibiGraphics: graphics,
        chibiRenderer: renderer => {
          graphics.renderer = renderer;
          updateDiagnostics();
        },
        chibiGraphicsError: message => {
          graphics.error = String(message);
          updateDiagnostics();
        },
        chibiFrame: showDiagnostics ? () => {
          const now = performance.now();
          if (started === undefined) {
            started = now;
            return;
          }
          frames++;
          const elapsed = now - started;
          if (elapsed < 1000) return;
          graphics.fps = frames * 1000 / elapsed;
          graphics.frameMs = elapsed / frames;
          frames = 0;
          started = now;
          updateDiagnostics();
        } : undefined,
        printErr: text => {
          console.error(text);
          lastError = text;
        },
        onRuntimeInitialized: () => {
          status.hidden = true;
          canvas.focus();
        },
        onAbort: reason => fail(lastError || reason || 'The game stopped.'),
        // The player calls this when the game stops; the reason is the last error it printed.
        chibiStopped: () => fail(lastError || 'The game stopped.'),
        chibiFail: fail,
      };
    })();
    // The player renders with WebGPU, like the desktop build, but cannot wait for
    // the browser to grant a device. The page asks first and hands the device over;
    // without one the player uses WebGL 2.
    (async () => {
      // The 2D material raster writes six RGBA16F targets at once
      // (src/render/material_raster.c), so smaller adapters use WebGL 2.
      const colorBytesPerSample = 6 * 8;
      const forceWebGL = new URLSearchParams(location.search).get('renderer') === 'webgl';
      try {
        const adapter = forceWebGL ? null : await navigator.gpu?.requestAdapter({ powerPreference: 'high-performance' });
        if (adapter?.limits.maxColorAttachmentBytesPerSample >= colorBytesPerSample) {
          const requiredLimits = {};
          for (const name in adapter.limits) requiredLimits[name] = adapter.limits[name];
          const device = await adapter.requestDevice({ requiredFeatures: [...adapter.features], requiredLimits });
          device.lost.then(info => {
            if (info.reason !== 'destroyed') Module.chibiFail('Graphics device lost. Reload this page to continue.');
          });
          device.onuncapturederror = event => {
            console.error(`WebGPU: ${event.error.message}`);
            Module.chibiGraphicsError(event.error.message);
          };
          Module.preinitializedWebGPUDevice = device;
        }
      } catch (error) {
        console.warn('WebGPU is unavailable, so the game uses WebGL 2.', error);
      }
      const player = document.createElement('script');
      player.src = 'chibi-player.js';
      document.body.append(player);
    })();
  </script>
</body>
</html>
