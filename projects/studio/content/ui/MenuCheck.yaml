rml: <label class="menu-item menu-check"><input type="checkbox"/><span class="icon lead">&#xeab2;</span><span class="label"><slot/></span></label>
rcss: |
  .menu-check { position: relative; }
  .menu-check input { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; }
  .menu-check .lead { opacity: 0; }
  .menu-check input:checked ~ .lead { opacity: 1; }
  .menu-check:hover { background-color: var(--accent); color: var(--on-accent); }
  .menu-check:hover .lead { color: var(--on-accent); }
