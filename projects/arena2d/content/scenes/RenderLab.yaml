version: 1
name: RenderLab
entities:
- {name: Camera, prototype: RenderLabCamera}
- {name: World, prototype: RenderLabWorld}
- name: Nebula
  prototype: RenderLabAnchor
  components:
    GAME.GameBackdrop2D: {material: RenderLabNebula, parallax: 0.15, layer: 0, intensity: 1.6}
- name: Spires
  prototype: RenderLabAnchor
  components:
    GAME.GameBackdrop2D:
      material: RenderLabSpires
      parallax: 0.45
      layer: 1
      intensity: 1.0
      lit: true
- name: Warm lamp
  prototype: Lamp
  components:
    GAME.GameTransform: {x: -300.0, "y": -170.0}
- name: Cool lamp
  prototype: Lamp
  components:
    GAME.GameTransform: {x: 250.0, "y": -190.0}
    GAME.GameMaterial:
      emission_color: 2699557887
      emission_intensity: 0.8
      emission_multiplier: 1.0
      scene: 3437230079
- name: Floor
  prototype: HardRock
  components:
    GAME.GameTransform: {x: 0.0, "y": 230.0}
    GAME.GameAppearance: {width: 1000.0, height: 60.0, shape: Box, color: 1262571775}
    GAME.GameCollider: {category: 8, height: 60.0, mask: 15, shape: Box, width: 1000.0}
    GAME.GameOrientation: {radians: 0.0}
    GAME.GameDestructible: {cell_size: 4.0, min_fragment_cells: 12}
- name: Brazier
  prototype: Brazier
  components:
    GAME.GameTransform: {x: -330.0, "y": 190.0}
- name: Pillar left
  prototype: HardRock
  components:
    GAME.GameTransform: {x: 40.0, "y": 110.0}
    GAME.GameAppearance: {width: 36.0, height: 180.0, shape: Box, color: 1262571775}
    GAME.GameCollider: {category: 8, height: 180.0, mask: 15, shape: Box, width: 36.0}
    GAME.GameOrientation: {radians: 0.0}
- name: Pillar right
  prototype: HardRock
  components:
    GAME.GameTransform: {x: 210.0, "y": 110.0}
    GAME.GameAppearance: {width: 36.0, height: 180.0, shape: Box, color: 1262571775}
    GAME.GameCollider: {category: 8, height: 180.0, mask: 15, shape: Box, width: 36.0}
    GAME.GameOrientation: {radians: 0.0}
- name: Flash rock
  prototype: HardRock
  components:
    GAME.GameTransform: {x: -120.0, "y": 150.0}
    GAME.GameFlash: {decay: 2.5}
  behaviors: [RenderLabFlash]
- name: Flash basalt
  prototype: HardRock
  components:
    GAME.GameTransform: {x: -200.0, "y": 60.0}
    GAME.GameShader: {material: Basalt}
    GAME.GameFlash: {decay: 2.5}
  behaviors: [RenderLabFlash]
- name: Flash drone
  prototype: Lamp
  components:
    GAME.GameTransform: {x: -40.0, "y": 20.0}
    GAME.GameAppearance: {color: 1789619455, height: 26.0, shape: Diamond, width: 26.0}
    GAME.GameMaterial: {emission_color: 0, scene: 1789619455, albedo: 1789619455}
    GAME.GameFlash: {decay: 2.5}
  behaviors: [RenderLabFlash]
- name: Glass slab
  prototype: GlassSlab
  components:
    GAME.GameTransform: {x: -110.0, "y": -80.0}
    GAME.GameOrientation: {radians: 0.15}
- name: Pool
  prototype: Liquid
  components:
    GAME.GameTransform: {x: 330.0, "y": 165.0}
    GAME.GameFluidVolume: {width: 250.0, height: 70.0}
- name: Pool lamp
  prototype: Lamp
  components:
    GAME.GameTransform: {x: 300.0, "y": 108.0}
    GAME.GameAppearance: {color: 4294955263, height: 10.0, shape: Circle, width: 10.0}
    GAME.GameMaterial:
      emission_color: 4291213311
      emission_intensity: 0.5
      emission_multiplier: 1.0
      scene: 4294955263
- {name: Free motion, prototype: FreeMotionSystem}
- name: Comet
  prototype: Comet
  components:
    GAME.GameTransform: {x: -560.0, "y": -40.0}
    GAME.GameVelocity: {x: 230.0, "y": -40.0}
- name: Ember comet
  prototype: Comet
  components:
    GAME.GameTransform: {x: -620.0, "y": -120.0}
    GAME.GameVelocity: {x: 260.0, "y": 60.0}
    GAME.GameTrail: {color: 4288233727, emission: 0.7, lifetime: 0.35, width: 5.0}
    GAME.GameMaterial:
      emission_color: 4288233727
      emission_intensity: 0.8
      emission_multiplier: 1.0
      scene: 4294967295
- name: Pulse
  prototype: RenderLabAnchor
  components:
    GAME.GameTransform: {x: 120.0, "y": 60.0}
  behaviors: [RenderLabPulse]
