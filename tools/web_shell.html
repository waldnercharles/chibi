<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Chibi</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080b11; }
    #canvas { display: block; width: 100%; height: 100%; border: 0; outline: none; touch-action: none; }
    #status {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      box-sizing: border-box; max-width: calc(100% - 32px); margin: 0; padding: 12px 18px;
      border: 1px solid #303746; border-radius: 8px; background: #101620;
      color: #d9e1ed; font: 14px/1.5 system-ui, sans-serif; text-align: center;
      overflow-wrap: anywhere; pointer-events: none;
    }
    #status[data-error] { border-color: #9d4b55; color: #ffd9dd; }
    #status button {
      margin-left: 12px; padding: 2px 10px; border: 1px solid #303746; border-radius: 6px;
      background: #1b2330; color: inherit; font: inherit; cursor: pointer; pointer-events: auto;
    }
    #collab-controls {
      position: fixed; z-index: 2; top: 12px; right: 12px; display: grid; grid-template-columns: 1fr auto auto;
      gap: 8px; width: min(560px, calc(100% - 24px)); box-sizing: border-box; padding: 10px;
      border: 1px solid #303746; border-radius: 8px; background: #101620eF;
      color: #d9e1ed; font: 13px/1.4 system-ui, sans-serif; box-shadow: 0 8px 28px #0008;
    }
    #collab-status { grid-column: 1 / -1; overflow-wrap: anywhere; }
    #collab-status[data-error] { color: #ffd9dd; }
    #collab-controls input, #collab-controls button {
      min-width: 0; box-sizing: border-box; padding: 7px 9px; border: 1px solid #303746; border-radius: 6px;
      background: #0b1018; color: inherit; font: inherit;
    }
    #collab-controls button { background: #1b2330; cursor: pointer; }
    #collab-controls .invite { grid-column: 1 / 2; }
    #collab-controls .admin { grid-column: 1 / 2; }
    #collab-controls .wide { grid-column: 1 / -1; }
    @media (max-width: 560px) {
      #collab-controls { grid-template-columns: 1fr 1fr; }
      #collab-controls .invite { grid-column: 1 / -1; }
      #collab-controls .admin { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Chibi"></canvas>
  <p id="status" role="status" aria-live="polite">Loading Chibi...</p>
  <section id="collab-controls" aria-label="Collaboration room">
    <span id="collab-status" role="status" aria-live="polite">Collaboration is disconnected.</span>
    <input id="collab-invite" class="invite" type="text" autocomplete="off" placeholder="Paste a room invite link or code" aria-label="Room invite">
    <button id="collab-join" type="button">Join</button>
    <button id="collab-leave" type="button">Leave</button>
    <input id="collab-admin" class="admin" type="password" autocomplete="off" placeholder="Admin token for production room creation" aria-label="Room creation token">
    <button id="collab-host" type="button">Host room</button>
    <button id="collab-viewer" type="button">Copy viewer invite</button>
    <button id="collab-editor" type="button">Copy editor invite</button>
  </section>
  <noscript>JavaScript is required to run Chibi.</noscript>
  <script>
    var Module = (() => {
      const canvas = document.getElementById('canvas');
      const status = document.getElementById('status');
      let lastError = '';
      const showError = message => {
        status.dataset.error = '';
        status.textContent = String(message);
        status.hidden = false;
      };
      // Once Chibi stops, offer the actions a workspace script provides, e.g. exporting its project.
      const showStopped = message => {
        showError(message);
        for (const [label, run] of Module['recovery'] || []) {
          const button = document.createElement('button');
          button.textContent = label;
          button.onclick = run;
          status.append(button);
        }
      };
      // A trackpad pinch arrives as a wheel with Ctrl held, or in Safari as gesture events.
      // Both become the pinch SDL reports natively, and the page itself never zooms.
      const pinch = scale => Module['_studio_web_pinch']?.(scale);
      let gestureScale = 0; // Safari's scale so far in its gesture; 0 outside one
      window.addEventListener('wheel', event => {
        if (!event.ctrlKey) return;
        event.preventDefault();
        event.stopPropagation(); // SDL would take it for a plain wheel
        if (gestureScale) return;
        // Wheel steps as SDL counts them; Chrome sends a pinch as 100 * ln(scale) pixels.
        // One event never more than doubles or halves the zoom.
        const steps = event.deltaY * [0.01, 1 / 3, 80][event.deltaMode];
        pinch(Math.exp(-Math.max(-Math.LN2, Math.min(Math.LN2, steps))));
      }, { capture: true, passive: false });
      for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
        window.addEventListener(type, event => {
          event.preventDefault();
          if (gestureScale) pinch(event.scale / gestureScale);
          gestureScale = type === 'gestureend' ? 0 : event.scale;
        }, { capture: true, passive: false });
      }
      canvas.addEventListener('contextmenu', event => event.preventDefault());
      canvas.addEventListener('pointerdown', () => canvas.focus());
      const collabStatus = document.getElementById('collab-status');
      window.addEventListener('chibi-collab-status', event => {
        collabStatus.textContent = event.detail.text;
        if (event.detail.error) collabStatus.dataset.error = '';
        else delete collabStatus.dataset.error;
      });
      document.getElementById('collab-host').onclick = () => {
        const token = document.getElementById('collab-admin').value;
        document.getElementById('collab-admin').value = '';
        Module['chibiCollab']?.control('host', token);
      };
      document.getElementById('collab-join').onclick = () =>
        Module['chibiCollab']?.control('join', document.getElementById('collab-invite').value.trim());
      document.getElementById('collab-leave').onclick = () => Module['chibiCollab']?.control('leave');
      document.getElementById('collab-viewer').onclick = () => Module['chibiCollab']?.control('invite_viewer');
      document.getElementById('collab-editor').onclick = () => Module['chibiCollab']?.control('invite_editor');
      canvas.addEventListener('webglcontextlost', event => {
        event.preventDefault();
        showError('Graphics context lost. Reload this page to continue.');
      });
      window.addEventListener('error', event => {
        showStopped(event.message || 'Could not load Chibi. Reload this page to retry.');
      }, true);
      window.addEventListener('unhandledrejection', event => showStopped(event.reason));
      return {
        canvas,
        showError,
        showStopped,
        print: (...args) => console.log(...args),
        printErr: (...args) => {
          lastError = args.join(' ');
          console.error(...args);
        },
        setStatus: text => {
          if ('error' in status.dataset) return;
          const progress = text.match(/\((\d+)\/(\d+)\)/);
          if (progress) text = `Loading Chibi... ${Math.floor(100 * progress[1] / progress[2])}%`;
          status.textContent = text;
          status.hidden = !text;
        },
        onAbort: reason => showStopped(lastError || `Could not run Chibi: ${reason}`),
        onExit: code => {
          if (code) showStopped(lastError || `Chibi stopped with error ${code}.`);
        }
      };
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
