- id: 407
  kind: function
  name: Roll Gain
  math_expression: max(Acceleration,0)*max(Delta,0)
  expression_mode: 1
  entry_id: 845
  return_id: 847
  call_depth_limit: 64
- id: 437
  kind: function
  name: Desired Roll
  math_expression: Strafe*max(Speed,0)*(pi/180)*(1-min(max(Rocking,0),0.85)*cos(Position*4))
  expression_mode: 1
  entry_id: 871
  return_id: 873
  call_depth_limit: 64
- id: 517
  kind: function
  name: Roll Velocity
