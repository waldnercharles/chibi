name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC: clang-18
  CXX: clang++-18
  # Native builds and players need a runtime directory and a silent audio device.
  XDG_RUNTIME_DIR: /tmp/chibi-runtime
  SDL_AUDIODRIVER: dummy

jobs:
  native:
    name: Engine build and native tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-18-dev libclang-rt-18-dev \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
      - name: Identify dependency sources
        id: deps
        run: echo "key=$(python3 tools/fetchcontent_cache.py fingerprint --source-dir .)" >> "$GITHUB_OUTPUT"
      # Only main saves the caches; pull requests restore them.
      - name: Restore dependencies
        id: dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/chibi-fetchcontent
            ~/.cache/chibi-dependency-packages
          # Holds the Debug and Release dependency packages.
          key: native-deps-debug-release-${{ runner.os }}-clang18-${{ steps.deps.outputs.key }}
          restore-keys: native-deps-debug-release-${{ runner.os }}-clang18-
      - name: Build chibi_ctl and the test drivers (ASan and UBSan)
        run: make test-build LIBCLANG_ROOT=/usr/lib/llvm-18
      # The only engine build on fork pull requests, which skip the Studio job.
      - name: Build chibi, chibi-compile and chibi-player
        run: make build LIBCLANG_ROOT=/usr/lib/llvm-18
      # validate-project runs chibi_ctl dozens of times, and published-docs runs
      # chibi-compile --docs, both too slowly under sanitizers.
      - name: Build an unsanitized chibi_ctl and chibi-compile (Release)
        run: make build-release BUILD_TARGET='chibi_ctl chibi-compile' LIBCLANG_ROOT=/usr/lib/llvm-18
      - name: Save dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/chibi-fetchcontent
            ~/.cache/chibi-dependency-packages
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
      # After make build, whose build/reflect the reflection identity cases run.
      - name: Tooling and process integrations (one 60-second deadline)
        run: make test-tools TOOLS_C_COMPILER=clang-18
      - name: Native selectors (one 60-second deadline)
        run: make test-native LIBCLANG_ROOT=/usr/lib/llvm-18
      - name: Material selectors (one 60-second deadline)
        run: make test-materials LIBCLANG_ROOT=/usr/lib/llvm-18
      - name: Project selectors (one 60-second deadline)
        run: make test-projects LIBCLANG_ROOT=/usr/lib/llvm-18
      - name: Language selectors (one 60-second deadline)
        run: make test-language-all LIBCLANG_ROOT=/usr/lib/llvm-18

  native-macos:
    name: Engine build and native tests (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      XDG_RUNTIME_DIR: /tmp/chibi-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          brew install llvm
          LLVM="$(brew --prefix llvm)"
          echo "LLVM=$LLVM" >> "$GITHUB_ENV"
          echo "CC=$LLVM/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$LLVM/bin/clang++" >> "$GITHUB_ENV"
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
      - name: Identify dependency sources
        id: deps
        run: echo "key=$(python3 tools/fetchcontent_cache.py fingerprint --source-dir .)" >> "$GITHUB_OUTPUT"
      # Only main saves the caches; pull requests restore them.
      - name: Restore dependencies
        id: dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/chibi-fetchcontent
            ~/.cache/chibi-dependency-packages
          # Holds the Debug and Release dependency packages.
          key: native-deps-debug-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.deps.outputs.key }}
          restore-keys: native-deps-debug-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Build chibi_ctl and the test drivers (ASan and UBSan)
        run: make test-build LIBCLANG_ROOT="$LLVM"
      - name: Build chibi, chibi-compile and chibi-player
        run: make build LIBCLANG_ROOT="$LLVM"
      # validate-project runs chibi_ctl dozens of times, and published-docs runs
      # chibi-compile --docs, both too slowly under sanitizers.
      - name: Build an unsanitized chibi_ctl and chibi-compile (Release)
        run: make build-release BUILD_TARGET='chibi_ctl chibi-compile' LIBCLANG_ROOT="$LLVM"
      - name: Save dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/chibi-fetchcontent
            ~/.cache/chibi-dependency-packages
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
      # After make build, whose build/reflect the reflection identity cases run.
      - name: Tooling and process integrations (one 60-second deadline)
        run: make test-tools TOOLS_C_COMPILER="$CC"
      - name: Native selectors (one 60-second deadline)
        run: make test-native LIBCLANG_ROOT="$LLVM"
      - name: Material selectors (one 60-second deadline)
        run: make test-materials LIBCLANG_ROOT="$LLVM"
      - name: Project selectors (one 60-second deadline)
        run: make test-projects LIBCLANG_ROOT="$LLVM"
      - name: Language selectors (one 60-second deadline)
        run: make test-language-all LIBCLANG_ROOT="$LLVM"

  windows:
    name: Engine build and compile smoke test (Windows)
    runs-on: windows-2022
    timeout-minutes: 45
    # The Windows port is new; keep this row advisory until it has passed once.
    continue-on-error: true
    steps:
      # No later step needs the token on disk.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No third-party actions run beside the checkouts, and CMake and Ninja are
      # pinned by hash in .github/build-tools.txt.
      - name: Set up MSVC, CMake, Ninja and LLVM
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
          python -m venv "$env:RUNNER_TEMP\cmake"
          & "$env:RUNNER_TEMP\cmake\Scripts\pip" install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          "$env:RUNNER_TEMP\cmake\Scripts" >> $env:GITHUB_PATH
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DCHIBI_ENABLE_SANITIZERS=OFF -DLIBCLANG_ROOT="C:/Program Files/LLVM"
      - name: Build the SDK tools
        run: cmake --build build --target chibi chibi-compile chibi-player chibi_ctl
      # The 60-second test ceiling; the test supervisor is POSIX-only.
      - name: Compile a project
        timeout-minutes: 1
        run: build/sdk/chibi-compile.exe --project-root "$PWD/test/fixtures/studio" --output "$env:RUNNER_TEMP/game.chibip"

  studio-windows:
    name: Studio build (Windows)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: windows-2022
    timeout-minutes: 45
    # Studio on Windows is new; keep this row advisory until it has passed once.
    continue-on-error: true
    steps:
      # No later step needs the token on disk.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Studio checkout access
        env:
          TOKEN: ${{ secrets.CHIBI_STUDIO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add a CHIBI_STUDIO_TOKEN secret that can read waldnercharles/chibi-studio."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: waldnercharles/chibi-studio
          token: ${{ secrets.CHIBI_STUDIO_TOKEN }}
          path: chibi-studio
          persist-credentials: false
      # No third-party actions run beside the checkouts, and CMake and Ninja are
      # pinned by hash in .github/build-tools.txt.
      - name: Set up MSVC, CMake, Ninja and LLVM
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
          python -m venv "$env:RUNNER_TEMP\cmake"
          & "$env:RUNNER_TEMP\cmake\Scripts\pip" install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          "$env:RUNNER_TEMP\cmake\Scripts" >> $env:GITHUB_PATH
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - name: Configure the engine
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DCHIBI_ENABLE_SANITIZERS=OFF -DLIBCLANG_ROOT="C:/Program Files/LLVM"
      - name: Build the engine
        run: cmake --build build
      - name: Install the SDK
        run: cmake --install build --prefix "$env:RUNNER_TEMP/sdk"
      # The SDK pins its C runtime, so Studio must use the engine's build type.
      - name: Configure Studio against the installed SDK
        run: cmake -S chibi-studio -B build-studio -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/sdk"
      # The runner has no GPU for SDL_GPU, so this job only builds Studio.
      - name: Build Studio
        run: cmake --build build-studio --target chibi-studio

  studio:
    name: Studio build and startup
    # Pull requests from forks and Dependabot get no secrets, so they can't check out Studio.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require Studio checkout access
        env:
          TOKEN: ${{ secrets.CHIBI_STUDIO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add a CHIBI_STUDIO_TOKEN secret that can read waldnercharles/chibi-studio."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: waldnercharles/chibi-studio
          token: ${{ secrets.CHIBI_STUDIO_TOKEN }}
          path: chibi-studio
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-18-dev xvfb \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
      - name: Identify dependency sources
        id: deps
        run: echo "key=$(python3 tools/fetchcontent_cache.py fingerprint --source-dir .)" >> "$GITHUB_OUTPUT"
      # Only main saves the caches; pull requests restore them.
      - name: Restore dependencies
        id: dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/chibi-fetchcontent
            ~/.cache/chibi-dependency-packages
          key: studio-deps-${{ runner.os }}-clang18-${{ steps.deps.outputs.key }}
          restore-keys: studio-deps-${{ runner.os }}-clang18-
      - name: Package the SDK
        run: make package-sdk SDK_PREFIX=dist/sdk LIBCLANG_ROOT=/usr/lib/llvm-18
      - name: Save dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/chibi-fetchcontent
            ~/.cache/chibi-dependency-packages
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
      - name: Build Studio against the packaged SDK
        run: make studio-build STUDIO_SOURCE="$PWD/chibi-studio" STUDIO_SDK_PREFIX=dist/sdk
      - name: Two hidden Studio frames
        shell: bash
        run: |
          timeout --kill-after=10 60 xvfb-run -a build-studio/bin/chibi-dev \
            --project-root chibi-studio/projects/starter --headless --frames 2 --fixed-dt 0.0166667 2>&1 | tee studio.log
          ! grep -E 'Studio UI:|runtime frame failed|Could not initialize' studio.log

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          python3 -m venv /tmp/clang-format
          /tmp/clang-format/bin/pip install --only-binary=:all: clang-format==22.1.0
          echo '/tmp/clang-format/bin' >> "$GITHUB_PATH"
      - name: Check format
        run: sh tools/clang-format.sh --check
