name: Documentation site

# Builds docs plus the real browser formatter. Manual runs validate
# without deploying unless explicitly requested. Existing Pages protections stay.
on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/site.kdl"
      - "docs/guide/formatter.md"
      - "tools/docs/**"
      - "test/tools/docs_website.c"
      - "test/tools/formatter_web.c"
      - "src/authoring/source_format*"
      - "src/language/syntax.*"
      - "src/language/src/**"
      - "src/support/array.h"
      - "src/support/xalloc.*"
      - "third_party/CMakeLists.txt"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified complete documentation website
        type: boolean
        default: false

permissions:
  contents: read

# One deployment at a time; a queued run waits rather than cancelling one that
# is publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The pinned third-party archive downloads from this repository's releases.
  GH_TOKEN: ${{ github.token }}
  CC: clang-18
  CXX: clang++-18
  EMSDK_VERSION: 6.0.10

jobs:
  site:
    name: Build the documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tools-18 libclang-18-dev libclang-rt-18-dev \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
      # Generation uses optimized helpers, as in native CI. Products below keep
      # the sanitizer profile; this does not replace sanitizer validation.
      - name: Build Release generator helpers
        run: |
          make build-release BUILD_TARGET='chibi-build-host chibi-compiler-host' LIBCLANG_ROOT=/usr/lib/llvm-18
          sha256sum build-release/sdk/chibi-build-host build-release/sdk/chibi-build-host.chibi-record \
            build-release/sdk/chibi-compiler-host build-release/sdk/chibi-compiler-host.chibi-record \
            > "$RUNNER_TEMP/docs-generator-helpers.sha256"
      - name: Build chibi and chibi-compile
        run: |
          make build BUILD_PROFILE=sanitizer BUILD_HOST="$PWD/build-release/sdk/chibi-build-host" \
            ASSET_GENERATOR_HOSTS=build-release/sdk LIBCLANG_ROOT=/usr/lib/llvm-18
      - name: Preserve failed Graph stage log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-graph-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .chibi/logs/*-graph.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Verify helper identity and sanitized documentation tools
        run: |
          sha256sum --check "$RUNNER_TEMP/docs-generator-helpers.sha256"
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          import runpy
          check = runpy.run_path('.github/verify-native-profile.py')
          require = check['require']
          database = json.loads(Path('build/compile_commands.json').read_text())
          for source in ('src/host/chibi_main.c', 'src/host/compile_main.c'):
              entries = [entry for entry in database if entry['file'].endswith('/' + source)]
              require(len(entries) == 1, f'missing or ambiguous compile entry: {source}')
              entry = entries[0]
              arguments = check['argv'](entry)
              check['sanitizer_flags'](arguments, True)
              require('-g' in arguments and '-g0' not in arguments and
                      '-fno-omit-frame-pointer' in arguments and '-fomit-frame-pointer' not in arguments,
                      f'debug/frame-pointer flags differ: {source}')
              require(not any(arg.startswith('-O') for arg in arguments),
                      f'default Debug optimization changed: {source}')
              require(not any(arg.startswith('-DNDEBUG') or arg == 'NDEBUG' for arg in arguments),
                      f'assertions disabled: {source}')
              check['execution_record'](Path(entry['output']), arguments)
          links = json.loads(Path('build/link_commands.json').read_text())
          for target in ('chibi', 'chibi-compile', 'chibi-player', 'chibi_ctl'):
              entries = [entry for entry in links if Path(entry['output']).name == target]
              require(len(entries) == 1, f'missing or ambiguous link entry: {target}')
              entry = entries[0]
              arguments = check['argv'](entry)
              binary = Path(entry['output'])
              check['sanitizer_flags'](arguments, True)
              check['execution_record'](binary, arguments)
              print(target, check['symbols'](binary, True))
          PYTHON
      - name: Build the site
        run: build/sdk/chibi doc
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Provision the pinned formatter parser runtime
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/tree-sitter/tree-sitter.git "$RUNNER_TEMP/tree-sitter"
          git -C "$RUNNER_TEMP/tree-sitter" checkout --detach da6fe9beb4f7f67beb75914ca8e0d48ae48d6406
      - name: Build the browser formatter from this exact source
        run: |
          python3 tools/docs/formatter/build.py --runtime "$RUNNER_TEMP/tree-sitter" \
            --output "$RUNNER_TEMP/formatter"
      - name: Check website packaging and native formatter boundaries
        run: python3 tools/docs/check.py --runtime "$RUNNER_TEMP/tree-sitter"
      - name: Compose the complete website
        run: |
          python3 tools/docs/package.py compose --docs build/docs --formatter "$RUNNER_TEMP/formatter" \
            --revision "$GITHUB_SHA" --output build/website
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/website

  deploy:
    name: Deploy the documentation site
    needs: site
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
