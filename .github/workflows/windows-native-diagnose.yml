name: Windows counted Unicode regression
# Temporary ordinary compiler regression using the checked retained compiler.
# Fresh-source self-host proof remains separate. No debugger or dump collection.
on:
  workflow_dispatch:
  push:
    branches: [claude/windows-self-build]
    paths:
      - .github/workflows/windows-native-diagnose.yml
      - .github/native-llvm-windows.ps1
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 585e408295d1ee250c0397670c1b536d29afd02b
          path: frozen
          persist-credentials: false
      - name: Validate the exact compiler producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/41490730505" | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.head_sha -ne '585e408295d1ee250c0397670c1b536d29afd02b' -or
              $run.repository.full_name -ne $env:GITHUB_REPOSITORY -or $run.path -ne '.github/workflows/native-self-host.yml' -or
              $run.status -ne 'completed') { throw 'Retained compiler producer identity differs' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/41490730505/jobs?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot inspect the retained fixed point' }
          $proof = @($jobs.jobs | Where-Object { $_.name -eq 'Native self-host (Windows)' })
          $fixed = @($proof.steps | Where-Object { $_.name -eq 'Build the Windows compiler to a fixed point' -and $_.conclusion -eq 'success' })
          if ($proof.Count -ne 1 -or $fixed.Count -ne 1) { throw 'Producer did not prove its Windows fixed point' }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/41490730505/artifacts" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot inspect the retained compiler artifact' }
          $artifact = @($artifacts.artifacts | Where-Object { $_.id -eq 13164298659 -and $_.name -eq 'native-windows-fixed-point' -and !$_.expired })
          if ($artifact.Count -ne 1 -or $artifact[0].workflow_run.head_sha -ne $run.head_sha) { throw 'Retained compiler artifact differs' }
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 13164298659
          run-id: 41490730505
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained
          merge-multiple: true
      - name: Verify the retained fixed-point bytes
        id: retained
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'd9a56bde96fdce41d9b9c335f5120dc4ec659c8aad62ddf0641d4eb9e909f96f'
          foreach ($number in 4, 5) {
            $actual = (Get-FileHash "$env:RUNNER_TEMP/retained/stage$number/chibi.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Retained stage$number SHA-256 differs" }
          }
          "Diagnostic compiler source585e408295d1ee250c0397670c1b536d29afd02b stage4==5 sha256 $expected" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/cache/restore@v4
        id: llvm-cache
        with:
          path: ${{ runner.temp }}/clang+llvm-22.1.8-x86_64-pc-windows-msvc/bin
          key: llvm-windows-x64-22.1.8-d96c2cc1736f4eb7fa43cb9bbdf56d93551a9ae0a9aadb9c99c3c3b2b712a234
      - name: Install verified LLVM if needed
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: '& ./harness/.github/native-llvm-windows.ps1'
      - name: Check the LLVM tools
        id: llvm
        run: |
          $ErrorActionPreference = 'Stop'
          $llvm = "$env:RUNNER_TEMP/clang+llvm-22.1.8-x86_64-pc-windows-msvc/bin"
          foreach ($tool in 'opt', 'llc', 'lld-link') {
            & "$llvm/$tool.exe" --version
            if ($LASTEXITCODE) { throw "LLVM tool $tool is unusable" }
          }
          "CHIBI_WINDOWS_LLVM=$llvm" >> $env:GITHUB_ENV
      - name: Run the current Windows OS and object regression
        if: ${{ !cancelled() && steps.retained.outcome == 'success' && steps.llvm.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$PWD/harness".Replace('\', '/')
          $work = $env:RUNNER_TEMP.Replace('\', '/')
          & "$work/retained/stage4/chibi.exe" --compiler "$root/tools/compiler" --core "$root/packages/core" --source "$root/test/native_aot/link/windows/Main.chibi" --collection "graph=$root/tools/graph" --entry Main --output "$work/windows-objects.exe" --llvm $env:CHIBI_WINDOWS_LLVM --target x86_64-pc-windows-msvc --jobs 4
          if ($LASTEXITCODE) { throw 'Could not compile the Windows OS regression' }
          & "$work/windows-objects.exe" $env:CHIBI_WINDOWS_LLVM $work
          if ($LASTEXITCODE) { throw 'The Windows OS regression failed' }
      - name: Run the current authored Windows build runner
        if: ${{ !cancelled() && steps.retained.outcome == 'success' && steps.llvm.outcome == 'success' }}
        run: |
          & ./harness/test/bootstrap/native-runner.ps1 -Compiler "$env:RUNNER_TEMP/retained/stage4/chibi.exe" -Llvm $env:CHIBI_WINDOWS_LLVM
      - name: Capture actual UCRT float formatting bytes
        if: ${{ !cancelled() && steps.retained.outcome == 'success' && steps.llvm.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = @'
          package formatter_probe
          foreign import win "system:kernel32"
          foreign win {
              GetStdHandle :: (kind: i32) -> u64
              WriteFile :: (handle: u64, data: u8[], size: u32, written: u32[], overlap: u64) -> i32
          }
          Main :: () -> int {
              single: f32 = 1.25
              text := format_text("{}|{:.1f}|{:e}|{:a}", single, int(42), single, single)
              bytes: u8[] = []
              for (byte in text_bytes(text)) { bytes.append(u8(byte)) }
              written: u32[] = [0]
              status := WriteFile(GetStdHandle(-11), bytes, u32(length(bytes)), written, 0)
              if (status == 0 || written[0] != u32(length(bytes))) { return 1 }
              return 0
          }
          '@
          $path = "$env:RUNNER_TEMP/formatter-probe.chibi"
          [IO.File]::WriteAllText($path, $probe)
          & "$env:RUNNER_TEMP/retained/stage4/chibi.exe" --compiler "$PWD/harness/tools/compiler" --core "$PWD/harness/packages/core" --source $path --entry Main --output "$env:RUNNER_TEMP/formatter-probe.exe" --llvm $env:CHIBI_WINDOWS_LLVM --target x86_64-pc-windows-msvc --jobs 2
          if ($LASTEXITCODE) { throw 'Could not compile the UCRT formatter probe' }
          $actual = & "$env:RUNNER_TEMP/formatter-probe.exe"
          if ($LASTEXITCODE) { throw 'The UCRT formatter probe failed' }
          "UCRT mixed float actual: $actual" | Tee-Object -FilePath "$env:RUNNER_TEMP/formatter-actual.txt"
      - name: Keep the UCRT formatting bytes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-formatter-bytes
          path: ${{ runner.temp }}/formatter-actual.txt
          retention-days: 1
          if-no-files-found: warn
      - name: Run current scalar platform regressions
        if: ${{ !cancelled() && steps.retained.outcome == 'success' && steps.llvm.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$PWD/harness".Replace('\', '/')
          $work = $env:RUNNER_TEMP.Replace('\', '/')
          $failed = @()
          foreach ($source in 'test/native_aot/text_format/Main.chibi', 'test/native_aot/tasks/cases/timing/Main.chibi', 'test/native_aot/math_scalar/SquareRoot.chibi', 'test/native_aot/math_scalar/Shadow.chibi', 'test/bootstrap/fixtures/InstallPaths.chibi') {
            foreach ($level in 0, 2) {
              $output = "$work/scalar-probe.exe"
              & "$work/retained/stage4/chibi.exe" --compiler "$root/tools/compiler" --core "$root/packages/core" --source "$root/$source" --collection "graph=$root/tools/graph" --entry Main --output $output --llvm $env:CHIBI_WINDOWS_LLVM --target x86_64-pc-windows-msvc --jobs 2 --level $level
              if ($LASTEXITCODE) { $failed += "$source O$level compilation"; continue }
              & $output
              if ($LASTEXITCODE) { $failed += "$source O$level runtime"; continue }
              "PASS diagnostic Windows $source O$level" >> $env:GITHUB_STEP_SUMMARY
            }
          }
          if ($failed.Count) { throw ("Scalar failures: " + ($failed -join ', ')) }
      - name: Confirm the old compiler fails the original long Unicode asset output
        if: ${{ !cancelled() && steps.retained.outcome == 'success' && steps.llvm.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path ([IO.Path]::GetTempPath()) ('chibi-native-asset-Ω-' + [Guid]::NewGuid().ToString('N'))
          $asset = "$work/SDK/libexec/chibi/chibi-asset-compiler.exe"
          New-Item -ItemType Directory -Path "$work/SDK/libexec/chibi" | Out-Null
          try {
            $source = "$PWD/frozen".Replace('\', '/')
            $began = [Diagnostics.Stopwatch]::StartNew()
            & "$env:RUNNER_TEMP/retained/stage4/chibi.exe" --compiler "$source/tools/compiler" --core "$source/packages/core" --source "$source/tools/compiler/asset_driver/Main.chibi" --entry Main --output $asset --llvm $env:CHIBI_WINDOWS_LLVM --target x86_64-pc-windows-msvc --level 0 --jobs 2
            $status = $LASTEXITCODE
            $objects = @(Get-ChildItem -LiteralPath $work -File -Recurse -Filter '*.o')
            $minimum = [long]0
            foreach ($object in $objects) { $minimum += [Text.Encoding]::UTF8.GetByteCount($object.FullName) + 3 }
            "Old compiler long output: exit=$status objects=$($objects.Count) object-path argv UTF8 lower-bound=$minimum elapsed=$($began.Elapsed.TotalSeconds)s" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            if ($status -ne -1073741795 -or $minimum -lt 4096) { throw 'The old compiler did not reproduce its long-command CString failure' }
          } finally {
            Remove-Item -LiteralPath $work -Recurse -Force
          }
      - name: Build the frozen compiler with only counted Windows text conversion
        if: ${{ !cancelled() && steps.retained.outcome == 'success' && steps.llvm.outcome == 'success' }}
        id: repaired
        run: |
          $ErrorActionPreference = 'Stop'
          $source = "$env:RUNNER_TEMP/fixed-source"
          New-Item -ItemType Directory -Path "$source/tools", "$source/packages", "$env:RUNNER_TEMP/fixed" | Out-Null
          Copy-Item ./frozen/tools/compiler "$source/tools/compiler" -Recurse
          Copy-Item ./frozen/packages/core "$source/packages/core" -Recurse
          $path = "$source/packages/core/sys/windows/Windows.chibi"
          $old = [IO.File]::ReadAllText($path)
          $new = [IO.File]::ReadAllText("$PWD/harness/packages/core/sys/windows/Windows.chibi")
          $start = $new.IndexOf('Wide :: (text: string)')
          $end = $new.IndexOf('// The text of the first', $start)
          $wide = $new.Substring($start, $end - $start)
          $start = $old.IndexOf('Wide :: (text: string)')
          $end = $old.IndexOf('// The text of the first', $start)
          if ($start -lt 0 -or $end -le $start -or !$wide.Contains('i32(length(bytes))')) { throw 'Counted conversion patch differs' }
          $patched = $old.Substring(0, $start) + $wide + $old.Substring($end)
          $patched = $patched.Replace('text: cstring, length: i32, wide: u16[]', 'text: u8[], length: i32, wide: u16[]')
          if ($patched -eq $old) { throw 'Counted conversion patch did not change the old compiler' }
          [IO.File]::WriteAllText($path, $patched)
          & "$env:RUNNER_TEMP/retained/stage4/chibi.exe" --compiler "$source/tools/compiler" --core "$source/packages/core" --output "$env:RUNNER_TEMP/fixed/chibi.exe" --llvm $env:CHIBI_WINDOWS_LLVM --target x86_64-pc-windows-msvc --jobs 2
          if ($LASTEXITCODE) { throw 'Could not build the isolated counted-conversion candidate' }
          $sha = (Get-FileHash "$env:RUNNER_TEMP/fixed/chibi.exe").Hash.ToLowerInvariant()
          "Diagnostic fixed candidate, frozen585e plus only Windows counted conversion, sha256 $sha" >> $env:GITHUB_STEP_SUMMARY
      - name: Replay the original long Unicode asset build and C bridge with the fixed compiler
        if: ${{ !cancelled() && steps.repaired.outcome == 'success' }}
        run: |
          & ./harness/test/native_aot/asset_compiler/Bridge.ps1 -Compiler "$env:RUNNER_TEMP/fixed/chibi.exe" -Llvm $env:CHIBI_WINDOWS_LLVM
