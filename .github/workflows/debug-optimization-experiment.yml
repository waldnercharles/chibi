name: Debug optimization and instrumentation experiment (manual, not full CI)

on:
  workflow_dispatch:
    inputs:
      comparison:
        description: 'Optimization: O1/O2 per profile; instrumentation: one O1 on/off pair'
        required: true
        type: choice
        default: optimization
        options:
          - optimization
          - instrumentation
      sha:
        description: 'Exact reviewed commit SHA containing the experiment runner'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: debug-optimization-experiment
  cancel-in-progress: false

jobs:
  linux-pair:
    name: Linux ${{ inputs.comparison }} pair (${{ matrix.sanitizers }}) (not full-suite validation)
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ${{ fromJSON(inputs.comparison == 'instrumentation' && '["on"]' || '["on","off"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      XDG_RUNTIME_DIR: /tmp/chibi-runtime
      SDL_AUDIODRIVER: dummy
      EXPECTED_SHA: ${{ inputs.sha }}
      EXPERIMENT_COMPARISON: ${{ inputs.comparison }}
      EXPERIMENT_SANITIZERS: ${{ matrix.sanitizers }}
    steps:
      - name: Record job start
        run: echo "JOB_STARTED_UTC=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      # Publication prerequisite: land the independently reviewed Ubuntu
      # provisioning repair first. No HTTP fallback or duplicated source rewrite.
      - name: Install the existing Linux native dependencies
        run: |
          test -f .github/install-ubuntu-dependencies.py
          python3 .github/install-ubuntu-dependencies.py clang-18 clang-tools-18 libclang-18-dev libclang-rt-18-dev llvm-18 lld-18 \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          python3 -m venv "$RUNNER_TEMP/experiment-cmake"
          "$RUNNER_TEMP/experiment-cmake/bin/pip" install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          echo "$RUNNER_TEMP/experiment-cmake/bin" >> "$GITHUB_PATH"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
      # Each matrix job owns its runner; builds within it are sequential.
      # Both jobs check out the same exact source and use its pinned archives.
      - name: Measure one matched pair
        run: python3 tools/debug_optimization_experiment.py --sha "$EXPECTED_SHA" --sanitizers "$EXPERIMENT_SANITIZERS" --comparison "$EXPERIMENT_COMPARISON" --output "$RUNNER_TEMP/debug-optimization-evidence"
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ inputs.comparison }}-${{ matrix.sanitizers }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/debug-optimization-evidence/*.json
            ${{ runner.temp }}/debug-optimization-evidence/*.jsonl
            ${{ runner.temp }}/debug-optimization-evidence/*.log
            ${{ runner.temp }}/debug-optimization-evidence/*.txt
            ${{ runner.temp }}/debug-optimization-evidence/*.h
            ${{ runner.temp }}/debug-optimization-evidence/*.tsv
          if-no-files-found: warn
          retention-days: 7
