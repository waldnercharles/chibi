name: CI control

# Starts CI for maintainers and agents whose own GitHub access cannot re-run or
# dispatch workflows. It acts only for a sender with write access, which GitHub
# requires for re-runs and dispatches anyway, only on branches of this
# repository, and only on the head commit the event named. It re-runs only the
# PR's own CI and compiler self-build runs, never publishing workflows.
# pull_request_target runs this file from main; it never checks out pull
# request code.
on:
  pull_request_target:
    types: [labeled, edited]

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  control:
    name: Start CI
    # ci-rerun or ci-seed, or a stacked pull request retargeted to main: CI
    # and the compiler self-build only run on pull requests into main.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' && contains(fromJSON('["ci-rerun", "ci-seed"]'), github.event.label.name)) ||
      (github.event.action == 'edited' && github.event.changes.base && github.event.pull_request.base.ref == 'main'))
    # Per operation, so unrelated labels and edits never replace a pending
    # request. Retargeting re-runs like the ci-rerun label.
    concurrency: ci-control-${{ github.event.pull_request.number }}-${{ github.event.label.name || 'ci-rerun' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OP: ${{ github.event.label.name || 'ci-rerun' }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SENDER: ${{ github.event.sender.login }}
    steps:
      - name: Require write access and the event's head commit
        run: |
          permission=$(gh api "repos/$GH_REPO/collaborators/$SENDER/permission" --jq .permission)
          case $permission in
            admin | write) ;;
            *) echo "::error::$SENDER has $permission access; re-runs and dispatches need write access."; exit 1 ;;
          esac
          head=$(gh api "repos/$GH_REPO/git/ref/heads/$HEAD_REF" --jq .object.sha)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::error::$HEAD_REF moved from $HEAD_SHA to $head. Label the PR again for the new head."
            exit 1
          fi
      - name: Re-run or start the PR's checks, or dispatch the seed
        run: |
          # Dispatch on the branch, then require the run to build HEAD_SHA:
          # the branch can move between the check above and the dispatch.
          dispatch() {
            run=$(gh api -X POST "repos/$GH_REPO/actions/workflows/$1/dispatches" \
              -f ref="$HEAD_REF" -F return_run_details=true "${@:2}" --jq .workflow_run_id)
            if [ -z "$run" ]; then
              echo "::error::Dispatching $1 returned no run id, so its commit can't be checked."
              exit 1
            fi
            sha=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .head_sha)
            if [ "$sha" != "$HEAD_SHA" ]; then
              gh run cancel "$run"
              echo "::error::Run $run of $1 built $sha instead of $HEAD_SHA; cancelled it."
              exit 1
            fi
            echo "Dispatched $1 on $HEAD_REF at $HEAD_SHA: run $run"
          }
          if [ "$OP" = ci-seed ]; then
            dispatch compiler-runtime-seed.yml -f 'inputs[publish]=true'
            exit 0
          fi
          # Only this PR's own runs of its required workflows: a push or
          # dispatch on another branch can share the commit. A pull_request
          # run awaiting approval, as after the seed pin's bot push, never
          # ran; the dispatched run beside it is the one to re-run.
          for workflow in ci.yml compiler-recovery.yml; do
            latest=$(gh run list --workflow "$workflow" --commit "$HEAD_SHA" --limit 100 \
              --json databaseId,event,headBranch,status,conclusion \
              --jq 'map(select((.event == "pull_request" or .event == "workflow_dispatch") and .headBranch == env.HEAD_REF
                               and .conclusion != "action_required"))
                    | max_by(.databaseId) // empty | "\(.databaseId) \(.status) \(.conclusion)"')
            read -r run status conclusion <<< "$latest"
            if [ -z "$run" ]; then
              if [ "$BASE" = main ]; then dispatch "$workflow"; fi
              continue
            fi
            case "$status $conclusion" in
              "completed failure" | "completed cancelled" | "completed timed_out")
                echo "Re-running failed jobs of $workflow run $run"
                gh run rerun "$run" --failed ;;
            esac
          done
      - name: Remove the label
        if: always() && github.event.action == 'labeled'
        run: gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/$OP"
