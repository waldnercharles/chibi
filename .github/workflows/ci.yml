name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC: clang-18
  CXX: clang++-18
  # Native builds and players need a runtime directory and a silent audio device.
  XDG_RUNTIME_DIR: /tmp/chibi-runtime
  SDL_AUDIODRIVER: dummy

jobs:
  tools:
    name: C tooling checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up CMake
        run: |
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install 'cmake>=4.2,<5'
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
      - name: Tooling and process integrations (one 60-second deadline)
        run: make test-tools TOOLS_C_COMPILER=clang-18

  native:
    name: Engine build and native tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-18-dev libclang-rt-18-dev \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install 'cmake>=4.2,<5'
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
      - name: Identify dependency sources
        id: deps
        run: echo "key=$(python3 tools/fetchcontent_cache.py fingerprint --source-dir .)" >> "$GITHUB_OUTPUT"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/chibi-fetchcontent
            ~/.cache/chibi-dependency-packages
          key: native-deps-${{ runner.os }}-clang18-${{ steps.deps.outputs.key }}
      - name: Build chibi_ctl and the test drivers (ASan and UBSan)
        run: make test-build LIBCLANG_ROOT=/usr/lib/llvm-18
      - name: Native selectors (one 60-second deadline)
        run: make test-native LIBCLANG_ROOT=/usr/lib/llvm-18
      - name: Language selectors (one 60-second deadline)
        run: make test-language-all LIBCLANG_ROOT=/usr/lib/llvm-18

  studio:
    name: Studio build and startup
    # Pull requests from forks get no secrets, so they can't check out Studio.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require Studio checkout access
        env:
          TOKEN: ${{ secrets.CHIBI_STUDIO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add a CHIBI_STUDIO_TOKEN secret that can read waldnercharles/chibi-studio."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: waldnercharles/chibi-studio
          token: ${{ secrets.CHIBI_STUDIO_TOKEN }}
          path: chibi-studio
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-18-dev ninja-build xvfb \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install 'cmake>=4.2,<5'
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
      - name: Identify dependency sources
        id: deps
        run: echo "key=$(python3 tools/fetchcontent_cache.py fingerprint --source-dir .)" >> "$GITHUB_OUTPUT"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/chibi-fetchcontent
            ~/.cache/chibi-dependency-packages
          key: studio-deps-${{ runner.os }}-clang18-${{ steps.deps.outputs.key }}
      - name: Package the SDK
        run: make package-sdk SDK_PREFIX=dist/sdk LIBCLANG_ROOT=/usr/lib/llvm-18
      - name: Build Studio against the packaged SDK
        run: make studio-build STUDIO_SOURCE="$PWD/chibi-studio" STUDIO_SDK_PREFIX=dist/sdk
      - name: Two hidden Studio frames
        shell: bash
        run: |
          timeout --kill-after=10 60 xvfb-run -a build-studio/bin/chibi-dev \
            --project-root chibi-studio/projects/starter --headless --frames 2 --fixed-dt 0.0166667 2>&1 | tee studio.log
          ! grep -E 'Studio UI:|runtime frame failed|Could not initialize' studio.log

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          python3 -m venv /tmp/clang-format
          /tmp/clang-format/bin/pip install --only-binary=:all: clang-format==22.1.0
          echo '/tmp/clang-format/bin' >> "$GITHUB_PATH"
      - name: Check format
        run: sh tools/clang-format.sh --check
