name: CI
run-name: "CI · ${{ (github.event_name == 'schedule' || inputs.sanitizers == true) && 'ASan + UBSan' || 'fast Debug O1' }} · ${{ github.event_name }}"

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      sanitizers:
        description: 'Run full ASan + UBSan validation (including major releases)'
        required: false
        type: boolean
        default: false
      studio_sha:
        description: 'Optional exact Studio SHA for additional native/Web SDK verification'
        required: false
        type: string
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ (github.event_name == 'schedule' || inputs.sanitizers == true) && 'sanitizer' || 'fast' }}
  # Finish one trusted main run so successful native jobs can publish their cache.
  # The default single pending slot keeps only the newest queued main run.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  CHIBI_CI_SANITIZERS: ${{ (github.event_name == 'schedule' || inputs.sanitizers == true) && 'ON' || 'OFF' }}
  CC: clang-18
  CXX: clang++-18
  # Builds download their pinned third-party archive from this repository's
  # releases (third_party/archives.tsv) with the GitHub CLI.
  GH_TOKEN: ${{ github.token }}
  # Native builds and players need a runtime directory and a silent audio device.
  XDG_RUNTIME_DIR: /tmp/chibi-runtime
  SDL_AUDIODRIVER: dummy

jobs:
  native:
    name: Engine build and native tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select CI native profile
        run: python3 .github/native-profile.py
      - name: Verify CI APT source fixtures
        run: |
          python3 .github/test-ubuntu-dependencies.py
          python3 .github/test-native-ccache.py
          python3 .github/test-native-profile.py
          python3 .github/test-verify-native-profile.py
      - name: Install build dependencies
        run: |
          python3 .github/install-ubuntu-dependencies.py ccache clang-18 clang-tools-18 libclang-18-dev libclang-rt-18-dev llvm-18 lld-18 \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR" "$RUNNER_TEMP/build-timings"
      - name: Verify installed and archived license notices
        run: python3 test/tools/package_licenses.py
      - name: Configure compiler cache
        id: ccache-config
        run: python3 .github/native-ccache.py
      - name: Restore compiler objects
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-config.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.ccache-config.outputs.prefix }}-
            ${{ steps.ccache-config.outputs.compatibility-prefix }}-
      - name: Record compiler cache configuration and reset counters
        run: |
          ccache --show-config
          ccache --zero-stats
      # Per-commit snapshots can publish changed host products; each restored
      # product is checked against the actual host bytes by the generator.
      - name: Restore the compiled asset compiler
        id: asset-cache
        uses: actions/cache/restore@v4
        with:
          path: .chibi/asset-compiler-cache
          key: asset-compiler-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: asset-compiler-v2-${{ runner.os }}-
      # published-docs and chibi-cli run chibi-compile --docs, all too slowly under sanitizers. The
      # chibi launcher target also builds chibi-compile and chibi-player.
      - name: Build an unsanitized chibi launcher (Release)
        env:
          CHIBI_BUILD_TIMINGS: ${{ runner.temp }}/build-timings
        run: make build-release BUILD_TARGET='chibi chibi-build-host chibi-compiler-host' LIBCLANG_ROOT=/usr/lib/llvm-18
      - name: Build products and test drivers (selected Debug profile)
        env:
          VERBOSE: '1'
          CHIBI_BUILD_TIMINGS: ${{ runner.temp }}/build-timings
        shell: bash
        run: |
          set -o pipefail
          make build BUILD_TARGET='chibi chibi-compile chibi-player test_tools test_language' BUILD_HOST="$PWD/build-release/sdk/chibi-build-host" ASSET_GENERATOR_HOSTS=build-release/sdk LIBCLANG_ROOT=/usr/lib/llvm-18 2>&1 | tee "$RUNNER_TEMP/native-build.log"
      - name: Verify native profile evidence
        run: python3 .github/verify-native-profile.py
      # Keep the temporary CMake oracle beside the Graph output. Only its
      # reflection/generation prerequisites and build host are compiled.
      - name: Build matching CMake graph reference
        run: make graph-reference LIBCLANG_ROOT=/usr/lib/llvm-18
      # Run authored command generation on the Release helper; test_tools and
      # the reference profile remain the selected Debug profile.
      - name: Graph Debug optimization and command parity (commands only)
        env:
          CHIBI_BUILD_HOST: build-release/sdk/chibi-build-host
        run: python3 tools/test_policy.py tool build-graph-debug-optimization
      # After make build, whose build/reflect the reflection identity cases run.
      - name: Build timing host regressions (ready drivers)
        env:
          CHIBI_TOOLS_BUILD_DIR: build/test/tools
          CHIBI_BUILD_HOST: build-release/sdk/chibi-build-host
        run: python3 tools/test_policy.py --timeout 180 tool build-timings
      - name: Tooling and process integrations
        env:
          CHIBI_TEST_TIMINGS: ${{ runner.temp }}/case-timings
        run: |
          mkdir -m 700 -p "$CHIBI_TEST_TIMINGS"
          make test-tools TOOLS_C_COMPILER=clang-18
          ./build-tools/test_tools --case-timings
      # Products, test drivers and Release helpers are already built and
      # profile-verified. Do not re-enter their planner for the test groups.
      # Keep groups sequential: they share fixtures and build outputs.
      - name: Native, material, project and language selectors
        env:
          UBSAN_OPTIONS: halt_on_error=1
          # language-scalar-native also builds each module it runs for macOS
          # arm64 and Windows x64 here, and native-targets runs them there.
          CHIBI_NATIVE_BUNDLE: ${{ runner.temp }}/native-bundle
        shell: bash
        run: |
          set -e
          export CHIBI_TOOLS_BUILD_DIR=build/test/tools CHIBI_LANGUAGE_BUILD_DIR=build/test/language
          for driver in "$CHIBI_TOOLS_BUILD_DIR/test_tools" "$CHIBI_LANGUAGE_BUILD_DIR/test_language" build-release/sdk/chibi build-release/sdk/chibi-compile; do test -x "$driver"; done
          python3 tools/test_policy.py group native
          python3 tools/test_policy.py group materials
          CHIBI_CLI=build-release/sdk/chibi CHIBI_COMPILE=build-release/sdk/chibi-compile CHIBI_LLVM_BIN=/usr/lib/llvm-18/bin python3 tools/test_policy.py group projects
          CHIBI_LLVM_BIN=/usr/lib/llvm-18/bin python3 tools/test_policy.py group language
      - name: Keep the macOS and Windows native modules
        uses: actions/upload-artifact@v4
        with:
          name: native-bundle
          path: ${{ runner.temp }}/native-bundle
          if-no-files-found: error
          retention-days: 1
      - name: Preserve native profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-profile-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-profile.json
            ${{ runner.temp }}/native-build.log
            ${{ runner.temp }}/build-timings/
            ${{ runner.temp }}/case-timings/
          if-no-files-found: warn
          retention-days: 7
      - name: Report compiler cache statistics
        if: always() && steps.ccache-config.outcome == 'success'
        run: ccache --show-stats --verbose
      # PRs restore only. Only successful main pushes may publish snapshots;
      # GitHub's ref scope additionally prevents PR caches reaching main.
      - name: Save compiler objects from successful main builds
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-config.outputs.prefix }}-${{ github.sha }}
      - name: Save the compiled asset compiler from successful main builds
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.asset-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .chibi/asset-compiler-cache
          key: asset-compiler-v2-${{ runner.os }}-${{ github.sha }}

  native-macos:
    name: Engine build and native tests (macOS)
    # PRs run Linux only; main, nightly and `ci-full`-labelled PRs run every platform.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      XDG_RUNTIME_DIR: /tmp/chibi-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Select CI native profile
        run: python3 .github/native-profile.py
      - name: Install build dependencies
        run: |
          brew install llvm ccache
          LLVM="$(brew --prefix llvm)"
          echo "LLVM=$LLVM" >> "$GITHUB_ENV"
          echo "CC=$LLVM/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$LLVM/bin/clang++" >> "$GITHUB_ENV"
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR" "$RUNNER_TEMP/build-timings"
      - name: Configure compiler cache
        id: ccache-config
        run: python3 .github/native-ccache.py
      - name: Restore compiler objects
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-config.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.ccache-config.outputs.prefix }}-
            ${{ steps.ccache-config.outputs.compatibility-prefix }}-
      - name: Record compiler cache configuration and reset counters
        run: |
          ccache --show-config
          ccache --zero-stats
      - name: Restore the compiled asset compiler
        id: asset-cache
        uses: actions/cache/restore@v4
        with:
          path: .chibi/asset-compiler-cache
          key: asset-compiler-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: asset-compiler-v2-${{ runner.os }}-
      # published-docs and chibi-cli run chibi-compile --docs, all too slowly under sanitizers. The
      # chibi launcher target also builds chibi-compile and chibi-player, and
      # the Graph build adds the Release build host the Debug builds use.
      - name: Build an unsanitized chibi launcher (Release)
        id: release-build
        env:
          CHIBI_BUILD_TIMINGS: ${{ runner.temp }}/build-timings
        run: make build-release BUILD_TARGET='chibi chibi-compiler-host' LIBCLANG_ROOT="$LLVM"
      # Keep transient files retained by a failure. Success removes them; its
      # capture still preserves the hosts and their build/source records.
      - name: Capture macOS facade identities
        if: always() && (steps.release-build.outcome == 'success' || steps.release-build.outcome == 'failure')
        continue-on-error: true
        run: >-
          python3 .github/capture-facade.py --source-root "$GITHUB_WORKSPACE"
          --build "$GITHUB_WORKSPACE/build-release"
          --output "$RUNNER_TEMP/facade-capture"
          --expected-revision "$GITHUB_SHA"
      - name: Preserve macOS facade identities
        if: always() && (steps.release-build.outcome == 'success' || steps.release-build.outcome == 'failure')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: macos-facade-identities-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/facade-capture/
          if-no-files-found: warn
          retention-days: 7
      # The Release build host runs the outer Build and Graph programs, which
      # plan the selected Debug build. Release hosts also generate the asset
      # compiler resource; products and test drivers retain the selected profile.
      - name: Build products and test drivers (selected Debug profile)
        env:
          VERBOSE: '1'
          CHIBI_BUILD_TIMINGS: ${{ runner.temp }}/build-timings
        shell: bash
        run: |
          set -o pipefail
          make build BUILD_TARGET='chibi chibi-compile chibi-player test_tools test_language' BUILD_HOST="$PWD/build-release/sdk/chibi-build-host" ASSET_GENERATOR_HOSTS=build-release/sdk LIBCLANG_ROOT="$LLVM" 2>&1 | tee "$RUNNER_TEMP/native-build.log"
      - name: Verify native profile evidence
        run: python3 .github/verify-native-profile.py
      - name: Preserve failed macOS Graph stage log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-graph-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .chibi/logs/*-graph.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      # After make build, whose build/reflect the reflection identity cases run.
      - name: Build timing host regressions (ready drivers)
        env:
          CHIBI_TOOLS_BUILD_DIR: build/test/tools
          CHIBI_BUILD_HOST: build-release/sdk/chibi-build-host
        run: python3 tools/test_policy.py --timeout 180 tool build-timings
      - name: Tooling and process integrations
        env:
          CHIBI_TEST_TIMINGS: ${{ runner.temp }}/case-timings
        run: |
          mkdir -m 700 -p "$CHIBI_TEST_TIMINGS"
          make test-tools TOOLS_C_COMPILER="$CC"
          ./build-tools/test_tools --case-timings
      # The selected-profile build and Release helpers above already produced
      # these drivers. Run the same groups without re-entering either planner.
      # Keep groups sequential: they share fixtures and build outputs.
      - name: Native, material, project and language selectors
        shell: bash
        run: |
          set -e
          export CHIBI_TOOLS_BUILD_DIR=build/test/tools CHIBI_LANGUAGE_BUILD_DIR=build/test/language
          for driver in "$CHIBI_TOOLS_BUILD_DIR/test_tools" "$CHIBI_LANGUAGE_BUILD_DIR/test_language" build-release/sdk/chibi build-release/sdk/chibi-compile; do test -x "$driver"; done
          python3 tools/test_policy.py group native
          python3 tools/test_policy.py group materials
          CHIBI_CLI=build-release/sdk/chibi CHIBI_COMPILE=build-release/sdk/chibi-compile CHIBI_LLVM_BIN= python3 tools/test_policy.py group projects
          CHIBI_LLVM_BIN= python3 tools/test_policy.py group language
      - name: Preserve native profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-profile-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-profile.json
            ${{ runner.temp }}/native-build.log
            ${{ runner.temp }}/build-timings/
            ${{ runner.temp }}/case-timings/
          if-no-files-found: warn
          retention-days: 7
      - name: Report compiler cache statistics
        if: always() && steps.ccache-config.outcome == 'success'
        run: ccache --show-stats --verbose
      # PRs restore only. Only successful main pushes may publish snapshots;
      # GitHub's ref scope additionally prevents PR caches reaching main.
      - name: Save compiler objects from successful main builds
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-config.outputs.prefix }}-${{ github.sha }}
      - name: Save the compiled asset compiler from successful main builds
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.asset-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .chibi/asset-compiler-cache
          key: asset-compiler-v2-${{ runner.os }}-${{ github.sha }}

  # The engine's test drivers do not build on Windows yet, so the Linux job
  # builds each module language-scalar-native runs for macOS arm64 and Windows
  # x64, and this job links and runs them there (test/native_aot/targets).
  native-targets:
    name: Native scalar modules (${{ matrix.platform }})
    needs: native
    # PRs run Linux only; main, nightly and `ci-full`-labelled PRs run every platform.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-bundle
          path: ${{ runner.temp }}/native-bundle
      - name: Link and run the macOS modules
        if: runner.os == 'macOS'
        run: |
          clang -std=c2x -O1 -Wall -Wextra -Werror -I. test/native_aot/targets/run.c -o "$RUNNER_TEMP/run"
          "$RUNNER_TEMP/run" "$RUNNER_TEMP/native-bundle" /usr/bin/clang
      - name: Set up MSVC
        if: runner.os == 'Windows'
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
      - name: Link and run the Windows modules
        if: runner.os == 'Windows'
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          & "$llvm\clang.exe" -std=c2x -O1 -Wall -Wextra -Werror -D_CRT_SECURE_NO_WARNINGS -I. test/native_aot/targets/run.c -o "$env:RUNNER_TEMP\run.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\run.exe" "$env:RUNNER_TEMP\native-bundle" "$llvm\lld-link.exe"
          exit $LASTEXITCODE

  windows:
    name: Engine build and compile smoke test (Windows)
    # Paused: third_party/archives.tsv has no Windows archive until the build
    # host runs on Windows.
    if: false
    runs-on: windows-2022
    timeout-minutes: 45
    # The Windows port is new; keep this row advisory until it has passed once.
    continue-on-error: true
    steps:
      # No later step needs the token on disk.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No third-party actions run beside the checkouts, and CMake and Ninja are
      # pinned by hash in .github/build-tools.txt.
      - name: Set up MSVC, CMake, Ninja and LLVM
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
          python -m venv "$env:RUNNER_TEMP\cmake"
          & "$env:RUNNER_TEMP\cmake\Scripts\pip" install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          "$env:RUNNER_TEMP\cmake\Scripts" >> $env:GITHUB_PATH
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DCHIBI_ENABLE_SANITIZERS=OFF -DLIBCLANG_ROOT="C:/Program Files/LLVM"
      - name: Build the SDK tools
        run: cmake --build build --target chibi chibi-compile chibi-player
      - name: Compile a project
        run: build/sdk/chibi-compile.exe --project-root "$PWD/test/fixtures/studio" --output "$env:RUNNER_TEMP/game.chibip"

  studio-windows:
    name: Studio build (Windows)
    # Paused with the Windows engine build above.
    if: false
    runs-on: windows-2022
    timeout-minutes: 45
    # Studio on Windows is new; keep this row advisory until it has passed once.
    continue-on-error: true
    steps:
      # No later step needs the token on disk.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: waldnercharles/chibi-studio
          path: chibi-studio
          persist-credentials: false
      # No third-party actions run beside the checkouts, and CMake and Ninja are
      # pinned by hash in .github/build-tools.txt.
      - name: Set up MSVC, CMake, Ninja and LLVM
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
          python -m venv "$env:RUNNER_TEMP\cmake"
          & "$env:RUNNER_TEMP\cmake\Scripts\pip" install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          "$env:RUNNER_TEMP\cmake\Scripts" >> $env:GITHUB_PATH
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - name: Configure the engine
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DCHIBI_ENABLE_SANITIZERS=OFF -DLIBCLANG_ROOT="C:/Program Files/LLVM"
      - name: Build the engine
        run: cmake --build build
      - name: Install the SDK
        run: cmake --install build --prefix "$env:RUNNER_TEMP/sdk"
      # The SDK pins its C runtime, so Studio must use the engine's build type.
      - name: Configure Studio against the installed SDK
        run: cmake -S chibi-studio -B build-studio -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/sdk"
      # The runner has no GPU for SDL_GPU, so this job only builds Studio.
      - name: Build Studio
        run: cmake --build build-studio --target chibi-studio

  studio:
    name: Studio build and startup
    # PRs run Linux only; main, nightly and `ci-full`-labelled PRs run every platform.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    # Studio is public; the read-only workflow token can check it out for every PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: waldnercharles/chibi-studio
          path: studio
          persist-credentials: false
      - name: Record clean engine and Studio sources
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test -z "$(git -C "$GITHUB_WORKSPACE/studio" status --porcelain --untracked-files=normal)"
          mkdir -p "$RUNNER_TEMP/studio-sdk-evidence"
          python3 - <<'PY_SOURCE'
          import json, os, subprocess
          from pathlib import Path
          def source(path):
              def git(*args):
                  return subprocess.check_output(['git', '-C', str(path), *args], text=True).strip()
              return {'revision': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'), 'dirty': False}
          record = {'engine': source(Path.cwd()), 'studio': source(Path(os.environ['GITHUB_WORKSPACE']) / 'studio')}
          (Path(os.environ['RUNNER_TEMP']) / 'studio-sdk-evidence/sources.json').write_text(json.dumps(record, indent=2) + '\n')
          PY_SOURCE
      - name: Install build dependencies
        run: |
          python3 .github/install-ubuntu-dependencies.py clang-18 clang-tools-18 libclang-18-dev xvfb \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
      - name: Restore the compiled asset compiler
        uses: actions/cache/restore@v4
        with:
          path: .chibi/asset-compiler-cache
          key: asset-compiler-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: asset-compiler-v2-${{ runner.os }}-
      # actions/cache versions include the literal path input. Restore the same
      # workspace-relative path native jobs save, then stage it in the checkout.
      - name: Stage the compiled asset compiler in the engine checkout
        run: |
          if [ -d "$GITHUB_WORKSPACE/.chibi/asset-compiler-cache" ]; then
            mkdir -p .chibi
            cp -R "$GITHUB_WORKSPACE/.chibi/asset-compiler-cache" .chibi/
          fi
      - name: Package the SDK
        run: make package-sdk SDK_PREFIX=dist/sdk LIBCLANG_ROOT=/usr/lib/llvm-18
      - name: Verify clean packaged SDK identity
        run: |
          python3 - <<'PY_SDK'
          import os, shutil
          from pathlib import Path
          from tools.package_sdk import previous_package
          prefix = Path('dist/sdk')
          package = previous_package(prefix, 'sdk')
          if package['source']['revision'] != os.environ['GITHUB_SHA'] or package['source']['dirty']:
              raise SystemExit('SDK does not identify the clean engine candidate')
          shutil.copyfile(prefix / 'share/chibi/package.json', Path(os.environ['RUNNER_TEMP']) / 'studio-sdk-evidence/package.json')
          PY_SDK
      - name: Build Studio against the packaged SDK
        run: make studio-build STUDIO_SOURCE="$GITHUB_WORKSPACE/studio" STUDIO_SDK_PREFIX=dist/sdk
      - name: Two hidden Studio frames
        shell: bash
        run: |
          cp -a --reflink=auto "$GITHUB_WORKSPACE/studio/projects/starter" "$RUNNER_TEMP/studio-sdk-project"
          xvfb-run -a build-studio/bin/chibi-dev \
            --project-root "$RUNNER_TEMP/studio-sdk-project" --headless --frames 2 --fixed-dt 0.0166667 2>&1 | tee "$RUNNER_TEMP/studio-sdk-evidence/studio.log"
          ! grep -E 'Studio UI:|runtime frame failed|Could not initialize' "$RUNNER_TEMP/studio-sdk-evidence/studio.log"

      - name: Verify Studio consumed the packaged SDK
        run: |
          python3 - <<'PY_BINDING'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from tools.package_sdk import previous_package
          evidence = Path(os.environ['RUNNER_TEMP']) / 'studio-sdk-evidence'
          sources = json.loads((evidence / 'sources.json').read_text())
          for name, path in [('engine', Path.cwd()), ('studio', Path(os.environ['GITHUB_WORKSPACE']) / 'studio')]:
              def git(*args):
                  return subprocess.check_output(['git', '-C', str(path), *args], text=True).strip()
              if (git('rev-parse', 'HEAD') != sources[name]['revision']
                      or git('rev-parse', 'HEAD^{tree}') != sources[name]['tree']
                      or git('status', '--porcelain', '--untracked-files=normal')):
                  raise SystemExit(f'Source changed: {name}')
          prefix = Path('dist/sdk').resolve()
          package = previous_package(prefix, 'sdk')
          manifest = prefix / 'share/chibi/package.json'
          manifest_hash = hashlib.sha256(manifest.read_bytes()).hexdigest()
          cache = {}
          for line in Path('build-studio/CMakeCache.txt').read_text().splitlines():
              if ':' in line and '=' in line and not line.startswith(('#', '//')):
                  key, value = line.split('=', 1)
                  cache[key.split(':', 1)[0]] = value
          expected = {'Chibi_DIR': str(prefix / 'lib/cmake/Chibi'),
                      'CHIBI_STUDIO_SDK_BUILD_ID': package['build_id'],
                      'CHIBI_STUDIO_SDK_MANIFEST_SHA256': manifest_hash}
          if any(cache.get(key) != value for key, value in expected.items()):
              raise SystemExit('Studio consumed a different SDK')
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          startup_project = {
              'source': 'studio/projects/starter',
              'copy': str(Path(os.environ['RUNNER_TEMP']) / 'studio-sdk-project'),
              'source_manifest_sha256': digest(Path(os.environ['GITHUB_WORKSPACE']) / 'studio/projects/starter/project.kdl'),
              'opened_manifest_sha256': digest(Path(os.environ['RUNNER_TEMP']) / 'studio-sdk-project/project.kdl')}
          receipt = dict(expected, startup_project=startup_project)
          (evidence / 'consumer.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY_BINDING
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-sdk-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/studio-sdk-evidence
          if-no-files-found: ignore

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          python3 -m venv /tmp/clang-format
          /tmp/clang-format/bin/pip install --only-binary=:all: clang-format==22.1.0
          echo '/tmp/clang-format/bin' >> "$GITHUB_PATH"
      - name: Check format
        run: sh tools/clang-format.sh --check

  paired-studio:
    if: github.event_name == 'workflow_dispatch' && inputs.studio_sha != ''
    name: Paired Studio SDK verification
    uses: ./.github/workflows/paired-studio.yml
    with:
      studio_sha: ${{ inputs.studio_sha }}

  graph-sdk-linux:
    name: Graph SDK packaging and relocation (Linux)
    runs-on: ubuntu-24.04
    env:
      LIBCLANG_ROOT: /usr/lib/llvm-18
      NATIVE_TOOLCHAIN_FLAGS: -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select CI native profile
        run: python3 .github/native-profile.py
      - name: Verify clean source candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Install graph build dependencies
        run: |
          python3 .github/install-ubuntu-dependencies.py --no-install-recommends \
            clang-18 clang-tools-18 libclang-18-dev libclang-rt-18-dev ccache python3-venv \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          python3 -m venv "$RUNNER_TEMP/graph-sdk-build-tools"
          "$RUNNER_TEMP/graph-sdk-build-tools/bin/pip" install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          echo "$RUNNER_TEMP/graph-sdk-build-tools/bin" >> "$GITHUB_PATH"
          install -d -m 700 "$XDG_RUNTIME_DIR"
      - name: Restore the compiled asset compiler
        uses: actions/cache/restore@v4
        with:
          path: .chibi/asset-compiler-cache
          key: asset-compiler-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: asset-compiler-v2-${{ runner.os }}-
      - name: Build Release graph compiler and build hosts
        run: make build-release GRAPH_BUILD=1 BUILD_TARGET='chibi-build-host chibi-compiler-host'
      - name: Record Release graph tool identities
        run: |
          sha256sum \
            build-release/sdk/chibi-build-host \
            build-release/sdk/chibi-build-host.chibi-record \
            build-release/sdk/chibi-compiler-host \
            build-release/sdk/chibi-compiler-host.chibi-record \
            > "$RUNNER_TEMP/graph-sdk-release-tools.sha256"
          cat "$RUNNER_TEMP/graph-sdk-release-tools.sha256"
      - name: Build CMake SDK test harness with the Release graph host
        run: make build GRAPH_BUILD= BUILD_DIR=build-sdk-tests BUILD_TARGET=test_tools BUILD_HOST="$PWD/build-release/sdk/chibi-build-host"
      - name: Verify Release graph tools survived the harness build unchanged
        run: sha256sum --check "$RUNNER_TEMP/graph-sdk-release-tools.sha256"
      - name: Verify graph SDK packaging and relocation
        run: |
          CHIBI_TOOLS_BUILD_DIR=build-sdk-tests/test/tools \
          CHIBI_BUILD_HOST="$PWD/build-release/sdk/chibi-build-host" \
          CHIBI_SDK_GRAPH_BUILD_DIR="$PWD/build-release" \
            python3 tools/test_policy.py tool build-sdk
      - name: Verify sources remain unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Preserve failed graph SDK build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: graph-sdk-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .chibi/logs/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
