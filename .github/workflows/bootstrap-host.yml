name: Bootstrap host

# Builds the first build host (the binary tools/bootstrap.sh fetches) on each
# supported platform and publishes it. Pin a published host in
# tools/bootstrap/hosts.tsv.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  BOOTSTRAP_TAG: bootstrap-host-${{ github.sha }}

jobs:
  host:
    name: Build host (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -y -q ccache clang-18 clang-tools-18 libclang-18-dev libclang-rt-18-dev llvm-18 lld-18 \
              libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
              libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
            echo CC=clang-18 >> "$GITHUB_ENV"
            echo CXX=clang++-18 >> "$GITHUB_ENV"
            echo LLVM=/usr/lib/llvm-18 >> "$GITHUB_ENV"
          else
            brew install llvm
            LLVM="$(brew --prefix llvm)"
            echo "LLVM=$LLVM" >> "$GITHUB_ENV"
            echo "CC=$LLVM/bin/clang" >> "$GITHUB_ENV"
            echo "CXX=$LLVM/bin/clang++" >> "$GITHUB_ENV"
          fi
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
      # CMake builds the host until the graph can build it from a pinned one.
      - name: Build the host
        run: |
          sh tools/configure_native.sh build-host -DCMAKE_BUILD_TYPE=Release -DCHIBI_ENABLE_SANITIZERS=OFF \
            -DCHIBI_ENABLE_WARNINGS=ON -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" -DLIBCLANG_ROOT="$LLVM"
          cmake --build build-host --target chibi-build-host --parallel 4
          test "$(build-host/sdk/chibi-build-host --protocol-version)" = 14
          mkdir out
          cp build-host/sdk/chibi-build-host "out/chibi-build-host-${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish hosts
    needs: host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release and print the pins
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          sha256sum chibi-build-host-* > SHA256SUMS
          gh release create "$BOOTSTRAP_TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Bootstrap host $GITHUB_SHA" --notes "First build hosts. Pin them in tools/bootstrap/hosts.tsv." \
            chibi-build-host-* SHA256SUMS
          for asset in chibi-build-host-*; do
            platform=${asset#chibi-build-host-}
            printf '%s\t%s\t%s\t%s\n' "$platform" "$BOOTSTRAP_TAG" "$asset" "$(sha256sum "$asset" | cut -d' ' -f1)"
          done | tee "$GITHUB_STEP_SUMMARY"
