version: 3
name: RecapLedger
id_counter: 271
description: Mirrors the run's ledger into uncommitted save keys (starwell_depth, _time, _kills, _scrap, _level, _stratum, _seed) twice a second, so the host's PauseMenu can show a recap when the run ends.
owner_type: ecs.entity
variables:
- {id: 1, name: wait, type: float}
- id: 2
  name: strata
  type: name
  container: 1
  default: [Basalt Throat, Lumen Grotto, Glass Refractory, Foundry Deep, The Heart]
graphs:
- kind: event
  name: ""
  nodes:
  - id: 3
    type: Event
    reference_name: Tick
    outputs:
      DeltaSeconds: {type: float, kind: data}
  - id: 18
    type: Behavior Expression
    reference_id: 6
    reference_name: wait -= dt
    inputs:
      Exec: {id: 22, kind: exec}
      wait:
        id: 19
        type: float
        binding: {kind: variable, variable_id: 1, source_asset: RecapLedger}
      dt:
        type: double
        binding: {kind: delta_time}
    outputs:
      Then: {id: 23, kind: exec}
      Result: {id: 21, type: float}
  - id: 55
    type: Behavior Expression
    reference_id: 41
    reference_name: wait <= 0
    inputs:
      wait:
        type: double
        flags: 0
        binding: {kind: variable, variable_id: 1, source_asset: RecapLedger}
    outputs:
      Result: {type: bool}
  - {id: 61, type: Branch}
  - id: 76
    type: Behavior Expression
    reference_id: 66
    reference_name: wait = 0.5
    inputs:
      Exec: {id: 79, kind: exec}
      wait:
        id: 77
        type: float
        binding: {kind: variable, variable_id: 1, source_asset: RecapLedger}
    outputs:
      Then: {id: 80, kind: exec}
      Result: {id: 78, type: float}
  - id: 96
    type: Get Global Variable
    inputs: {Name: Depth}
    outputs:
      Value: {type: double}
  - id: 99
    type: Get Global Variable
    inputs: {Name: Time}
    outputs:
      Value: {type: float}
  - id: 102
    type: Format Text
    inputs:
      Format: '{:.0f}'
      Arg0: {type: double}
  - id: 106
    type: Set Saved Text
    inputs: {Key: starwell_depth}
  - id: 128
    type: Behavior Expression
    reference_id: 111
    reference_name: floor(t / 60)
    inputs:
      t: {type: float}
    outputs:
      Result: {type: double}
  - id: 162
    type: Behavior Expression
    reference_id: 131
    reference_name: floor(t - floor(t / 60) * 60)
    inputs:
      t: {type: float}
    outputs:
      Result: {type: double}
  - id: 165
    type: Format Text
    inputs:
      Format: '{:.0f}:{:02.0f}'
      Arg0: {type: double}
      Arg1: {id: 169, type: double, flags: 0}
    outputs:
      Result: {id: 168}
  - id: 170
    type: Set Saved Text
    inputs: {Key: starwell_time}
  - id: 175
    type: Get Global Variable
    inputs: {Name: Kills}
    outputs:
      Value: {type: int}
  - id: 178
    type: Format Text
    inputs:
      Format: '{}'
      Arg0: {type: int}
  - id: 182
    type: Set Saved Text
    inputs: {Key: starwell_kills}
  - id: 187
    type: Get Global Variable
    inputs: {Name: Scrap}
    outputs:
      Value: {type: int}
  - id: 190
    type: Format Text
    inputs:
      Format: '{}'
      Arg0: {type: int}
  - id: 194
    type: Set Saved Text
    inputs: {Key: starwell_scrap}
  - id: 199
    type: Get Global Variable
    inputs: {Name: Level}
    outputs:
      Value: {type: int}
  - id: 202
    type: Format Text
    inputs:
      Format: '{}'
      Arg0: {type: int}
  - id: 206
    type: Set Saved Text
    inputs: {Key: starwell_level}
  - id: 211
    type: Get Variable
    reference_id: 2
    reference_name: strata
    outputs:
      Value: {type: name, container: 1}
  - id: 241
    type: Behavior Expression
    reference_id: 213
    reference_name: clamp(floor(d / 600), 0, 4)
    inputs:
      d: {type: double}
    outputs:
      Result: {type: double}
  - {id: 244, type: To Integer}
  - id: 247
    type: Get
    inputs:
      Array: {type: name}
    outputs:
      Item: {type: name}
  - id: 251
    type: Format Text
    inputs:
      Format: '{}'
      Arg0: {type: name}
  - id: 255
