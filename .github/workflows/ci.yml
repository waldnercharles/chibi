name: CI

on:
  workflow_dispatch:
    inputs:
      native:
        description: Compile native profiles and run admitted native checks
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Fast C regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build-tools
          key: tools-${{ runner.os }}-${{ hashFiles('test/tools/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: tools-${{ runner.os }}-${{ hashFiles('test/tools/CMakeLists.txt') }}-
      - name: Essential C regressions (60-second aggregate ceiling)
        run: make test-tools TOOLS_C_COMPILER=cc

  native:
    if: github.event_name == 'workflow_dispatch' && inputs.native
    name: Native partial coverage (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            sanitizers: "ON"
            sljit: "ON"
          - build_type: RelWithDebInfo
            sanitizers: "OFF"
            sljit: "ON"
    env:
      # Hardware opt-in still applies to admitted GPU commands; it cannot bypass quarantine.
      NATIVE_TOOLCHAIN_FLAGS: -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      LOCAL_CMAKE_FLAGS: >-
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCHIBI_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
        -DCHIBI_ENABLE_SJLIT=${{ matrix.sljit }}
        -DCHIBI_ENABLE_WARNINGS=ON -DCHIBI_ENABLE_CCACHE=ON
        -DLIBCLANG_ROOT=/usr/lib/llvm-18
    steps:
      - uses: actions/checkout@v4
      - name: Identify dependency sources
        id: deps
        run: echo "key=$(python3 tools/fetchcontent_cache.py fingerprint --source-dir .)" >> "$GITHUB_OUTPUT"
      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: ~/.cache/chibi-fetchcontent/${{ steps.deps.outputs.key }}
          key: fetchcontent-${{ runner.os }}-${{ steps.deps.outputs.key }}
      - name: Set up CMake
        uses: lukka/get-cmake@latest
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-${{ matrix.build_type }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 libclang-18-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers \
            libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev xvfb
      - name: Report temporarily disabled coverage (not passed)
        run: |
          make test-policy-inventory | tee -a "$GITHUB_STEP_SUMMARY"
          cat docs/test-quarantine.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compile owned SDK and CLI products
        run: make build
      - name: Essential C regressions with reflection identity (60-second aggregate ceiling)
        run: make test-tools TOOLS_C_COMPILER=clang-18
      - name: Record retired suite ownership
        run: |
          printf '%s\n' 'The old test_suite, graph smoke executables and combined chibi app are retired.'
          printf '%s\n' 'Held oracle sources are recorded in .chibi/architecture/executor-test-retirement.json; no coverage is implied.'

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          python3 -m venv /tmp/clang-format
          /tmp/clang-format/bin/pip install --only-binary=:all: clang-format==22.1.0
          echo '/tmp/clang-format/bin' >> "$GITHUB_PATH"
      - name: Check format
        run: sh tools/clang-format.sh --check
