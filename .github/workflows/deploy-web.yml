name: Deploy web app

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native reflection dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libgl1-mesa-dev

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
          actions-cache-folder: emsdk-cache

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: web
          max-size: 1G

      - name: Build native reflection tool
        run: |
          cmake -S tools/reflect -B build-reflect -DCMAKE_BUILD_TYPE=Release
          cmake --build build-reflect --parallel 4

      - name: Build web app
        run: |
          emcmake cmake -S . -B build-web \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHIBI_ENABLE_WARNINGS=OFF \
            -DCHIBI_ENABLE_CCACHE=ON \
            -DLIBCLANG_ROOT=/usr/lib/llvm-18 \
            -DCHIBI_REFLECT_EXECUTABLE="$GITHUB_WORKSPACE/build-reflect/reflect"
          cmake --build build-web --target chibi --parallel 4

      - name: Assemble Pages artifact
        run: |
          mkdir site
          cp build-web/chibi.html site/index.html
          cp build-web/chibi.js build-web/chibi.wasm build-web/chibi.data site/
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
