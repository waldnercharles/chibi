    type: Set UI Text
    inputs: {Element: '#goal', Text: CIRCUIT COMPLETE!  All 8 blooms collected.}
  - id: 49
    type: Behavior Expression
    reference_id: 35
    reference_name: Collected >= 8
    inputs:
      Exec: {id: 52, kind: exec}
      Collected: {id: 50, type: double, flags: 0}
    outputs:
      "True": {id: 53, kind: exec}
      "False": {kind: exec}
      Result: {id: 51, type: bool}
  edges:
  - {from: 1.Then, to: 49.Exec}
  - {from: 4.Entity, to: 13.Entity}
  - {from: 13.Value.current, to: 49.Collected, conversion: To Real}
  - {from: 49.True, to: 28.Exec}
- {id: 35, kind: function, math_expression: Collected >= 8, entry_id: 56}
