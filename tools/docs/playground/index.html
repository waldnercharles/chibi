<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Chibi Format</title>
<link rel="stylesheet" href="app.css">
<script>
  // Set the theme before first paint so a dark page does not flash light.
  try { document.documentElement.dataset.theme = localStorage.getItem('chibi-format-theme') || 'system'; } catch (_) {}
</script>
</head>
<body>
<div class="app" id="app" data-files="open" data-options="open">
  <header class="topbar">
    <button class="icon-button panel-toggle" id="toggle-files" type="button" aria-controls="files" aria-expanded="true">Files</button>
    <div class="brand">Chibi Format</div>
    <div class="crumb" id="crumb" title="">Scratch</div>
    <div class="status" id="status" role="status" aria-live="polite"><span class="spinner" hidden></span><span id="status-text"></span></div>
    <div class="segmented" role="radiogroup" aria-label="Theme" id="theme">
      <button type="button" role="radio" data-value="system" aria-checked="true">System</button>
      <button type="button" role="radio" data-value="light" aria-checked="false">Light</button>
      <button type="button" role="radio" data-value="dark" aria-checked="false">Dark</button>
    </div>
    <button class="icon-button panel-toggle" id="toggle-options" type="button" aria-controls="options" aria-expanded="true">Options</button>
  </header>

  <aside class="files" id="files" aria-label="Source files">
    <div class="files-head">
      <input id="filter" type="search" placeholder="Filter files" aria-label="Filter files" autocomplete="off" spellcheck="false">
      <div class="files-count" id="count"></div>
    </div>
    <div class="tree" id="tree" role="tree" aria-label="Repository"></div>
  </aside>

  <main class="code" id="code">
    <div class="code-head">
      <div class="segmented" role="radiogroup" aria-label="View" id="view">
        <button type="button" role="radio" data-value="formatted" aria-checked="true">Formatted</button>
        <button type="button" role="radio" data-value="diff" aria-checked="false">Changes</button>
        <button type="button" role="radio" data-value="original" aria-checked="false">Original</button>
      </div>
      <div class="changes-nav" id="changes-nav" hidden>
        <button type="button" id="prev-change" aria-label="Previous change" title="Previous change (p)">Prev</button>
        <span id="change-position"></span>
        <button type="button" id="next-change" aria-label="Next change" title="Next change (n)">Next</button>
      </div>
      <div class="code-tools">
        <label class="check"><input type="checkbox" id="whitespace"> Show whitespace</label>
        <button type="button" id="edit" aria-pressed="false">Edit</button>
        <button type="button" id="copy">Copy formatted</button>
      </div>
    </div>
    <div class="viewport" id="viewport" tabindex="0" aria-label="Source"></div>
    <textarea class="editor" id="editor" spellcheck="false" aria-label="Original source, editable" hidden></textarea>
    <div class="code-foot" id="foot"></div>
  </main>

  <aside class="options" id="options" aria-label="Formatter options">
    <div class="options-head">
      <h2>Options</h2>
      <button type="button" id="reset" class="link-button">Reset</button>
    </div>
    <div id="options-body"></div>
    <details class="options-json">
      <summary>Options as JSON</summary>
      <pre id="options-json"></pre>
      <button type="button" id="copy-options">Copy</button>
    </details>
    <p class="options-note">These options apply in this page. <code>chibi fmt</code> uses the defaults until it reads a project configuration.</p>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
</div>
<script src="diff.js"></script>
<script src="highlight.js"></script>
<script src="options.js"></script>
<script src="tree.js"></script>
<script src="app.js"></script>
</body>
</html>
