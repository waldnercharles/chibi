name: Language shard validation

# Manual proof only; ordinary CI and its required checks remain unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-shards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/language-shards-platform.yml
    with:
      runner: ubuntu-24.04
      llvm_bin: /usr/lib/llvm-18/bin
  macos:
    uses: ./.github/workflows/language-shards-platform.yml
    with:
      runner: macos-15
      llvm_bin: ''
