name: Source bundle

# This workflow only packages Git data. It does not build, test, or publish releases.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/source-bundle.yml']

permissions:
  contents: read

concurrency:
  group: source-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    # Never package a fork's code in the private repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out the exact source commit and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Package and verify the source history
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="$RUNNER_TEMP/source-bundle"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir -p "$BUNDLE_DIR"

          # One named ref includes only this commit's reachable history, not
          # unrelated branch tips, tags, local Git configuration, or credentials.
          git update-ref refs/heads/source-bundle "$SOURCE_SHA"
          git bundle create "$BUNDLE_DIR/chibi.bundle" refs/heads/source-bundle
          test "$(git bundle list-heads "$BUNDLE_DIR/chibi.bundle")" = "$SOURCE_SHA refs/heads/source-bundle"

          # A fresh repository proves that the bundle has no prerequisites.
          git init --bare "$RUNNER_TEMP/bundle-check.git"
          git -C "$RUNNER_TEMP/bundle-check.git" bundle verify "$BUNDLE_DIR/chibi.bundle"
          git clone --bare --branch source-bundle "$BUNDLE_DIR/chibi.bundle" "$RUNNER_TEMP/bundle-clone.git"
          test "$(git -C "$RUNNER_TEMP/bundle-clone.git" rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/bundle-clone.git" rev-parse 'HEAD^{tree}')" = "$tree"
          git -C "$RUNNER_TEMP/bundle-clone.git" fsck --full

          digest=$(sha256sum "$BUNDLE_DIR/chibi.bundle" | cut -d ' ' -f 1)
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg commit "$SOURCE_SHA" \
            --arg tree "$tree" --arg source_ref "$SOURCE_REF" --arg sha256 "$digest" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{version: 1, repository: $repository, commit: $commit, tree: $tree,
              source_ref: $source_ref, bundle_ref: "refs/heads/source-bundle",
              bundle: "chibi.bundle", sha256: $sha256, run_url: $run_url}' \
            > "$BUNDLE_DIR/manifest.json"
          (cd "$BUNDLE_DIR" && sha256sum chibi.bundle manifest.json > SHA256SUMS)

      - name: Upload the private source bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chibi-source-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-bundle/chibi.bundle
            ${{ runner.temp }}/source-bundle/manifest.json
            ${{ runner.temp }}/source-bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
