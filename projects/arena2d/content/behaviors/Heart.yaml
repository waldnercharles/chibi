description: 'The Heart of the Well, the run''s last guardian, in three phases. First a ring of eight Echo shards orbits it firing needlets while it bursts needle novas and spins the ring into a blade. Below two thirds it pulses gravity that drags the ship inward and recalls every guardian above: the Grinder''s charge, Mother Bloom''s spores, the Warden''s prism rings and the Colossus''s lava. Below one third it turns frantic: the arena walls crack, the echo ring doubles and the heart races.'
