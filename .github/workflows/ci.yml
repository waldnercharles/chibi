name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native tests (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            sanitizers: "ON"
            sljit: "ON"
          - build_type: RelWithDebInfo
            sanitizers: "OFF"
            sljit: "ON"
    env:
      LOCAL_CMAKE_FLAGS: >-
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCHIBI_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
        -DCHIBI_ENABLE_SJLIT=${{ matrix.sljit }}
        -DCHIBI_ENABLE_WARNINGS=ON -DCHIBI_ENABLE_CCACHE=ON
    steps:
      - uses: actions/checkout@v4
      - name: Set up CMake
        uses: lukka/get-cmake@latest
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-${{ matrix.build_type }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 libclang-18-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers \
            libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev xvfb
      - name: Configure
        run: >-
          cmake -S . -B build $LOCAL_CMAKE_FLAGS
          -DLIBCLANG_ROOT=/usr/lib/llvm-18
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      - name: Build and run tests
        run: xvfb-run -a make test
      - name: Verify parallel Arena scaling
        if: matrix.build_type == 'RelWithDebInfo'
        run: >-
          xvfb-run -a env CBLUEPRINT_BENCH_COMBAT=1
          CBLUEPRINT_BENCH_REQUIRE_PARALLEL=1
          build/test_suite --bench-arena-scene-scale 2048 240 0
      - name: Reject native execution without SLJIT
        if: matrix.build_type == 'Debug'
        run: |
          cmake -S . -B build-nojit -DCMAKE_BUILD_TYPE=Debug \
            -DCHIBI_ENABLE_SJLIT=OFF -DCHIBI_ENABLE_SANITIZERS=ON \
            -DLIBCLANG_ROOT=/usr/lib/llvm-18 \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build-nojit --target check-behavior-backend --parallel 2
      - name: Build development reload targets
        if: matrix.build_type == 'Debug'
        run: |
          cmake -S . -B build-dev -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCHIBI_DEVELOPMENT_RELOAD=ON \
            -DCHIBI_ENABLE_SANITIZERS=OFF \
            -DCHIBI_ENABLE_SJLIT=ON -DLIBCLANG_ROOT=/usr/lib/llvm-18 \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build-dev --target chibi chibi_dll --parallel 2

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up CMake
        uses: lukka/get-cmake@latest
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y wget libclang-18-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxext-dev libxi-dev libxrandr-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-format-22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCHIBI_ENABLE_SJLIT=OFF -DLIBCLANG_ROOT=/usr/lib/llvm-18
      - name: Check format
        run: cmake --build build --target check-format
