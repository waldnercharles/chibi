# Explicit platform jobs call the existing build/test recipes. Full/Graph modes add clean-machine proofs.
# The core45 + native90 phase bounds are enforced separately; job135 is only their sum.
name: CI
run-name: "CI · ${{ inputs.mode || github.event_name }} · ${{ github.ref_name }}"
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  schedule:
  - cron: 0 8 * * *
  workflow_dispatch:
    inputs:
      mode:
        description: 'ci: Linux/macOS and native targets; full: recovery/SDK/no-C; graph: isolated Graph parity'
        type: choice
        default: ci
        options:
        - ci
        - full
        - graph
      windows_bootstrap_run:
        description: Reuse this run's verified Linux cross-build for Windows in ci/full mode
        type: string
        default: ''
      windows_bootstrap_commit:
        description: Exact source commit of the reused Windows cross-build
        type: string
        default: ''
      windows_bootstrap_sha256:
        description: SHA-256 of the reused chibi.exe, checked before execution
        type: string
        default: ''
      sanitizers:
        description: ASan + UBSan for explicitly requested full/graph validation (nightly always uses them)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.mode || 'ci' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CHIBI_CI_SANITIZERS: ${{ (github.event_name == 'schedule' || (inputs.mode == 'full' && inputs.sanitizers == true) || (inputs.mode
    == 'graph' && inputs.sanitizers == true)) && 'ON' || 'OFF' }}
  CC: clang-18
  CXX: clang++-18
  GH_TOKEN: ${{ github.token }}
  XDG_RUNTIME_DIR: /tmp/chibi-runtime
  SDL_AUDIODRIVER: dummy
  CHIBI_COMPILER_CACHE: ${{ github.workspace }}/.chibi/compiler-cache
  CHIBI_ASSET_COMPILER_CACHE: ${{ github.workspace }}/.chibi/asset-compiler-cache
jobs:
  native:
    name: Engine build and native tests
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'ci' || inputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    steps:
    - name: Start the original 45-minute core budget
      run: echo "CHIBI_CORE_DEADLINE=$(($(date +%s) + 2700))" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
      timeout-minutes: 5
      with:
        persist-credentials: false
    - name: Format and static checks
      id: ccache-config
      timeout-minutes: 45
      run: |-
        node .github/ci/budget.js "$CHIBI_CORE_DEADLINE" bash .github/ci/linux-setup.sh
        node .github/ci/budget.js --reserve 360 "$CHIBI_CORE_DEADLINE"
    # Preserve each existing store's path and key: cache versions include paths.
    - name: Restore compiler objects
      id: ccache
      uses: actions/cache/restore@v4
      timeout-minutes: 2
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-config.outputs.prefix }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.ccache-config.outputs.prefix }}-
          ${{ steps.ccache-config.outputs.compatibility-prefix }}-
    - name: Restore the compiled asset compiler
      id: asset-cache
      uses: actions/cache/restore@v4
      timeout-minutes: 2
      with:
        path: .chibi/asset-compiler-cache
        key: asset-compiler-v2-${{ runner.os }}-${{ github.sha }}
        restore-keys: asset-compiler-v2-${{ runner.os }}-
    - name: Restore recovered compilers
      uses: actions/cache/restore@v4
      timeout-minutes: 2
      with:
        path: .chibi/compiler-cache
        key: compiler-cache-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
        restore-keys: compiler-cache-${{ runner.os }}-
    - name: Core functional tests
      id: core
      timeout-minutes: 45
      run: |-
        node .github/ci/budget.js "$CHIBI_CORE_DEADLINE" bash .github/ci/linux-core.sh
        node .github/ci/budget.js "$CHIBI_CORE_DEADLINE"
    - name: Native fixed-point proof
      id: fixedpoint
      timeout-minutes: 90
      env:
        CHIBI_FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full') }}
        CHIBI_WINDOWS_BOOTSTRAP_RUN: ${{ inputs.windows_bootstrap_run }}
      run: |-
        deadline=$(($(date +%s) + 5400))
        node .github/ci/budget.js "$deadline" bash .github/ci/native-proof.sh
    - name: Keep stage two for Windows
      if: always() && steps.fixedpoint.outcome != 'skipped' && inputs.windows_bootstrap_run == ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: native-stage-two-windows
        path: ${{ runner.temp }}/windows/chibi.exe
        if-no-files-found: error
        retention-days: 1
    - name: Keep native platform modules
      if: always() && steps.core.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        name: native-bundle
        path: ${{ runner.temp }}/native-bundle
        if-no-files-found: warn
        retention-days: 1
    - name: Preserve proof logs and timings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-proof-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          ${{ runner.temp }}/native-build.log
          ${{ runner.temp }}/native-profile/
          ${{ runner.temp }}/build-timings/
          ${{ runner.temp }}/case-timings/
          ${{ runner.temp }}/native-self-host.log
          .chibi/logs/*.log
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    - name: Prune unrefreshed recovered compilers
      if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
        && inputs.mode == 'full'))
      run: find .chibi/compiler-cache -type f -mtime +3 -delete 2>/dev/null || true
    - name: Warm trusted compiler objects after Linux full validation
      if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
        && inputs.mode == 'full')) && steps.ccache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-config.outputs.prefix }}-${{ github.sha }}
    - name: Warm trusted asset compiler after Linux full validation
      if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
        && inputs.mode == 'full')) && steps.asset-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .chibi/asset-compiler-cache
        key: asset-compiler-v2-${{ runner.os }}-${{ github.sha }}
    - name: Warm trusted recovered compilers after Linux full validation
      if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
        && inputs.mode == 'full'))
      uses: actions/cache/save@v4
      with:
        path: .chibi/compiler-cache
        key: compiler-cache-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
  native-macos:
    name: Engine build and native tests (macOS)
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'ci' || inputs.mode == 'full'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      XDG_RUNTIME_DIR: /tmp/chibi-runtime
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install the native LLVM tools
      run: sh .github/native-llvm.sh
    - name: Select CI native profile
      run: sh .github/native-profile.sh
    - name: Install build dependencies
      run: |
        brew install ccache
        LLVM="$(brew --prefix llvm@22)"
        {
          echo "LLVM=$LLVM"
          echo "CC=$LLVM/bin/clang"
          echo "CXX=$LLVM/bin/clang++"
        } >> "$GITHUB_ENV"
        install -d -m 700 "$XDG_RUNTIME_DIR" "$RUNNER_TEMP/build-timings"
    - name: Configure compiler cache
      id: ccache-config
      run: sh .github/native-ccache.sh
    - name: Restore compiler objects
      id: ccache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-config.outputs.prefix }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.ccache-config.outputs.prefix }}-
          ${{ steps.ccache-config.outputs.compatibility-prefix }}-
    - name: Record compiler cache configuration and reset counters
      run: |
        ccache --show-config
        ccache --zero-stats
    - name: Restore the compiled asset compiler
      id: asset-cache
      uses: actions/cache/restore@v4
      with:
        path: .chibi/asset-compiler-cache
        key: asset-compiler-v2-${{ runner.os }}-${{ github.sha }}
        restore-keys: asset-compiler-v2-${{ runner.os }}-
    - name: Restore recovered compilers
      uses: actions/cache/restore@v4
      with:
        path: .chibi/compiler-cache
        key: compiler-cache-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
        restore-keys: compiler-cache-${{ runner.os }}-
    - name: Build an unsanitized chibi launcher (Release)
      id: release-build
      env:
        CHIBI_BUILD_TIMINGS: ${{ runner.temp }}/build-timings
      run: sh tools/build.sh build --release --target chibi --target chibi-compile --target chibi-build-host --target chibi-compiler-host --libclang-root "$LLVM"
    - name: Build products and test drivers (selected Debug profile)
      id: native-build
      env:
        VERBOSE: '1'
        CHIBI_BUILD_TIMINGS: ${{ runner.temp }}/build-timings
      shell: bash
      run: |
        set -o pipefail
        sh tools/build.sh build --build build --profile "$BUILD_PROFILE" --debug-optimization "$BUILD_DEBUG_OPTIMIZATION" --debug-frame-pointers "$BUILD_DEBUG_FRAME_POINTERS" --target chibi --target chibi-compile --target test_tools --target test_language --host "$PWD/build-release/sdk/chibi-build-host" --libclang-root "$LLVM" 2>&1 | tee "$RUNNER_TEMP/native-build.log"
    - name: Verify and preserve native profile evidence
      if: always() && steps.native-build.outcome != 'skipped'
      continue-on-error: true
      run: sh tools/build.sh native-evidence --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --job "$GITHUB_JOB"
        --sanitizers "$CHIBI_CI_SANITIZERS" --profile "$BUILD_PROFILE" --optimization "$BUILD_DEBUG_OPTIMIZATION" --frame-pointers "$BUILD_DEBUG_FRAME_POINTERS"
        --outcome "${{ steps.native-build.outcome }}" --host "$PWD/build-release/sdk/chibi-build-host" --build build --output "$RUNNER_TEMP/native-profile"
        --nm "$LLVM/bin/llvm-nm"
    - name: Preserve failed macOS Graph stage log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: macos-graph-failure-${{ github.run_id }}-${{ github.run_attempt }}
        path: .chibi/logs/*-graph.log
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    - name: Build timing host regressions (ready drivers)
      env:
        CHIBI_TOOLS_BUILD_DIR: build/test/tools
        CHIBI_BUILD_HOST: build-release/sdk/chibi-build-host
      run: sh tools/build.sh test --build-host "$CHIBI_BUILD_HOST" build-timings
    - name: Tooling and process integrations
      env:
        CHIBI_TEST_TIMINGS: ${{ runner.temp }}/case-timings
      run: |
        install -d -m 700 "$CHIBI_TEST_TIMINGS"
        sh tools/build.sh test --build-host build-release/sdk/chibi-build-host short
        build/test/tools/test_tools --case-timings
    - name: Native, material, project and language selectors
      env:
        CHIBI_TEST_TIMINGS: ${{ runner.temp }}/case-timings
      shell: bash
      run: |
        set -e
        install -d -m 700 "$CHIBI_TEST_TIMINGS"
        export CHIBI_TOOLS_BUILD_DIR=build/test/tools CHIBI_LANGUAGE_BUILD_DIR=build/test/language
        for driver in "$CHIBI_TOOLS_BUILD_DIR/test_tools" "$CHIBI_LANGUAGE_BUILD_DIR/test_language" build-release/sdk/chibi build-release/sdk/chibi-compile; do test -x "$driver"; done
        sh tools/build.sh test --build-host build-release/sdk/chibi-build-host native native-build
        sh tools/build.sh test --build-host build-release/sdk/chibi-build-host --jobs 2 chibi-cli language
    - name: Preserve build logs and timings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-profile-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/native-build.log
          ${{ runner.temp }}/native-profile/
          ${{ runner.temp }}/build-timings/
          ${{ runner.temp }}/case-timings/
        if-no-files-found: warn
        retention-days: 7
    - name: Report compiler cache statistics
      if: always() && steps.ccache-config.outcome == 'success'
      run: ccache --show-stats --verbose
    - name: Save compiler objects from successful main builds
      if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
        && inputs.mode == 'full')) && steps.ccache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-config.outputs.prefix }}-${{ github.sha }}
    - name: Save the compiled asset compiler from successful main builds
      if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
        && inputs.mode == 'full')) && steps.asset-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .chibi/asset-compiler-cache
        key: asset-compiler-v2-${{ runner.os }}-${{ github.sha }}
    - name: Prune old recovered compilers
      if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
        && inputs.mode == 'full'))
      run: find .chibi/compiler-cache -type f -mtime +3 -delete 2>/dev/null || true
    - name: Save recovered compilers from main builds
      if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
        && inputs.mode == 'full'))
      uses: actions/cache/save@v4
      with:
        path: .chibi/compiler-cache
        key: compiler-cache-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
  native-self-host-windows:
    # Goal item 8: the Windows stage two, cross-linked above with lld-link, the
    # import libraries and core:sys/windows, builds the compiler on windows-2022
    # with that runner's LLVM (stage three), and stage three builds it again
    # (stage four). The two are byte-identical. Stage two is not compared: the
    # Linux job's llc is another version than this runner's. An explicitly pinned
    # older source may need one extra generation, as native seed recovery does;
    # it must reproduce stage four exactly and keeps all binaries for inspection.
    name: Native self-host (Windows)
    needs: native
    if: always() && !cancelled() && ((needs.native.result != 'cancelled' && needs.native.result != 'skipped') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'ci' || inputs.mode == 'full') && inputs.windows_bootstrap_run != ''))
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CHIBI_CI_SANITIZERS: 'OFF'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve the sources' bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the pinned Windows bootstrap artifact
        if: inputs.windows_bootstrap_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_RUN: ${{ inputs.windows_bootstrap_run }}
          BOOTSTRAP_COMMIT: ${{ inputs.windows_bootstrap_commit }}
          BOOTSTRAP_SHA256: ${{ inputs.windows_bootstrap_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BOOTSTRAP_RUN -notmatch '^[1-9][0-9]*$' -or
              $env:BOOTSTRAP_COMMIT -notmatch '^[0-9a-f]{40}$' -or
              $env:BOOTSTRAP_SHA256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Windows bootstrap requires a run ID, full source commit and SHA-256'
          }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BOOTSTRAP_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'cannot inspect the Windows bootstrap producer' }
          if ($run.repository.full_name -ne $env:GITHUB_REPOSITORY -or
              ($run.path -ne '.github/workflows/native-self-host.yml' -and $run.path -ne '.github/workflows/ci.yml') -or
              $run.head_sha -ne $env:BOOTSTRAP_COMMIT -or $run.status -ne 'completed') {
            throw 'Windows bootstrap producer identity differs from its pin'
          }
          $producerName = if ($run.path -eq '.github/workflows/ci.yml') { 'Engine build and native tests' } else { 'Native self-host (Linux)' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BOOTSTRAP_RUN/jobs?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'cannot inspect the Windows bootstrap producer jobs' }
          $producer = @($jobs.jobs | Where-Object { $_.name -eq $producerName -and $_.conclusion -eq 'success' })
          if ($producer.Count -ne 1) { throw 'Windows bootstrap needs a successful Linux cross-build' }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BOOTSTRAP_RUN/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'cannot inspect the Windows bootstrap artifact' }
          $artifact = @($artifacts.artifacts | Where-Object { $_.name -eq 'native-stage-two-windows' -and !$_.expired })
          if ($artifact.Count -ne 1 -or $artifact[0].workflow_run.head_sha -ne $env:BOOTSTRAP_COMMIT) {
            throw 'Windows bootstrap has no unexpired artifact from its pinned commit'
          }
          "Windows bootstrap producer $env:BOOTSTRAP_RUN source $env:BOOTSTRAP_COMMIT artifact $($artifact[0].id)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/download-artifact@v4
        with:
          name: native-stage-two-windows
          path: ${{ runner.temp }}/stage2
          run-id: ${{ inputs.windows_bootstrap_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Check the Windows bootstrap compiler's bytes
        env:
          BOOTSTRAP_SHA256: ${{ inputs.windows_bootstrap_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha256 = (Get-FileHash "$env:RUNNER_TEMP/stage2/chibi.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($env:BOOTSTRAP_SHA256 -and $sha256 -ne $env:BOOTSTRAP_SHA256) {
            throw 'Windows bootstrap compiler SHA-256 differs from its pin'
          }
          "Windows bootstrap compiler sha256 $sha256" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Restore the verified LLVM tools
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/clang+llvm-22.1.8-x86_64-pc-windows-msvc/bin
          key: llvm-windows-x64-22.1.8-d96c2cc1736f4eb7fa43cb9bbdf56d93551a9ae0a9aadb9c99c3c3b2b712a234
      - name: Install the LLVM optimizer and code generator
        # The runner's LLVM installer has clang and lld, not opt and llc.
        # The full upstream archive supplies those tools; verify its bytes.
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'clang+llvm-22.1.8-x86_64-pc-windows-msvc'
          $archive = "$env:RUNNER_TEMP/llvm.tar.xz"
          $phase = [Diagnostics.Stopwatch]::StartNew()
          Write-Host 'LLVM download started'
          curl.exe --fail --location --retry 2 --connect-timeout 30 --max-time 240 --speed-limit 1048576 --speed-time 60 "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$name.tar.xz" --output $archive
          if ($LASTEXITCODE) { throw "could not download LLVM tools: curl exited $LASTEXITCODE" }
          Write-Host ('LLVM download completed in {0:F2} s ({1} bytes)' -f $phase.Elapsed.TotalSeconds, (Get-Item $archive).Length)
          $phase.Restart()
          Write-Host 'LLVM checksum verification started'
          $sha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha256 -ne 'd96c2cc1736f4eb7fa43cb9bbdf56d93551a9ae0a9aadb9c99c3c3b2b712a234') {
            throw 'LLVM archive SHA-256 differs from the pinned release'
          }
          Write-Host ('LLVM checksum verified in {0:F2} s' -f $phase.Elapsed.TotalSeconds)
          $members = @("$name/bin/opt.exe", "$name/bin/llc.exe", "$name/bin/lld-link.exe", "$name/bin/*.dll")
          $sevenZip = (Get-Command 7z.exe, 7z -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (!$sevenZip -and $env:ProgramFiles) {
            $candidate = "$env:ProgramFiles/7-Zip/7z.exe"
            if (Test-Path $candidate -PathType Leaf) { $sevenZip = $candidate }
          }
          $phase.Restart()
          if ($sevenZip) {
            # XZ contains one tar file. Decompress it once, then select the three
            # executables and their DLLs instead of writing every LLVM tool.
            $expanded = "$env:RUNNER_TEMP/llvm-unpack"
            New-Item -ItemType Directory -Force $expanded | Out-Null
            Write-Host "LLVM decompression started: $sevenZip"
            & $sevenZip x -txz -y "-o$expanded" $archive
            if ($LASTEXITCODE) { throw 'could not decompress the verified LLVM archive' }
            Write-Host ('LLVM decompression completed in {0:F2} s' -f $phase.Elapsed.TotalSeconds)
            $phase.Restart()
            Write-Host 'LLVM required-tool extraction started: 7-Zip'
            & $sevenZip x -ttar -y "-o$env:RUNNER_TEMP" "$expanded/llvm.tar" @members
            if ($LASTEXITCODE) { throw 'could not extract the required LLVM tools' }
            Remove-Item "$expanded/llvm.tar"
            Remove-Item $expanded
          } else {
            Write-Host 'LLVM required-tool extraction started: tar'
            tar -xf $archive -C $env:RUNNER_TEMP @members
            if ($LASTEXITCODE) { throw 'could not extract the required LLVM tools' }
          }
          Write-Host ('LLVM required-tool extraction completed in {0:F2} s' -f $phase.Elapsed.TotalSeconds)
          Remove-Item $archive
      - name: Check the LLVM tools
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'clang+llvm-22.1.8-x86_64-pc-windows-msvc'
          $llvm = "$env:RUNNER_TEMP/$name/bin"
          foreach ($tool in 'opt', 'llc', 'lld-link') {
            if (!(Test-Path "$llvm/$tool.exe" -PathType Leaf)) { throw "missing LLVM tool $tool" }
            & "$llvm/$tool.exe" --version
            if ($LASTEXITCODE) { throw "LLVM tool $tool is unusable" }
          }
          "CHIBI_WINDOWS_LLVM=$llvm" >> $env:GITHUB_ENV
      - name: Build the Windows compiler to a fixed point
        id: windows-fixed-point
        env:
          BOOTSTRAP_RUN: ${{ inputs.windows_bootstrap_run }}
          BOOTSTRAP_COMMIT: ${{ inputs.windows_bootstrap_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $llvm = $env:CHIBI_WINDOWS_LLVM
          $root = $PWD.Path.Replace('\', '/')
          $work = $env:RUNNER_TEMP.Replace('\', '/')
          $stage = "$work/stage2/chibi.exe"
          $hashes = @{}
          function Compare-CompilerBytes($left, $right) {
            $a = [IO.File]::ReadAllBytes($left)
            $b = [IO.File]::ReadAllBytes($right)
            Write-Host "Compiler sizes: $left = $($a.Length), $right = $($b.Length)"
            $shown = 0
            for ($offset = 0; $offset -lt [Math]::Min($a.Length, $b.Length) -and $shown -lt 16; $offset++) {
              if ($a[$offset] -ne $b[$offset]) {
                Write-Host ('Compiler difference at 0x{0:x}: {1:x2} != {2:x2}' -f $offset, $a[$offset], $b[$offset])
                $shown++
              }
            }
          }
          foreach ($number in 3, 4, 5) {
            if ($number -eq 5) {
              if ($hashes[3] -eq $hashes[4]) { break }
              Compare-CompilerBytes "$work/stage3/chibi.exe" "$work/stage4/chibi.exe"
              if (!$env:BOOTSTRAP_RUN -or !$env:BOOTSTRAP_COMMIT -or $env:BOOTSTRAP_COMMIT -eq $env:GITHUB_SHA) {
                throw 'native-self-host (Windows): stage three and stage four differ'
              }
              Write-Host 'Explicit older bootstrap: require stage four and stage five to be byte-identical'
            }
            New-Item -ItemType Directory -Force "$work/stage$number" | Out-Null
            $began = Get-Date
            & $stage --compiler "$root/tools/compiler" --core "$root/packages/core" --output "$work/stage$number/chibi.exe" --llvm $llvm --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath "$work/stage$number/compiler.log"
            if ($LASTEXITCODE) { throw "stage $number exited $LASTEXITCODE" }
            $stage = "$work/stage$number/chibi.exe"
            $digest = (Get-FileHash $stage -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashes[$number] = $digest
            "stage $number sha256 $digest ($([int]((Get-Date) - $began).TotalSeconds) s)" | Tee-Object -FilePath "$work/windows-fixed-point.log" -Append | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          if ($hashes.ContainsKey(5)) {
            if ($hashes[4] -ne $hashes[5]) {
              Compare-CompilerBytes "$work/stage4/chibi.exe" "$work/stage5/chibi.exe"
              throw 'native-self-host (Windows): stage four and stage five differ'
            }
            'native-self-host (Windows): stage four and stage five are byte-identical' | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            'native-self-host (Windows): stage three and stage four are byte-identical' | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
      - name: Keep Windows fixed-point evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-windows-fixed-point
          path: |
            ${{ runner.temp }}/stage3
            ${{ runner.temp }}/stage4
            ${{ runner.temp }}/stage5
            ${{ runner.temp }}/windows-fixed-point.log
          if-no-files-found: warn
          retention-days: 1
      - name: Check the native Windows asset compiler and C consumer
        if: ${{ !cancelled() && steps.windows-fixed-point.outcome == 'success' }}
        run: |
          & ./test/native_aot/asset_compiler/Bridge.ps1 -Compiler "$env:RUNNER_TEMP/stage4/chibi.exe" -Llvm $env:CHIBI_WINDOWS_LLVM
      - name: Exercise the native Windows object pipeline
        if: ${{ !cancelled() && steps.windows-fixed-point.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $PWD.Path.Replace('\', '/')
          $work = $env:RUNNER_TEMP.Replace('\', '/')
          & "$work/stage4/chibi.exe" --compiler "$root/tools/compiler" --core "$root/packages/core" --source "$root/test/native_aot/link/windows/Main.chibi" --collection "graph=$root/tools/graph" --entry Main --output "$work/windows-objects.exe" --llvm $env:CHIBI_WINDOWS_LLVM --target x86_64-pc-windows-msvc --jobs 4
          if ($LASTEXITCODE) { throw 'could not compile the Windows object regression' }
          & "$work/windows-objects.exe" $env:CHIBI_WINDOWS_LLVM $work
          if ($LASTEXITCODE) { throw 'the Windows object regression failed' }
      - name: Check the native Windows build runner
        if: ${{ !cancelled() && steps.windows-fixed-point.outcome == 'success' }}
        run: |
          & ./test/bootstrap/native-runner.ps1 -Compiler "$env:RUNNER_TEMP/stage4/chibi.exe" -Llvm $env:CHIBI_WINDOWS_LLVM
      - name: Build native Windows checkout products without host tools
        if: ${{ !cancelled() && steps.windows-fixed-point.outcome == 'success' }}
        run: |
          & ./test/bootstrap/native-checkout.ps1 -Compiler "$env:RUNNER_TEMP/stage4/chibi.exe" -Llvm $env:CHIBI_WINDOWS_LLVM
      - name: Check native Windows DLL isolation and private runtimes
        id: windows-dll-proof
        if: ${{ !cancelled() && steps.windows-fixed-point.outcome == 'success' }}
        run: ./test/native_aot/loader/RunWindows.ps1 -Compiler "$env:RUNNER_TEMP/stage4/chibi.exe" -Llvm $env:CHIBI_WINDOWS_LLVM
      - name: Preserve failed Windows DLL evidence
        if: ${{ failure() && steps.windows-dll-proof.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-dll-evidence
          path: ${{ runner.temp }}/chibi-dll-loader-*/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Check native Windows formatting, task timing, math and SDK paths
        if: ${{ !cancelled() && steps.windows-fixed-point.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $PWD.Path.Replace('\', '/')
          $work = $env:RUNNER_TEMP.Replace('\', '/')
          $cases = @(
            @{ name = 'text-format'; source = 'test/native_aot/text_format/Main.chibi' },
            @{ name = 'print'; source = 'test/native_aot/output/Main.chibi' },
            @{ name = 'task-timing'; source = 'test/native_aot/tasks/cases/timing/Main.chibi' },
            @{ name = 'square-root'; source = 'test/native_aot/math_scalar/SquareRoot.chibi' },
            @{ name = 'shadow-root'; source = 'test/native_aot/math_scalar/Shadow.chibi' },
            @{ name = 'sdk-paths'; source = 'test/bootstrap/fixtures/InstallPaths.chibi' },
            @{ name = 'library-loader'; source = 'test/native_aot/loader/Windows.chibi' }
          )
          foreach ($case in $cases) {
            foreach ($level in 0, 2) {
              $output = "$work/$($case.name)-O$level.exe"
              & "$work/stage4/chibi.exe" --compiler "$root/tools/compiler" --core "$root/packages/core" --source "$root/$($case.source)" --collection "graph=$root/tools/graph" --entry Main --output $output --llvm $env:CHIBI_WINDOWS_LLVM --target x86_64-pc-windows-msvc --level $level --jobs 2
              if ($LASTEXITCODE) { throw "could not compile Windows $($case.name) at O$level" }
              & $output
              if ($LASTEXITCODE) { throw "Windows $($case.name) failed at O$level" }
              "PASS native Windows $($case.name) O$level" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }
      - name: Check native Windows characters and UTF-8
        if: ${{ !cancelled() && steps.windows-fixed-point.outcome == 'success' }}
        env:
          CHIBI_CORE: ${{ github.workspace }}/packages/core
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $PWD.Path.Replace('\', '/')
          $compiler = "$env:RUNNER_TEMP/stage4/chibi.exe"
          $expected = @(Get-Content ./test/native_aot/characters/expected.txt | Where-Object { $_ -match '^PASS characters\.' })
          foreach ($level in 0, 2) {
            $reported = @(& $compiler test "$root/test/native_aot/characters/project" --llvm $env:CHIBI_WINDOWS_LLVM "-O$level" 2>&1)
            if ($LASTEXITCODE) { $reported | Write-Host; throw "Windows characters failed at O$level" }
            # A directly selected package is reported under the project root.
            $actual = @($reported | Where-Object { $_ -match '^PASS project\.' } | ForEach-Object { $_ -replace '^PASS project\.', 'PASS characters.' })
            if (Compare-Object $expected $actual) { $reported | Write-Host; throw 'Windows character test outcomes differ' }
            $reported | Write-Host
            & $compiler test "$root/packages/core/utf8" --llvm $env:CHIBI_WINDOWS_LLVM "-O$level"
            if ($LASTEXITCODE) { throw "Windows UTF-8 failed at O$level" }
          }
      - name: Check native Windows foreign buffer values
        if: ${{ !cancelled() && steps.windows-fixed-point.outcome == 'success' }}
        run: |
          & ./test/native_aot/managed_values/RunWindows.ps1 -Compiler "$env:RUNNER_TEMP/stage4/chibi.exe" -Llvm $env:CHIBI_WINDOWS_LLVM
      - name: Cache the verified LLVM tools after Windows validation
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')) && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/clang+llvm-22.1.8-x86_64-pc-windows-msvc/bin
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

  native-targets:
    name: Native scalar modules (${{ matrix.platform }})
    needs: native
    if: always() && needs.native.result != 'cancelled' && needs.native.result != 'skipped'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          platform: macos-arm64
        - os: windows-2022
          platform: windows-x64
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: native-bundle
        path: ${{ runner.temp }}/native-bundle
    - name: Link and run the macOS modules
      if: runner.os == 'macOS'
      run: |
        clang -std=c2x -O1 -Wall -Wextra -Werror -I. test/native_aot/targets/run.c -o "$RUNNER_TEMP/run"
        "$RUNNER_TEMP/run" "$RUNNER_TEMP/native-bundle" /usr/bin/clang
    - name: Set up MSVC
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
          if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
        }
    - name: Link and run the Windows modules
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $llvm = 'C:\Program Files\LLVM\bin'
        & "$llvm\clang.exe" -std=c2x -O1 -Wall -Wextra -Werror -D_CRT_SECURE_NO_WARNINGS -I. test/native_aot/targets/run.c -o "$env:RUNNER_TEMP\run.exe"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        & "$env:RUNNER_TEMP\run.exe" "$env:RUNNER_TEMP\native-bundle" "$llvm\lld-link.exe"
        exit $LASTEXITCODE
  build-alone:
    name: chibi build alone (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBCLANG_ROOT: /usr/lib/llvm-18
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Install the native LLVM tools
      run: sh .github/native-llvm.sh
    - name: Install LLVM and the platform libraries
      run: |
        sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends \
          clang-18 clang-tools-18 libclang-18-dev libclang-rt-18-dev lld-18 llvm-18 ccache \
          libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
          libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
    - name: No Make, CMake or Python build files outside archive/, and the C that remains
      run: sh tools/build.sh census
    - name: chibi build
      run: sh tools/build.sh build --release --libclang-root "$LIBCLANG_ROOT"
    - name: Default native products were built
      run: |
        for product in sdk/chibi sdk/chibi-asset-compiler; do
          test -x "build-release/$product" || { echo "missing build-release/$product"; exit 1; }
        done
        for host in chibi-compile chibi-build-host chibi-compiler-host; do
          test ! -e "build-release/sdk/$host" || { echo "unexpected private host $host"; exit 1; }
        done
    - name: Preserve failed build diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-alone-logs-${{ github.run_id }}-${{ github.run_attempt }}
        path: .chibi/logs/*.log
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
  recover:
    name: Compiler self-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          platform: linux-x64
          arch: X64
        - os: macos-15
          platform: macos-arm64
          arch: ARM64
        - os: windows-2022
          platform: windows-x64
          arch: X64
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Preserve the manifest's source bytes on checkout
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Fetch the pinned bootstrap seed
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: sh tools/bootstrap/seed.sh
    - name: Download the checksum-pinned native runtime
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./.github/ci/recover-runtime.ps1
    - name: Build and execute both compiler stages
      run: ./.github/ci/recover-stages.ps1
    - name: Check authored scalar projection and portable LLVM emission
      run: |
        $ErrorActionPreference = 'Stop'
        $proof = Join-Path $env:RUNNER_TEMP 'compiler-recovery-proof'
        & ./test/native_aot/scalar/Run.ps1 -Proof $proof -Platform '${{ matrix.platform }}'
    - name: Upload both compiler stages and evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: compiler-self-build-${{ matrix.os }}
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/compiler-recovery-proof/stage1/compiler.chibip
          ${{ runner.temp }}/compiler-recovery-proof/stage1/bootstrap.json
          ${{ runner.temp }}/compiler-recovery-proof/stage2/compiler.chibip
          ${{ runner.temp }}/compiler-recovery-proof/compiler.sha256
          ${{ runner.temp }}/compiler-recovery-proof/evidence.json
          ${{ runner.temp }}/compiler-recovery-proof/stage1.stdout.txt
          ${{ runner.temp }}/compiler-recovery-proof/stage1.stderr.txt
          ${{ runner.temp }}/compiler-recovery-proof/stage2.stdout.txt
          ${{ runner.temp }}/compiler-recovery-proof/stage2.stderr.txt
          ${{ runner.temp }}/compiler-recovery-proof/scalar/evidence.json
          ${{ runner.temp }}/compiler-recovery-proof/scalar/regression.chibip
          ${{ runner.temp }}/compiler-recovery-proof/scalar/*.stdout
          ${{ runner.temp }}/compiler-recovery-proof/scalar/*.stderr
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    env:
      CHIBI_CI_PLATFORM: ${{ matrix.platform }}
      CHIBI_CI_ARCH: ${{ matrix.arch }}
  compare:
    name: Compiler self-build across platforms
    needs: recover
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Require successful self-build on every platform
      shell: pwsh
      env:
        RECOVERY_RESULT: ${{ needs.recover.result }}
      run: |
        if ($env:RECOVERY_RESULT -ne 'success') {
          throw "Compiler self-build matrix did not pass: $env:RECOVERY_RESULT"
        }
    - uses: actions/download-artifact@v4
      with:
        pattern: compiler-self-build-*
        path: recovered
    - name: Require identical compiler stages on all three platforms
      shell: pwsh
      run: ./.github/ci/compare-compilers.ps1
    - name: Require identical portable scalar regressions across platforms
      shell: pwsh
      run: ./.github/ci/compare-scalars.ps1
  no-c-compiler:
    name: Native stages without a C compiler (Linux)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the LLVM tools and lld
        run: sh .github/native-llvm.sh
      - name: Remove cmake and every C compiler
        run: |
          sudo rm -f /usr/bin/cmake /usr/local/bin/cmake /usr/bin/ccmake /usr/bin/ctest /usr/bin/cpack
          sudo rm -f /usr/bin/cc /usr/bin/c++ /usr/bin/c89 /usr/bin/c99 /usr/bin/gcc /usr/bin/g++ /usr/bin/gcc-* /usr/bin/g++-*
          sudo rm -f /usr/bin/x86_64-linux-gnu-gcc /usr/bin/x86_64-linux-gnu-gcc-* /usr/bin/x86_64-linux-gnu-g++ /usr/bin/x86_64-linux-gnu-g++-*
          sudo rm -f /usr/bin/clang /usr/bin/clang++ /usr/bin/clang-* /usr/local/bin/clang* /usr/lib/llvm-*/bin/clang*
          sudo rm -f /etc/alternatives/cc /etc/alternatives/c++ /etc/alternatives/c89 /etc/alternatives/c99
      - name: Show that none of them is left, and the LLVM tools are
        run: |
          hash -r
          failed=
          for tool in cmake gcc cc c++ g++ clang clang++ clang-18 x86_64-linux-gnu-gcc; do
            if command -v "$tool"; then
              echo "$tool is still available"
              failed=1
            else
              echo "command -v $tool: not found"
            fi
          done
          test -z "$failed"
          ls -l "$LLVM_BIN/opt" "$LLVM_BIN/llc" "$LLVM_BIN/ld.lld"
          ! ls "$LLVM_BIN"/clang* 2>/dev/null
      - name: Native stage one builds stage two
        shell: bash
        run: |
          set -o pipefail
          sh tools/build.sh native-self-host --llvm "$LLVM_BIN" --stage-two-only \
            2>&1 | tee "$RUNNER_TEMP/native-stages.log"
          test ! -e build-release/sdk/chibi-build-host
          test ! -e build-release/sdk/chibi-compiler-host
      - name: Link and run the vendor FreeType program
        shell: bash
        run: |
          set -o pipefail
          sh tools/build.sh native-vendor-sample --llvm "$LLVM_BIN" \
            --native-driver "$PWD/build-native-self-host/stage2/chibi" 2>&1 | tee "$RUNNER_TEMP/native-vendor-sample.log"
      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo '### No C compiler'
            echo '```'
            grep -hE '^(stage|stage-one|native-self-host|native-vendor-sample)' "$RUNNER_TEMP"/native-stages.log "$RUNNER_TEMP"/native-vendor-sample.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: no-c-compiler-logs
          path: |
            ${{ runner.temp }}/native-stages.log
            ${{ runner.temp }}/native-vendor-sample.log
          if-no-files-found: warn

  graph:
    name: Graph build, tests and SDK relocation (Linux)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'graph'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ github.sha }}
      CHIBI_CI_SANITIZERS: ${{ inputs.sanitizers == true && 'ON' || 'OFF' }}
      CC: clang-18
      CXX: clang++-18
      GH_TOKEN: ${{ github.token }}
      XDG_RUNTIME_DIR: /tmp/chibi-runtime
      SDL_AUDIODRIVER: dummy
      LIBCLANG_ROOT: /usr/lib/llvm-18
      NATIVE_TOOLCHAIN_FLAGS: -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      JOBS: '2'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Install the native LLVM tools
      run: sh .github/native-llvm.sh
    - name: Select CI native profile
      run: sh .github/native-profile.sh
    - name: Verify clean source candidate
      run: |
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        test -z "$(git status --porcelain --untracked-files=normal)"
    - name: Install graph build dependencies
      run: |
        sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends \
          clang-18 clang-tools-18 libclang-18-dev libclang-rt-18-dev llvm-18 lld-18 ccache \
          libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
          libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
          libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
        install -d -m 700 "$XDG_RUNTIME_DIR"
    - name: Build Release graph products and private hosts
      run: sh tools/build.sh build --jobs "$JOBS" --libclang-root "$LIBCLANG_ROOT" --release --target chibi --target chibi-asset-compiler --target chibi-compile --target
        chibi-build-host --target chibi-compiler-host
    - name: Record Release graph tool identities
      run: |
        sha256sum \
          build-release/sdk/chibi-build-host \
          build-release/sdk/chibi-build-host.chibi-record \
          build-release/sdk/chibi-compiler-host \
          build-release/sdk/chibi-compiler-host.chibi-record \
          > "$RUNNER_TEMP/graph-sdk-release-tools.sha256"
        cat "$RUNNER_TEMP/graph-sdk-release-tools.sha256"
    - name: Build graph products and test drivers (selected Debug profile)
      run: sh tools/build.sh build --jobs "$JOBS" --libclang-root "$LIBCLANG_ROOT" --profile "$BUILD_PROFILE" --debug-optimization "$BUILD_DEBUG_OPTIMIZATION"
        --debug-frame-pointers "$BUILD_DEBUG_FRAME_POINTERS" --build build-sdk-tests --target chibi --target chibi-compile --target
        test_tools --target test_language --target chibi-compiler-host --host "$PWD/build-release/sdk/chibi-build-host"
    - name: Verify Release graph tools survived the harness build unchanged
      run: sha256sum --check "$RUNNER_TEMP/graph-sdk-release-tools.sha256"
    - name: Verify graph commands, discovery, incremental builds and resources
      env:
        CHIBI_TOOLS_BUILD_DIR: build-sdk-tests/test/tools
        CHIBI_BUILD_HOST: build-release/sdk/chibi-build-host
      shell: bash
      run: |
        set -e
        for route in graph-engine graph-driver graph-evidence graph-discovery graph-wasm graph-os graph-c graph-build; do
          sh tools/build.sh test --build build-sdk-tests --build-host build-release/sdk/chibi-build-host "$route"
        done
    - name: Verify graph SDK packaging and relocation
      run: sh tools/build.sh test --build-host "$PWD/build-release/sdk/chibi-build-host" graph-sdk-install
    - name: Native, material, project and language selectors on graph outputs
      env:
        UBSAN_OPTIONS: halt_on_error=1
        CHIBI_TOOLS_BUILD_DIR: build-sdk-tests/test/tools
        CHIBI_LANGUAGE_BUILD_DIR: build-sdk-tests/test/language
        CHIBI_BUILD_HOST: build-sdk-tests/sdk/chibi-build-host
        CHIBI_COMPILER_HOST: build-sdk-tests/sdk/chibi-compiler-host
      shell: bash
      run: |
        set -e
        for driver in "$CHIBI_TOOLS_BUILD_DIR/test_tools" "$CHIBI_LANGUAGE_BUILD_DIR/test_language" "$CHIBI_BUILD_HOST" "$CHIBI_COMPILER_HOST" build-release/sdk/chibi build-release/sdk/chibi-compile; do test -x "$driver"; done
        # Groups retain their existing coverage and admission policy; they
        # remain sequential because fixtures and build outputs are shared.
        sh tools/build.sh test --build build-sdk-tests --build-host build-sdk-tests/sdk/chibi-build-host native projects language
    - name: Verify sources remain unchanged
      run: |
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        test -z "$(git status --porcelain --untracked-files=normal)"
