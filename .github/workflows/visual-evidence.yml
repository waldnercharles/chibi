name: Visual evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  record-evidence:
    name: Record declared visual evidence
    if: hashFiles('.github/visual-evidence.yml') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and recording dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ffmpeg libclang-dev llvm-dev python3

      - name: Read the declared scenario
        id: evidence
        run: |
          scenario=$(sed -n 's/^scenario:[[:space:]]*//p' .github/visual-evidence.yml | head -1)
          test -n "$scenario"
          case "$scenario" in
            resize-pane) ;;
            *) echo "Unsupported visual evidence scenario: $scenario" >&2; exit 2 ;;
          esac
          echo "scenario=$scenario" >> "$GITHUB_OUTPUT"

      - name: Build and record the interaction
        run: |
          make record-evidence \
            SCENARIO="${{ steps.evidence.outputs.scenario }}" \
            RECORD_PATH="$RUNNER_TEMP/c-blueprints-${{ steps.evidence.outputs.scenario }}.mp4" \
            FRAMES=48

      - name: Upload recording artifact
        uses: actions/upload-artifact@v4
        with:
          name: c-blueprints-${{ steps.evidence.outputs.scenario }}-${{ github.sha }}
          path: ${{ runner.temp }}/c-blueprints-${{ steps.evidence.outputs.scenario }}.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Publish artifact link
        run: |
          {
            echo '### Visual evidence'
            echo
            echo "The ${{ steps.evidence.outputs.scenario }} recording was uploaded as a CI artifact:"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
