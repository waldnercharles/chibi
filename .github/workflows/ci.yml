name: CI
run-name: "CI · ${{ (github.event_name == 'schedule' || inputs.sanitizers == true) && 'ASan + UBSan' || 'fast Debug O1' }} · ${{ github.event_name }}"

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      sanitizers:
        description: 'Run full ASan + UBSan validation (including major releases)'
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ (github.event_name == 'schedule' || inputs.sanitizers == true) && 'sanitizer' || 'fast' }}
  # Finish one trusted main run so successful native jobs can publish their cache.
  # The default single pending slot keeps only the newest queued main run.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  CHIBI_CI_SANITIZERS: ${{ (github.event_name == 'schedule' || inputs.sanitizers == true) && 'ON' || 'OFF' }}
  CC: clang-18
  CXX: clang++-18
  # Builds download their pinned third-party archive from this repository's
  # releases (third_party/archives.tsv) with the GitHub CLI.
  GH_TOKEN: ${{ github.token }}
  # Native builds and players need a runtime directory and a silent audio device.
  XDG_RUNTIME_DIR: /tmp/chibi-runtime
  SDL_AUDIODRIVER: dummy
  # Every build host in a job, including those the SDK tests start under other
  # roots, shares the cached recovered compilers; an entry's key covers all
  # its inputs, so sharing is safe (docs/self-hosting-build.md).
  CHIBI_COMPILER_CACHE: ${{ github.workspace }}/.chibi/compiler-cache
  # The asset compiler's products live per machine by default; a job keeps them in
  # the workspace so the cache steps below can save and restore them.
  CHIBI_ASSET_COMPILER_CACHE: ${{ github.workspace }}/.chibi/asset-compiler-cache

jobs:
  native:
    name: Engine build and native tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select CI native profile
        run: sh .github/native-profile.sh
      - name: Install build dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ccache clang-18 clang-tools-18 libclang-18-dev libclang-rt-18-dev llvm-18 lld-18 \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          mkdir -m 700 -p "$XDG_RUNTIME_DIR" "$RUNNER_TEMP/build-timings"
      - name: Configure compiler cache
        id: ccache-config
        run: sh .github/native-ccache.sh
      - name: Restore compiler objects
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-config.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.ccache-config.outputs.prefix }}-
            ${{ steps.ccache-config.outputs.compatibility-prefix }}-
      - name: Record compiler cache configuration and reset counters
        run: |
          ccache --show-config
          ccache --zero-stats
      - name: Restore the compiled asset compiler
        id: asset-cache
        uses: actions/cache/restore@v4
        with:
          path: .chibi/asset-compiler-cache
          key: asset-compiler-${{ runner.os }}-${{ hashFiles('tools/compiler/**', 'packages/**', 'tools/graph/asset_compiler/**') }}
      # Recovered compilers, keyed inside by everything that decides their bytes
      # (docs/self-hosting-build.md), so the newest snapshot is always safe to use.
      - name: Restore recovered compilers
        uses: actions/cache/restore@v4
        with:
          path: .chibi/compiler-cache
          key: compiler-cache-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: compiler-cache-${{ runner.os }}-
      # chibi-cli runs chibi-compile too slowly under sanitizers. The
      # chibi launcher target also builds chibi-compile. bootstrap-load needs
      # the Release test_tools: it recovers the compiler in process.
      - name: Build an unsanitized chibi launcher (Release)
        id: release-build
        env:
          CHIBI_BUILD_TIMINGS: ${{ runner.temp }}/build-timings
        run: sh tools/build.sh build --release --target chibi --target chibi-build-host --target chibi-compiler-host --target test_tools --libclang-root /usr/lib/llvm-18
      - name: Build products and test drivers (selected Debug profile)
        id: debug-build
        env:
          VERBOSE: '1'
          CHIBI_BUILD_TIMINGS: ${{ runner.temp }}/build-timings
        shell: bash
        run: |
          set -o pipefail
          sh tools/build.sh build --build build --profile "$BUILD_PROFILE" --debug-optimization "$BUILD_DEBUG_OPTIMIZATION" --debug-frame-pointers "$BUILD_DEBUG_FRAME_POINTERS" --target chibi --target chibi-compile --target test_tools --target test_language --host "$PWD/build-release/sdk/chibi-build-host" --asset-generator-hosts build-release/sdk --libclang-root /usr/lib/llvm-18 2>&1 | tee "$RUNNER_TEMP/native-build.log"
      # The authored graph and native-driver tests, on the Release helper.
      - name: Graph and native driver programs
        env:
          CHIBI_BUILD_HOST: build-release/sdk/chibi-build-host
        run: sh tools/build.sh test --build-host "$CHIBI_BUILD_HOST" graph-engine graph-driver graph-discovery graph-asset-cache graph-os graph-c native-aot-driver
      # After `chibi build`, which builds the test drivers this step runs.
      - name: Build timing host regressions (ready drivers)
        env:
          CHIBI_TOOLS_BUILD_DIR: build/test/tools
          CHIBI_BUILD_HOST: build-release/sdk/chibi-build-host
        run: sh tools/build.sh test --build-host "$CHIBI_BUILD_HOST" build-timings
      - name: Tooling and process integrations
        env:
          CHIBI_TEST_TIMINGS: ${{ runner.temp }}/case-timings
        run: |
          mkdir -m 700 -p "$CHIBI_TEST_TIMINGS"
          sh tools/build.sh test --build-host build-release/sdk/chibi-build-host short
          build/test/tools/test_tools --case-timings
      # Products, test drivers and Release helpers are already built and
      # profile-verified. Do not re-enter their planner for the test groups.
      # Keep groups sequential: they share fixtures and build outputs. Within the
      # last invocation, --jobs 3 fits the 4-core, 16 GB runner; `exclusive` rows
      # in tools/tests.tsv run alone. bootstrap-load, one in-process compiler
      # recovery with the Release test_tools, starts first and overlaps the rest.
      - name: Native, material, project and language selectors
        env:
          UBSAN_OPTIONS: halt_on_error=1
          # native-build cross-links the macOS and Windows programs and lists
          # them in programs.txt there; native-targets runs them.
          CHIBI_NATIVE_BUNDLE: ${{ runner.temp }}/native-bundle
        shell: bash
        run: |
          set -e
          export CHIBI_TOOLS_BUILD_DIR=build/test/tools CHIBI_LANGUAGE_BUILD_DIR=build/test/language
          for driver in "$CHIBI_TOOLS_BUILD_DIR/test_tools" "$CHIBI_LANGUAGE_BUILD_DIR/test_language" build-release/sdk/chibi build-release/sdk/chibi-compile; do test -x "$driver"; done
          sh tools/build.sh test --build-host build-release/sdk/chibi-build-host native
          CHIBI_LLVM_BIN=/usr/lib/llvm-18/bin sh tools/build.sh test --build-host build-release/sdk/chibi-build-host --jobs 3 bootstrap-load projects language
      # Linux x86-64 only. It also builds each module it runs for macOS arm64
      # and Windows x64, and native-targets runs them there, so it and the
      # steps below run even when a selector above failed. The programs
      # native-targets runs need native-build to have passed above.
      - name: Native scalar execution and its macOS and Windows modules
        id: scalar-native
        if: always() && steps.debug-build.outcome == 'success'
        env:
          UBSAN_OPTIONS: halt_on_error=1
          CHIBI_NATIVE_BUNDLE: ${{ runner.temp }}/native-bundle
        run: CHIBI_LLVM_BIN=/usr/lib/llvm-18/bin sh tools/build.sh test --build-host build-release/sdk/chibi-build-host language-scalar-native
      - name: Keep the macOS and Windows native modules
        if: always() && steps.scalar-native.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-bundle
          path: ${{ runner.temp }}/native-bundle
          if-no-files-found: error
          retention-days: 1
      - name: Preserve build logs and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-profile-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-build.log
            ${{ runner.temp }}/build-timings/
            ${{ runner.temp }}/case-timings/
          if-no-files-found: warn
          retention-days: 7
      - name: Report compiler cache statistics
        if: always() && steps.ccache-config.outcome == 'success'
        run: ccache --show-stats --verbose
      # PRs restore only. Main pushes publish snapshots once the Release build
      # succeeded, even when a later step fails or the job times out;
      # GitHub's ref scope additionally prevents PR caches reaching main.
      - name: Save compiler objects from successful main builds
        if: always() && steps.release-build.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-config.outputs.prefix }}-${{ github.sha }}
      - name: Save the compiled asset compiler from successful main builds
        if: always() && steps.release-build.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.asset-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .chibi/asset-compiler-cache
          key: asset-compiler-${{ runner.os }}-${{ hashFiles('tools/compiler/**', 'packages/**', 'tools/graph/asset_compiler/**') }}
      # The cache has no eviction; drop entries no build rewrote for three days.
      - name: Prune old recovered compilers
        if: always() && steps.release-build.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: find .chibi/compiler-cache -type f -mtime +3 -delete 2>/dev/null || true
      - name: Save recovered compilers from main builds
        if: always() && steps.release-build.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .chibi/compiler-cache
          key: compiler-cache-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}

  native-macos:
    name: Engine build and native tests (macOS)
    # PRs run Linux only; main, nightly and `ci-full`-labelled PRs run every platform.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      XDG_RUNTIME_DIR: /tmp/chibi-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Select CI native profile
        run: sh .github/native-profile.sh
      - name: Install build dependencies
        run: |
          brew install llvm lld ccache
          LLVM="$(brew --prefix llvm)"
          echo "LLVM=$LLVM" >> "$GITHUB_ENV"
          # The native driver takes opt, llc and ld.lld from one folder.
          mkdir -p "$RUNNER_TEMP/llvm-bin"
          ln -s "$LLVM/bin/opt" "$LLVM/bin/llc" "$(brew --prefix lld)/bin/ld.lld" "$RUNNER_TEMP/llvm-bin/"
          echo "CHIBI_LLVM_BIN=$RUNNER_TEMP/llvm-bin" >> "$GITHUB_ENV"
          echo "CC=$LLVM/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$LLVM/bin/clang++" >> "$GITHUB_ENV"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR" "$RUNNER_TEMP/build-timings"
      - name: Configure compiler cache
        id: ccache-config
        run: sh .github/native-ccache.sh
      - name: Restore compiler objects
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-config.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.ccache-config.outputs.prefix }}-
            ${{ steps.ccache-config.outputs.compatibility-prefix }}-
      - name: Record compiler cache configuration and reset counters
        run: |
          ccache --show-config
          ccache --zero-stats
      - name: Restore the compiled asset compiler
        id: asset-cache
        uses: actions/cache/restore@v4
        with:
          path: .chibi/asset-compiler-cache
          key: asset-compiler-${{ runner.os }}-${{ hashFiles('tools/compiler/**', 'packages/**', 'tools/graph/asset_compiler/**') }}
      # Recovered compilers, keyed inside by everything that decides their bytes
      # (docs/self-hosting-build.md), so the newest snapshot is always safe to use.
      - name: Restore recovered compilers
        uses: actions/cache/restore@v4
        with:
          path: .chibi/compiler-cache
          key: compiler-cache-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: compiler-cache-${{ runner.os }}-
      # chibi-cli runs chibi-compile too slowly under sanitizers. The
      # chibi launcher target also builds chibi-compile, and
      # the Graph build adds the Release build host the Debug builds use.
      - name: Build an unsanitized chibi launcher (Release)
        id: release-build
        env:
          CHIBI_BUILD_TIMINGS: ${{ runner.temp }}/build-timings
        run: sh tools/build.sh build --release --target chibi --target chibi-compiler-host --libclang-root "$LLVM"
      # The Release build host runs the outer Build and Graph programs, which
      # plan the selected Debug build. Release hosts also generate the asset
      # compiler resource; products and test drivers retain the selected profile.
      - name: Build products and test drivers (selected Debug profile)
        env:
          VERBOSE: '1'
          CHIBI_BUILD_TIMINGS: ${{ runner.temp }}/build-timings
        shell: bash
        run: |
          set -o pipefail
          sh tools/build.sh build --build build --profile "$BUILD_PROFILE" --debug-optimization "$BUILD_DEBUG_OPTIMIZATION" --debug-frame-pointers "$BUILD_DEBUG_FRAME_POINTERS" --target chibi --target chibi-compile --target test_tools --target test_language --host "$PWD/build-release/sdk/chibi-build-host" --asset-generator-hosts build-release/sdk --libclang-root "$LLVM" 2>&1 | tee "$RUNNER_TEMP/native-build.log"
      - name: Preserve failed macOS Graph stage log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-graph-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .chibi/logs/*-graph.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      # After `chibi build`, which builds the test drivers this step runs.
      - name: Build timing host regressions (ready drivers)
        env:
          CHIBI_TOOLS_BUILD_DIR: build/test/tools
          CHIBI_BUILD_HOST: build-release/sdk/chibi-build-host
        run: sh tools/build.sh test --build-host "$CHIBI_BUILD_HOST" build-timings
      - name: Tooling and process integrations
        env:
          CHIBI_TEST_TIMINGS: ${{ runner.temp }}/case-timings
        run: |
          mkdir -m 700 -p "$CHIBI_TEST_TIMINGS"
          sh tools/build.sh test --build-host build-release/sdk/chibi-build-host short
          build/test/tools/test_tools --case-timings
      # The selected-profile build and Release helpers above already produced
      # these drivers. Run the same groups without re-entering either planner.
      # Keep groups sequential: they share fixtures and build outputs. Within the
      # last invocation, --jobs 2 fits the 3-core, 7 GB runner.
      - name: Native, material, project and language selectors
        shell: bash
        run: |
          set -e
          export CHIBI_TOOLS_BUILD_DIR=build/test/tools CHIBI_LANGUAGE_BUILD_DIR=build/test/language
          for driver in "$CHIBI_TOOLS_BUILD_DIR/test_tools" "$CHIBI_LANGUAGE_BUILD_DIR/test_language" build-release/sdk/chibi build-release/sdk/chibi-compile; do test -x "$driver"; done
          sh tools/build.sh test --build-host build-release/sdk/chibi-build-host native native-aot-driver native-build
          CHIBI_LLVM_BIN= sh tools/build.sh test --build-host build-release/sdk/chibi-build-host --jobs 2 chibi-cli language
      - name: Preserve build logs and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-profile-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-build.log
            ${{ runner.temp }}/build-timings/
            ${{ runner.temp }}/case-timings/
          if-no-files-found: warn
          retention-days: 7
      - name: Report compiler cache statistics
        if: always() && steps.ccache-config.outcome == 'success'
        run: ccache --show-stats --verbose
      # PRs restore only. Main pushes publish snapshots once the Release build
      # succeeded, even when a later step fails or the job times out;
      # GitHub's ref scope additionally prevents PR caches reaching main.
      - name: Save compiler objects from successful main builds
        if: always() && steps.release-build.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-config.outputs.prefix }}-${{ github.sha }}
      - name: Save the compiled asset compiler from successful main builds
        if: always() && steps.release-build.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.asset-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .chibi/asset-compiler-cache
          key: asset-compiler-${{ runner.os }}-${{ hashFiles('tools/compiler/**', 'packages/**', 'tools/graph/asset_compiler/**') }}
      # The cache has no eviction; drop entries no build rewrote for three days.
      - name: Prune old recovered compilers
        if: always() && steps.release-build.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: find .chibi/compiler-cache -type f -mtime +3 -delete 2>/dev/null || true
      - name: Save recovered compilers from main builds
        if: always() && steps.release-build.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .chibi/compiler-cache
          key: compiler-cache-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}

  # The engine's test drivers do not build on Windows yet, so the Linux job
  # builds each module language-scalar-native runs for macOS arm64 and Windows
  # x64, and this job links and runs them there (test/native_aot/targets).
  native-targets:
    name: Native scalar modules (${{ matrix.platform }})
    needs: native
    # PRs run Linux only; main, nightly and `ci-full`-labelled PRs run every platform.
    # It runs when native uploaded the bundle, even if another selector failed there.
    if: always() && needs.native.result != 'cancelled' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-bundle
          path: ${{ runner.temp }}/native-bundle
      - name: Link and run the macOS modules
        if: runner.os == 'macOS'
        run: |
          clang -std=c2x -O1 -Wall -Wextra -Werror -I. test/native_aot/targets/run.c -o "$RUNNER_TEMP/run"
          "$RUNNER_TEMP/run" "$RUNNER_TEMP/native-bundle" /usr/bin/clang
      - name: Set up MSVC
        if: runner.os == 'Windows'
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
      - name: Link and run the Windows modules
        if: runner.os == 'Windows'
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          & "$llvm\clang.exe" -std=c2x -O1 -Wall -Wextra -Werror -D_CRT_SECURE_NO_WARNINGS -I. test/native_aot/targets/run.c -o "$env:RUNNER_TEMP\run.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\run.exe" "$env:RUNNER_TEMP\native-bundle" "$llvm\lld-link.exe"
          exit $LASTEXITCODE

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          python3 -m venv /tmp/clang-format
          /tmp/clang-format/bin/pip install --only-binary=:all: clang-format==22.1.0
          echo '/tmp/clang-format/bin' >> "$GITHUB_PATH"
      - name: Check format
        run: sh tools/clang-format.sh --check
      # Deleting a path from a condition leaves an operator with no operand,
      # which only the graph build, minutes later, reports. Catch it here.
      - name: Check Chibi sources for empty operands
        run: |
          if git grep -nE '(==|!=|\|\||&&) *(\|\||&&|\))|\( *(\|\||&&)' -- '*.chibi' ':!archive'; then
            echo 'An operator above has no operand; delete the whole condition with the path.'
            exit 1
          fi
      # Archiving a selector's code must also drop its tools/tests.tsv row.
      - name: Check test selectors name existing driver flags
        run: |
          status=0
          while IFS="$(printf '\t')" read -r kind name driver flag rest; do
            [ "$kind" = tool ] || continue
            case "$driver" in
              */test_tools) source=test/tools/main.c ;;
              */test_language) source=test/language/main.c ;;
              *) continue ;;
            esac
            case "$flag" in --*) ;; *) continue ;; esac
            grep -qF -- "\"$flag\"" "$source" || { echo "tools/tests.tsv: $name runs $flag, which $source does not accept"; status=1; }
          done < tools/tests.tsv
          exit $status

  graph-sdk-linux:
    name: Graph SDK packaging and relocation (Linux)
    runs-on: ubuntu-24.04
    # The job takes 2-4 minutes; without a bound a hung apt-get held main's
    # concurrency slot for two hours (run 41259496977).
    timeout-minutes: 20
    env:
      LIBCLANG_ROOT: /usr/lib/llvm-18
      NATIVE_TOOLCHAIN_FLAGS: -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select CI native profile
        run: sh .github/native-profile.sh
      - name: Verify clean source candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Install graph build dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends \
            clang-18 clang-tools-18 libclang-18-dev libclang-rt-18-dev ccache \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          install -d -m 700 "$XDG_RUNTIME_DIR"
      - name: Restore the compiled asset compiler
        uses: actions/cache/restore@v4
        with:
          path: .chibi/asset-compiler-cache
          key: asset-compiler-${{ runner.os }}-${{ hashFiles('tools/compiler/**', 'packages/**', 'tools/graph/asset_compiler/**') }}
      # Recovered compilers, keyed inside by everything that decides their bytes
      # (docs/self-hosting-build.md), so the newest snapshot is always safe to use.
      - name: Restore recovered compilers
        uses: actions/cache/restore@v4
        with:
          path: .chibi/compiler-cache
          key: compiler-cache-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: compiler-cache-${{ runner.os }}-
      - name: Build Release graph compiler and build hosts
        run: sh tools/build.sh build --jobs "$JOBS" --libclang-root "$LIBCLANG_ROOT" --release --target chibi-build-host --target chibi-compiler-host
      - name: Verify graph SDK packaging and relocation
        run: sh tools/build.sh test --build-host "$PWD/build-release/sdk/chibi-build-host" graph-sdk-install
      - name: Verify sources remain unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Preserve failed graph SDK build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: graph-sdk-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .chibi/logs/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # Goal item 3: `chibi build`, run alone on a clean checkout, builds every
  # product and test driver. No Make, CMake or Python build file exists outside
  # archive/ and third_party/, and the job installs none of those tools.
  build-alone:
    name: chibi build alone (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBCLANG_ROOT: /usr/lib/llvm-18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: No Make, CMake or Python build files outside archive/, and the C that remains
        run: sh tools/build.sh census
      - name: Install LLVM and the platform libraries
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends \
            clang-18 clang-tools-18 libclang-18-dev libclang-rt-18-dev lld-18 llvm-18 ccache \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
      - name: chibi build
        run: sh tools/build.sh build --release --libclang-root "$LIBCLANG_ROOT"
      - name: Every product and test driver was built
        run: |
          for product in sdk/chibi sdk/chibi-compile sdk/chibi-build-host sdk/chibi-compiler-host test/tools/test_tools test/language/test_language; do
            test -x "build-release/$product" || { echo "missing build-release/$product"; exit 1; }
          done
      - name: Preserve failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-alone-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .chibi/logs/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
