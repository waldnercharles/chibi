name: Chibi merge policy

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited, converted_to_draft, labeled, unlabeled]
  issues:
    types: [labeled, unlabeled]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write
  checks: write
  issues: write
  pull-requests: write

jobs:
  policy:
    uses: waldnercharles/chibi-studio/.github/workflows/chibi-merge-policy-reusable.yml@428260c27ac4b84c3017060e17a6e34876b6fa65
    with:
      gate_ready: ${{ vars.CHIBI_REVIEW_GATE_READY == 'true' }}
      post_merge_workflows: >-
        [{"workflow":"ci.yml","ignore":["docs/**","**.md",".claude/**"]},{"workflow":"publish.yml","include":["src/**","include/**","sdk/**","cmake/**","third_party/**","content/**","tools/**","CMakeLists.txt","Makefile",".github/workflows/publish.yml"]}]
    permissions:
      contents: write
      actions: write
      checks: write
      issues: write
      pull-requests: write
