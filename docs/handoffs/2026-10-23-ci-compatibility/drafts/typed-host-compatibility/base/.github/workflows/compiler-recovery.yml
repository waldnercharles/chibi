name: Compiler self-build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compiler-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    name: Compiler self-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            arch: ARM64
          - os: ubuntu-24.04
            platform: linux-x64
            arch: X64
          - os: windows-2022
            platform: windows-x64
            arch: X64
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve the manifest's source bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the checksum-pinned native runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ARCH -ne '${{ matrix.arch }}' -or
              [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToUpperInvariant() -ne '${{ matrix.arch }}' -or
              [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToUpperInvariant() -ne '${{ matrix.arch }}') {
            throw 'The runner architecture differs from this runtime seed'
          }
          $manifest = Get-Content tools/compiler/runtime.json -Raw | ConvertFrom-Json
          $runtime = $manifest.platforms.'${{ matrix.platform }}'
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $asset = 'chibi-compiler-host-${{ matrix.platform }}' + $suffix
          if ($manifest.format -ne 1 -or !$manifest.repository -or !$manifest.tag -or
              $manifest.source_revision -notmatch '^[a-f0-9]{40}$' -or
              $manifest.source_tree -notmatch '^[a-f0-9]{40}$' -or
              $runtime.asset -ne $asset -or $runtime.bytes -le 0 -or
              $runtime.sha256 -notmatch '^[a-f0-9]{64}$') {
            throw 'The native runtime manifest has no complete pin for this platform'
          }
          $download = Join-Path $env:RUNNER_TEMP 'compiler-runtime-download'
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download $manifest.tag --repo $manifest.repository --pattern $asset --dir $download
          if ($LASTEXITCODE) { throw 'Downloading the native runtime seed failed' }
          $file = Get-Item (Join-Path $download $asset)
          $digest = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($file.Length -ne $runtime.bytes -or $digest -ne $runtime.sha256) {
            throw 'The native runtime seed differs from its checked-in size or SHA-256'
          }
          $proof = Join-Path $env:RUNNER_TEMP 'compiler-recovery-proof'
          ./.github/scripts/compiler-self-build.ps1 -Mode Prepare -Proof $proof -Runtime $file.FullName -Platform '${{ matrix.platform }}' -PinnedRuntime
      - name: Build and execute both compiler stages
        run: |
          ./.github/scripts/compiler-self-build.ps1 -Mode Prove -Proof (Join-Path $env:RUNNER_TEMP 'compiler-recovery-proof') -Platform '${{ matrix.platform }}' -PinnedRuntime
      - name: Upload both compiler stages and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-self-build-${{ matrix.os }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/compiler-recovery-proof/stage1/compiler.chibip
            ${{ runner.temp }}/compiler-recovery-proof/stage1/bootstrap.json
            ${{ runner.temp }}/compiler-recovery-proof/stage2/compiler.chibip
            ${{ runner.temp }}/compiler-recovery-proof/stage2/bootstrap.json
            ${{ runner.temp }}/compiler-recovery-proof/compiler.sha256
            ${{ runner.temp }}/compiler-recovery-proof/evidence.json
            ${{ runner.temp }}/compiler-recovery-proof/stage1.stdout.txt
            ${{ runner.temp }}/compiler-recovery-proof/stage1.stderr.txt
            ${{ runner.temp }}/compiler-recovery-proof/stage2.stdout.txt
            ${{ runner.temp }}/compiler-recovery-proof/stage2.stderr.txt
            ${{ runner.temp }}/compiler-recovery-proof/stage1-contract.*.txt
            ${{ runner.temp }}/compiler-recovery-proof/stage2-contract.*.txt
            ${{ runner.temp }}/compiler-recovery-proof/compile.json

  compare:
    name: Compiler self-build across platforms
    needs: recover
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful self-build on every platform
        shell: pwsh
        env:
          RECOVERY_RESULT: ${{ needs.recover.result }}
        run: |
          if ($env:RECOVERY_RESULT -ne 'success') {
            throw "Compiler self-build matrix did not pass: $env:RECOVERY_RESULT"
          }
      - uses: actions/download-artifact@v4
        with:
          pattern: compiler-self-build-*
          path: recovered
      - name: Require identical compiler stages on all three platforms
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $digests = @()
          foreach ($platform in @('macos-15', 'ubuntu-24.04', 'windows-2022')) {
            $root = "recovered/compiler-self-build-$platform"
            $evidence = Get-Content "$root/evidence.json" -Raw | ConvertFrom-Json
            if ($evidence.error -or $evidence.stages.Count -ne 2 -or
                $evidence.stages[1].input_compiler_sha256 -ne $evidence.stages[0].output_compiler_sha256) {
              throw "$platform did not execute the compiler it built"
            }
            foreach ($stage in 1, 2) {
              $artifact = Get-Item "$root/stage$stage/compiler.chibip"
              $digest = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($digest -ne $evidence.compiler_sha256 -or
                  $digest -ne $evidence.stages[$stage - 1].output_compiler_sha256 -or
                  $artifact.Length -ne $evidence.stages[$stage - 1].output_bytes) {
                throw "$platform stage$stage differs from its recorded output"
              }
              $digests += $digest
              "$platform stage$stage`: $digest" >> $env:GITHUB_STEP_SUMMARY
            }
          }
          if (@($digests | Select-Object -Unique).Count -ne 1) {
            throw 'The compiler stages differ across platforms with runtime-validated prepared ABI/catalog'
          }
