name: Compiler self-build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compiler-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    name: Compiler self-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            arch: ARM64
          - os: ubuntu-24.04
            platform: linux-x64
            arch: X64
          - os: windows-2022
            platform: windows-x64
            arch: X64
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve the manifest's source bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the checksum-pinned native runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ARCH -ne '${{ matrix.arch }}' -or
              [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToUpperInvariant() -ne '${{ matrix.arch }}' -or
              [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToUpperInvariant() -ne '${{ matrix.arch }}') {
            throw 'The runner architecture differs from this runtime seed'
          }
          $manifest = Get-Content tools/compiler/runtime.json -Raw | ConvertFrom-Json
          $runtime = $manifest.platforms.'${{ matrix.platform }}'
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $asset = 'chibi-compiler-host-${{ matrix.platform }}' + $suffix
          if ($manifest.format -ne 1 -or !$manifest.repository -or !$manifest.tag -or
              $manifest.source_revision -notmatch '^[a-f0-9]{40}$' -or
              $manifest.source_tree -notmatch '^[a-f0-9]{40}$' -or
              $runtime.asset -ne $asset -or $runtime.bytes -le 0 -or
              $runtime.sha256 -notmatch '^[a-f0-9]{64}$') {
            throw 'The native runtime manifest has no complete pin for this platform'
          }
          $download = Join-Path $env:RUNNER_TEMP 'compiler-runtime-download'
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download $manifest.tag --repo $manifest.repository --pattern $asset --dir $download
          if ($LASTEXITCODE) { throw 'Downloading the native runtime seed failed' }
          $file = Get-Item (Join-Path $download $asset)
          $digest = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($file.Length -ne $runtime.bytes -or $digest -ne $runtime.sha256) {
            throw 'The native runtime seed differs from its checked-in size or SHA-256'
          }
          $proof = Join-Path $env:RUNNER_TEMP 'compiler-recovery-proof'
          New-Item -ItemType Directory -Path "$proof/tools", "$proof/packages" | Out-Null
          $hostPath = Join-Path $proof ('chibi-compiler-host' + $suffix)
          Copy-Item $file.FullName $hostPath
          if (!$IsWindows) {
            $mode = [IO.UnixFileMode]::UserRead -bor [IO.UnixFileMode]::UserWrite -bor [IO.UnixFileMode]::UserExecute -bor
                    [IO.UnixFileMode]::GroupRead -bor [IO.UnixFileMode]::GroupExecute -bor
                    [IO.UnixFileMode]::OtherRead -bor [IO.UnixFileMode]::OtherExecute
            [IO.File]::SetUnixFileMode($hostPath, $mode)
          }
          Copy-Item tools/compiler "$proof/tools/compiler" -Recurse
          Copy-Item packages/core "$proof/packages/core" -Recurse
          $nativeSources = Get-ChildItem $proof -Recurse -File | Where-Object { $_.Extension -in '.c', '.h', '.cc', '.cpp', '.cxx', '.m', '.mm' }
          if ($nativeSources) { throw 'The self-build input directory contains native sources' }
      - name: Build and execute both compiler stages
        run: |
          $ErrorActionPreference = 'Stop'
          $timer = [Diagnostics.Stopwatch]::StartNew()
          $proof = Join-Path $env:RUNNER_TEMP 'compiler-recovery-proof'
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $hostPath = Join-Path $proof ('chibi-compiler-host' + $suffix)
          $evidence = [ordered]@{
            revision = $env:GITHUB_SHA
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            platform = '${{ matrix.platform }}'
            stages = @()
          }
          try {
            $runtimeManifest = Get-Content "$proof/tools/compiler/runtime.json" -Raw | ConvertFrom-Json
            $runtime = $runtimeManifest.platforms.'${{ matrix.platform }}'
            $runtimeDigest = (Get-FileHash $hostPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($runtimeDigest -ne $runtime.sha256) { throw 'The isolated runtime differs from its pin' }
            $evidence['runtime_sha256'] = $runtimeDigest
            $evidence['runtime_source_revision'] = $runtimeManifest.source_revision
            $evidence['runtime_source_tree'] = $runtimeManifest.source_tree
            $evidence['runtime_release'] = "$($runtimeManifest.repository)/$($runtimeManifest.tag)"
            $evidence['input_files'] = @(Get-ChildItem $proof -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath($proof, $_.FullName).Replace('\', '/') } | Sort-Object)
            function Recover-Stage($name, $bootstrap, $output) {
              $record = [ordered]@{
                stage = $name
                input_compiler_sha256 = (Get-FileHash (Join-Path $bootstrap 'compiler.chibip') -Algorithm SHA256).Hash.ToLowerInvariant()
                input_manifest_sha256 = (Get-FileHash (Join-Path $bootstrap 'bootstrap.json') -Algorithm SHA256).Hash.ToLowerInvariant()
              }
              $evidence.stages += $record
              $start = [Diagnostics.ProcessStartInfo]::new()
              $start.FileName = $hostPath
              $start.WorkingDirectory = $proof
              $start.UseShellExecute = $false
              $start.RedirectStandardOutput = $true
              $start.RedirectStandardError = $true
              $arguments = @('--bootstrap', $bootstrap, '--compiler', 'tools/compiler', '--core', 'packages/core', '--recover', $output)
              foreach ($argument in $arguments) { $start.ArgumentList.Add($argument) }
              $start.Environment.Clear()
              if ($IsWindows) { $start.Environment['SystemRoot'] = $env:SystemRoot }
              $start.Environment['PATH'] = ''
              $start.Environment['CC'] = 'unavailable-in-self-build'
              $start.Environment['CXX'] = 'unavailable-in-self-build'
              $start.Environment['TEMP'] = $proof
              $start.Environment['TMP'] = $proof
              $start.Environment['TMPDIR'] = $proof
              $record['arguments'] = $arguments
              $record['child_environment'] = [ordered]@{}
              foreach ($key in $start.Environment.Keys | Sort-Object) { $record.child_environment[$key] = $start.Environment[$key] }
              $process = [Diagnostics.Process]::Start($start)
              $stdout = $process.StandardOutput.ReadToEndAsync()
              $stderr = $process.StandardError.ReadToEndAsync()
              $process.WaitForExit()
              $out = $stdout.GetAwaiter().GetResult()
              $err = $stderr.GetAwaiter().GetResult()
              $out | Set-Content "$proof/$name.stdout.txt" -NoNewline
              $err | Set-Content "$proof/$name.stderr.txt" -NoNewline
              Write-Host $out
              if ($err) { Write-Host $err }
              $record['exit_code'] = $process.ExitCode
              $record['elapsed_total_seconds'] = $timer.Elapsed.TotalSeconds
              if ($process.ExitCode) { throw "$name failed with exit code $($process.ExitCode)" }
              $artifact = Get-Item $output
              if (!$artifact.Length) { throw "$name produced an empty compiler" }
              $record['output_bytes'] = $artifact.Length
              $record['output_compiler_sha256'] = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            New-Item -ItemType Directory -Path "$proof/stage1", "$proof/stage2" | Out-Null
            Recover-Stage 'stage1' "$proof/tools/compiler/bootstrap" "$proof/stage1/compiler.chibip"
            # Preserve every original source hash and target ABI value. Only the
            # closure's size/hash change so the next call loads the new compiler.
            # JsonNode retains integer precision in untouched native identities.
            $manifest = [System.Text.Json.Nodes.JsonNode]::Parse([IO.File]::ReadAllText("$proof/tools/compiler/bootstrap/bootstrap.json"))
            $closure = $manifest['closure'].AsObject()
            $closure['bytes'] = [System.Text.Json.Nodes.JsonNode]::Parse([string]$evidence.stages[0].output_bytes)
            $closure['sha256'] = [System.Text.Json.Nodes.JsonNode]::Parse('"' + $evidence.stages[0].output_compiler_sha256 + '"')
            [IO.File]::WriteAllText("$proof/stage1/bootstrap.json", $manifest.ToJsonString())
            Recover-Stage 'stage2' "$proof/stage1" "$proof/stage2/compiler.chibip"
            $first = $evidence.stages[0]
            $second = $evidence.stages[1]
            if ($second.input_compiler_sha256 -ne $first.output_compiler_sha256 -or
                $second.output_bytes -ne $first.output_bytes -or
                $second.output_compiler_sha256 -ne $first.output_compiler_sha256) {
              throw 'The newly built compiler did not reproduce itself'
            }
            $evidence['compiler_bytes'] = $second.output_bytes
            $evidence['compiler_sha256'] = $second.output_compiler_sha256
            "$($first.output_compiler_sha256)  stage1/compiler.chibip`n$($second.output_compiler_sha256)  stage2/compiler.chibip" | Set-Content "$proof/compiler.sha256"
            "Both compiler stages reproduced $($second.output_bytes) bytes, SHA-256 $($second.output_compiler_sha256), in $($timer.Elapsed.TotalSeconds) seconds" >> $env:GITHUB_STEP_SUMMARY
          } catch {
            $evidence['error'] = $_.Exception.Message
            throw
          } finally {
            $timer.Stop()
            $evidence['proof_seconds'] = $timer.Elapsed.TotalSeconds
            $evidence | ConvertTo-Json -Depth 8 | Set-Content "$proof/evidence.json"
          }
      - name: Compile and execute authored foundation regressions
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Join-Path $env:RUNNER_TEMP 'compiler-recovery-proof'
          $tests = Join-Path $proof 'authored-tests'
          New-Item -ItemType Directory -Path $tests | Out-Null
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $hostPath = Join-Path $proof ('chibi-compiler-host' + $suffix)
          $evidence = [ordered]@{ revision = $env:GITHUB_SHA; invocations = @(); sources = @(); passed = $false }
          function Invoke-Host($name, $arguments, $backend, $timeout) {
            $record = [ordered]@{ name = $name; backend = $backend; arguments = $arguments }
            $evidence.invocations += $record
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = $hostPath
            $start.WorkingDirectory = $proof
            $start.UseShellExecute = $false
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($argument in $arguments) { $start.ArgumentList.Add($argument) }
            $start.Environment.Clear()
            if ($IsWindows) { $start.Environment['SystemRoot'] = $env:SystemRoot }
            $start.Environment['PATH'] = ''
            $start.Environment['CC'] = 'unavailable-in-authored-tests'
            $start.Environment['CXX'] = 'unavailable-in-authored-tests'
            foreach ($key in @('TEMP', 'TMP', 'TMPDIR')) { $start.Environment[$key] = $tests }
            $record['child_environment'] = [ordered]@{}
            foreach ($key in $start.Environment.Keys | Sort-Object) { $record.child_environment[$key] = $start.Environment[$key] }
            $timer = [Diagnostics.Stopwatch]::StartNew()
            $process = [Diagnostics.Process]::Start($start)
            try {
              $stdout = $process.StandardOutput.ReadToEndAsync()
              $stderr = $process.StandardError.ReadToEndAsync()
              $timedOut = !$process.WaitForExit($timeout + 5000)
              if ($timedOut) { $process.Kill($true); $process.WaitForExit() }
              $out = $stdout.GetAwaiter().GetResult()
              $err = $stderr.GetAwaiter().GetResult()
              [IO.File]::WriteAllText((Join-Path $tests "$name.stdout.txt"), $out)
              [IO.File]::WriteAllText((Join-Path $tests "$name.stderr.txt"), $err)
              $record['stdout_sha256'] = (Get-FileHash (Join-Path $tests "$name.stdout.txt") -Algorithm SHA256).Hash.ToLowerInvariant()
              $record['stderr_sha256'] = (Get-FileHash (Join-Path $tests "$name.stderr.txt") -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host $out
              if ($err) { Write-Host $err }
              $record['exit_code'] = $process.ExitCode
              $record['timed_out'] = $timedOut
              if ($timedOut -or $process.ExitCode) { throw "$name failed or exceeded its deadline" }
              $counters = [regex]::Matches($err, '(?m)^compiler-host bytecode=(\d+) sljit=(\d+) wasm=(\d+) fallback=(\d+) overflow=(\d+)\r?$')
              if ($counters.Count -ne 1) { throw "$name has no unambiguous backend evidence" }
              $counts = $counters[0].Groups
              $record['counts'] = [ordered]@{ bytecode = [uint64]$counts[1].Value; sljit = [uint64]$counts[2].Value; wasm = [uint64]$counts[3].Value; fallback = [uint64]$counts[4].Value; overflow = [uint64]$counts[5].Value }
              $other = if ($backend -eq 'sljit') { 'bytecode' } else { 'sljit' }
              if ($record.counts[$backend] -eq 0 -or $record.counts[$other] -ne 0 -or $record.counts.wasm -ne 0 -or $record.counts.fallback -ne 0 -or $record.counts.overflow -ne 0) {
                throw "$name did not execute exclusively on the requested backend"
              }
              return $out
            } finally {
              $timer.Stop()
              $record['seconds'] = $timer.Elapsed.TotalSeconds
              if (!$process.HasExited) { $process.Kill($true); $process.WaitForExit() }
              $process.Dispose()
            }
          }
          try {
            $recovery = Get-Content "$proof/evidence.json" -Raw | ConvertFrom-Json
            $compiler = Join-Path $proof 'stage2/compiler.chibip'
            $evidence['runtime_sha256'] = (Get-FileHash $hostPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $evidence['compiler_sha256'] = (Get-FileHash $compiler -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($recovery.error -or $evidence.runtime_sha256 -ne $recovery.runtime_sha256 -or $evidence.compiler_sha256 -ne $recovery.compiler_sha256) {
              throw 'Authored tests must use the exact verified runtime and recovered stage two'
            }
            $mapPath = Join-Path $env:GITHUB_WORKSPACE 'test/selfhost/sources.json'
            $map = [System.Text.Json.Nodes.JsonNode]::Parse([IO.File]::ReadAllText($mapPath))
            $manifest = [System.Text.Json.Nodes.JsonNode]::Parse([IO.File]::ReadAllText("$proof/tools/compiler/bootstrap/bootstrap.json"))
            $evidence['source_map_sha256'] = (Get-FileHash $mapPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($map['format'].ToJsonString() -ne '1' -or $map['entry'].ToString() -notmatch '^0x[a-f0-9]{16}$' -or
                $map['files'].AsArray().Count -lt 1 -or $map['files'].AsArray().Count -gt 256) { throw 'Invalid authored-test source map' }
            $names = [System.Text.Json.Nodes.JsonArray]::new()
            $roots = [System.Text.Json.Nodes.JsonArray]::new()
            foreach ($collection in $map['collections'].AsArray()) {
              $names.Add($collection['name'].DeepClone())
              $roots.Add($collection['root'].DeepClone())
            }
            $paths = [System.Text.Json.Nodes.JsonArray]::new()
            $sources = [System.Text.Json.Nodes.JsonArray]::new()
            $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            $listed = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            foreach ($file in $map['files'].AsArray()) {
              $source = $file['source'].ToString()
              $virtual = $file['path'].ToString()
              if ($source -notmatch '^[A-Za-z0-9_./-]+\.chibi$' -or $source.StartsWith('/') -or
                  @($source.Split('/') | Where-Object { $_ -in @('', '.', '..') }).Count -or !$seen.Add($virtual) -or !$listed.Add($source)) {
                throw 'Source map paths must be unique, regular repository-relative Chibi files'
              }
              $path = $env:GITHUB_WORKSPACE
              foreach ($part in $source.Split('/')) {
                $path = Join-Path $path $part
                $item = Get-Item -LiteralPath $path
                if ($item.LinkType) { throw "Source map must not traverse a symlink: $source" }
              }
              if ($item.LinkType -or $item.PSIsContainer -or $item.Length -gt 1048576) { throw "Unsupported source file: $source" }
              $text = [Text.UTF8Encoding]::new($false, $true).GetString([IO.File]::ReadAllBytes($path))
              $paths.Add($file['path'].DeepClone())
              $sources.Add([System.Text.Json.Nodes.JsonNode]::Parse((ConvertTo-Json -InputObject $text -Compress)))
              $evidence.sources += [ordered]@{ source = $source; path = $virtual; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() }
            }
            # A selected production package is complete, not a filtered copy that hides
            # unsupported files. Explicit fixture files may omit their assert wrappers.
            $directories = @($evidence.sources.source | Where-Object { $_.StartsWith('tools/') -or $_.StartsWith('packages/') } | ForEach-Object { Split-Path $_ -Parent } | Sort-Object -Unique)
            foreach ($directory in $directories) {
              foreach ($file in Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $directory) -Filter '*.chibi' -File) {
                $relative = [IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $file.FullName).Replace('\', '/')
                if (!$listed.Contains($relative)) { throw "Source map omits production package member: $relative" }
              }
            }
            # Preserve target uint64 identities as JSON nodes, never floating-point values.
            $compileInput = [System.Text.Json.Nodes.JsonArray]::new()
            $compileInput.Add([System.Text.Json.Nodes.JsonNode]::Parse('"/project"'))
            $compileInput.Add($names); $compileInput.Add($roots); $compileInput.Add($paths); $compileInput.Add($sources)
            $compileInput.Add([System.Text.Json.Nodes.JsonNode]::Parse('false'))
            foreach ($part in $manifest['target'].AsArray()) { $compileInput.Add($part.DeepClone()) }
            $inputPath = Join-Path $tests 'compile-input.json'
            [IO.File]::WriteAllText($inputPath, $compileInput.ToJsonString())
            if ((Get-Item $inputPath).Length -gt 16777216) { throw 'Authored test input exceeds its bounded fixture size' }
            $evidence['input_sha256'] = (Get-FileHash $inputPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $artifact = Join-Path $tests 'regressions.chibip'
            $null = Invoke-Host 'compile' @('--artifact', $compiler, '--entry', $manifest['entry'].ToString(), '--input', $inputPath,
              '--backend', 'sljit', '--budget', '2000000000', '--timeout-ms', '120000', '--output-artifact', $artifact) 'sljit' 120000
            $evidence['fixture_bytes'] = (Get-Item $artifact).Length
            $evidence['fixture_sha256'] = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            if (!$evidence.fixture_bytes) { throw 'Compilation produced an empty authored-test closure' }
            $argumentsPath = Join-Path $tests 'arguments.json'
            [IO.File]::WriteAllText($argumentsPath, '[]')
            foreach ($backend in @('bytecode', 'sljit')) {
              $output = Invoke-Host $backend @('--artifact', $artifact, '--entry', $map['entry'].ToString(), '--input', $argumentsPath,
                '--backend', $backend, '--budget', '2000000000', '--timeout-ms', '30000') $backend 30000
              $document = [System.Text.Json.JsonDocument]::Parse($output)
              try {
                $result = $document.RootElement
                if ($result.ValueKind -ne [System.Text.Json.JsonValueKind]::Array -or $result.GetArrayLength() -ne 1) { throw 'Authored tests returned an invalid result envelope' }
                $values = @($result.EnumerateArray())
                if ($values[0].ValueKind -ne [System.Text.Json.JsonValueKind]::Array -or $values[0].GetArrayLength() -ne 0) {
                  throw "$backend authored regression assertions failed: $output"
                }
              } finally { $document.Dispose() }
            }
            $evidence['passed'] = $true
            Remove-Item -LiteralPath $artifact
            "Authored regressions passed on bytecode and SLJIT; fixture SHA-256 $($evidence.fixture_sha256)" >> $env:GITHUB_STEP_SUMMARY
          } catch {
            $evidence['error'] = $_.Exception.Message
            throw
          } finally {
            $evidence | ConvertTo-Json -Depth 8 | Set-Content "$tests/evidence.json"
          }
      - name: Upload both compiler stages and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-self-build-${{ matrix.os }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/compiler-recovery-proof/stage1/compiler.chibip
            ${{ runner.temp }}/compiler-recovery-proof/stage1/bootstrap.json
            ${{ runner.temp }}/compiler-recovery-proof/stage2/compiler.chibip
            ${{ runner.temp }}/compiler-recovery-proof/compiler.sha256
            ${{ runner.temp }}/compiler-recovery-proof/evidence.json
            ${{ runner.temp }}/compiler-recovery-proof/stage1.stdout.txt
            ${{ runner.temp }}/compiler-recovery-proof/stage1.stderr.txt
            ${{ runner.temp }}/compiler-recovery-proof/stage2.stdout.txt
            ${{ runner.temp }}/compiler-recovery-proof/stage2.stderr.txt
            ${{ runner.temp }}/compiler-recovery-proof/authored-tests/evidence.json
            ${{ runner.temp }}/compiler-recovery-proof/authored-tests/*.stdout.txt
            ${{ runner.temp }}/compiler-recovery-proof/authored-tests/*.stderr.txt

  compare:
    name: Compiler self-build across platforms
    needs: recover
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful self-build on every platform
        shell: pwsh
        env:
          RECOVERY_RESULT: ${{ needs.recover.result }}
        run: |
          if ($env:RECOVERY_RESULT -ne 'success') {
            throw "Compiler self-build matrix did not pass: $env:RECOVERY_RESULT"
          }
      - uses: actions/download-artifact@v4
        with:
          pattern: compiler-self-build-*
          path: recovered
      - name: Require identical compiler stages on all three platforms
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $digests = @()
          foreach ($platform in @('macos-15', 'ubuntu-24.04', 'windows-2022')) {
            $root = "recovered/compiler-self-build-$platform"
            $evidence = Get-Content "$root/evidence.json" -Raw | ConvertFrom-Json
            if ($evidence.error -or $evidence.stages.Count -ne 2 -or
                $evidence.stages[1].input_compiler_sha256 -ne $evidence.stages[0].output_compiler_sha256) {
              throw "$platform did not execute the compiler it built"
            }
            foreach ($stage in 1, 2) {
              $artifact = Get-Item "$root/stage$stage/compiler.chibip"
              $digest = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($digest -ne $evidence.compiler_sha256 -or
                  $digest -ne $evidence.stages[$stage - 1].output_compiler_sha256 -or
                  $artifact.Length -ne $evidence.stages[$stage - 1].output_bytes) {
                throw "$platform stage$stage differs from its recorded output"
              }
              $digests += $digest
              "$platform stage$stage`: $digest" >> $env:GITHUB_STEP_SUMMARY
            }
          }
          if (@($digests | Select-Object -Unique).Count -ne 1) {
            throw 'The compiler stages differ across platforms with the validated bootstrap ABI'
          }
      - name: Require identical authored regressions on all three platforms
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureDigests = @()
          $sourceMapDigests = @()
          $inputDigests = @()
          foreach ($platform in @('macos-15', 'ubuntu-24.04', 'windows-2022')) {
            $root = "recovered/compiler-self-build-$platform"
            $recovery = Get-Content "$root/evidence.json" -Raw | ConvertFrom-Json
            $tests = Get-Content "$root/authored-tests/evidence.json" -Raw | ConvertFrom-Json
            if ($tests.error -or $tests.passed -ne $true -or $tests.invocations.Count -ne 3 -or
                $tests.revision -ne $recovery.revision -or $tests.compiler_sha256 -ne $recovery.compiler_sha256 -or
                $tests.runtime_sha256 -ne $recovery.runtime_sha256 -or $tests.fixture_bytes -le 0 -or
                $tests.fixture_sha256 -notmatch '^[a-f0-9]{64}$' -or $tests.source_map_sha256 -notmatch '^[a-f0-9]{64}$' -or
                $tests.input_sha256 -notmatch '^[a-f0-9]{64}$') { throw "$platform has no successful authored-test evidence for its recovered compiler" }
            foreach ($index in 0, 1, 2) {
              $name = @('compile', 'bytecode', 'sljit')[$index]
              $backend = @('sljit', 'bytecode', 'sljit')[$index]
              $other = if ($backend -eq 'sljit') { 'bytecode' } else { 'sljit' }
              $invocation = $tests.invocations[$index]
              if ($invocation.name -ne $name -or $invocation.backend -ne $backend -or $invocation.exit_code -ne 0 -or
                  $invocation.timed_out -ne $false -or $invocation.counts.$backend -le 0 -or $invocation.counts.$other -ne 0 -or
                  $invocation.counts.wasm -ne 0 -or $invocation.counts.fallback -ne 0 -or $invocation.counts.overflow -ne 0) {
                throw "$platform $name lacks exclusive requested-backend execution"
              }
              foreach ($stream in @('stdout', 'stderr')) {
                $log = "$root/authored-tests/$name.$stream.txt"
                if ((Get-FileHash $log -Algorithm SHA256).Hash.ToLowerInvariant() -ne $invocation."${stream}_sha256") {
                  throw "$platform $name $stream differs from recorded evidence"
                }
              }
              if ($name -ne 'compile') {
                $document = [System.Text.Json.JsonDocument]::Parse([IO.File]::ReadAllText("$root/authored-tests/$name.stdout.txt"))
                try {
                  $result = $document.RootElement
                  if ($result.ValueKind -ne [System.Text.Json.JsonValueKind]::Array -or $result.GetArrayLength() -ne 1) { throw "$platform $name has an invalid result envelope" }
                  $values = @($result.EnumerateArray())
                  if ($values[0].ValueKind -ne [System.Text.Json.JsonValueKind]::Array -or $values[0].GetArrayLength() -ne 0) {
                    throw "$platform $name contains authored assertion failures"
                  }
                } finally { $document.Dispose() }
              }
            }
            $fixtureDigests += $tests.fixture_sha256
            $sourceMapDigests += $tests.source_map_sha256
            $inputDigests += $tests.input_sha256
            "$platform authored tests: $($tests.fixture_sha256), bytecode and SLJIT passed" >> $env:GITHUB_STEP_SUMMARY
          }
          if (@($fixtureDigests | Select-Object -Unique).Count -ne 1 -or
              @($sourceMapDigests | Select-Object -Unique).Count -ne 1 -or
              @($inputDigests | Select-Object -Unique).Count -ne 1) {
            throw 'The authored source map, compile input or generated closure differs across platforms'
          }
