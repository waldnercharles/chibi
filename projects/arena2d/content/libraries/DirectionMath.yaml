version: 3
name: DirectionMath
domain: library
id_counter: 100
description: Shared direction calculations.
graphs:
- {kind: event, name: Events}
- id: 1
  kind: function
  name: Direction Orientation
  entry_id: 2
  return_id: 3
  call_depth_limit: 64
  nodes:
  - id: 2
    type: Function Entry
    outputs:
    - {id: 4, name: X, type: float, kind: data}
    - {id: 5, name: "Y", type: float, kind: data}
  - id: 3
    type: Return
    inputs:
    - {id: 6, name: Orientation, type: struct, type_name: GameOrientation, kind: data}
  - id: 75
    type: Atan2
    inputs:
      "Y": {id: 72, type_name: float}
      X: {type_name: float}
    outputs:
    - {id: 74, name: Result, type_name: float}
  - id: 78
    type: Make_GameOrientation
    inputs:
      radians: {id: 76}
  edges:
  - {from: 2.X, to: 75.X}
  - {from: 2.Y, to: 75.Y}
  - {from: 75.Result, to: 78.radians}
  - {from: 78.GameOrientation, to: 3.Orientation}
