name: Frozen Windows SDK discovery replay
'on':
  push:
    branches: [codex/windows-facade-sdk-replay-20261103]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Replay the frozen C facade with ordinary and extended loader paths
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: '& ./.github/windows-facade-replay.ps1'
    - name: Preserve diagnostic logs and exact replay binaries
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: windows-facade-sdk-replay
        path: ${{ runner.temp }}/chibi-facade-replay-*
        if-no-files-found: error
        retention-days: 1
