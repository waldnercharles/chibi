name: Bootstrap host

# Builds the first build host (the binary tools/bootstrap.sh fetches) on each
# supported platform and publishes it. Pin a published host in
# tools/bootstrap/hosts.tsv.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  BOOTSTRAP_TAG: bootstrap-host-${{ github.sha }}

jobs:
  host:
    name: Build host (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            python3 .github/install-ubuntu-dependencies.py clang-18 ninja-build
            echo CC=clang-18 >> "$GITHUB_ENV"
          else
            brew install llvm
            echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          fi
          python3 -m venv /tmp/cmake
          /tmp/cmake/bin/pip install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          echo /tmp/cmake/bin >> "$GITHUB_PATH"
      - name: Build the host
        run: |
          sh tools/configure.sh sdk-native build-host -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$CC" \
            -DCHIBI_SDK_BUILD_COMPILER=ON -DCHIBI_SDK_BUILD_NATIVE=OFF -DCHIBI_SDK_BUILD_DESKTOP=OFF
          cmake --build build-host --target chibi-build-host --parallel 4
          test "$(build-host/chibi-build-host --protocol-version)" = 14
          mkdir out
          cp build-host/chibi-build-host "out/chibi-build-host-${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish hosts
    needs: host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release and print the pins
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          sha256sum chibi-build-host-* > SHA256SUMS
          gh release create "$BOOTSTRAP_TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Bootstrap host $GITHUB_SHA" --notes "First build hosts. Pin them in tools/bootstrap/hosts.tsv." \
            chibi-build-host-* SHA256SUMS
          for asset in chibi-build-host-*; do
            platform=${asset#chibi-build-host-}
            printf '%s\t%s\t%s\t%s\n' "$platform" "$BOOTSTRAP_TAG" "$asset" "$(sha256sum "$asset" | cut -d' ' -f1)"
          done | tee "$GITHUB_STEP_SUMMARY"
