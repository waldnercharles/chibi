name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native tests (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            sanitizers: "ON"
            sljit: "ON"
          - build_type: RelWithDebInfo
            sanitizers: "OFF"
            sljit: "ON"
    env:
      # CI explicitly retains the complete suite, including software-rendered coverage.
      CHIBI_EXECUTION_PROFILE: hardware
      CHIBI_ALLOW_FULL_GPU: "1"
      NATIVE_TOOLCHAIN_FLAGS: -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      LOCAL_CMAKE_FLAGS: >-
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCHIBI_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
        -DCHIBI_ENABLE_SJLIT=${{ matrix.sljit }}
        -DCHIBI_ENABLE_WARNINGS=ON -DCHIBI_ENABLE_CCACHE=ON
        -DLIBCLANG_ROOT=/usr/lib/llvm-18
    steps:
      - uses: actions/checkout@v4
      - name: Identify dependency sources
        id: deps
        run: echo "key=$(python3 tools/fetchcontent_cache.py fingerprint --source-dir .)" >> "$GITHUB_OUTPUT"
      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: ~/.cache/chibi-fetchcontent/${{ steps.deps.outputs.key }}
          key: fetchcontent-${{ runner.os }}-${{ steps.deps.outputs.key }}
      - name: Set up CMake
        uses: lukka/get-cmake@latest
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-${{ matrix.build_type }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 libclang-18-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers \
            libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev xvfb
      - name: Build and run headless tests
        run: make test
      - name: Run render tests
        run: xvfb-run -a make test-render
      - name: Verify parallel Arena scaling
        if: matrix.build_type == 'RelWithDebInfo'
        run: >-
          xvfb-run -a env CBLUEPRINT_BENCH_COMBAT=1
          CBLUEPRINT_BENCH_REQUIRE_PARALLEL=1
          build/test_suite --bench-arena-scene-scale 2048 240 0
      - name: Reject native execution without SLJIT
        if: matrix.build_type == 'Debug'
        run: |
          sh tools/configure_native.sh build-nojit -DCMAKE_BUILD_TYPE=Debug \
            -DCHIBI_ENABLE_SJLIT=OFF -DCHIBI_ENABLE_SANITIZERS=ON \
            -DLIBCLANG_ROOT=/usr/lib/llvm-18 \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build-nojit --target check-behavior-backend --parallel 4
      - name: Build development reload targets
        if: matrix.build_type == 'Debug'
        run: |
          sh tools/configure_native.sh build-dev -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCHIBI_DEVELOPMENT_RELOAD=ON \
            -DCHIBI_ENABLE_SANITIZERS=OFF \
            -DCHIBI_ENABLE_SJLIT=ON -DLIBCLANG_ROOT=/usr/lib/llvm-18 \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build-dev --target chibi chibi_dll --parallel 4

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          version=$(sed -n 's/^CLANG_FORMAT_VERSION=//p' tools/clang-format.sh)
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$version"
          sudo apt-get install -y "clang-format-$version"
      - name: Check format
        run: sh tools/clang-format.sh --check
