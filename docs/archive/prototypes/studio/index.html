<!doctype html>
<html lang="en" data-density="compact">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Chibi — Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="kit.css">
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <!-- Design study for the RmlUi Studio workspace. Not part of the production build. -->
  <div id="app">
    <header class="topbar"></header>
    <main class="workspace"></main>
    <footer class="statusbar">
      <span class="hints"></span>
      <span class="spacer"></span>
      <span class="report" data-fade></span>
      <span class="spacer"></span>
      <button class="btn sm toggle-drawer" data-drawer="assets" data-tip="Assets" data-kbd="Mod+Shift+A"></button>
      <button class="btn sm toggle-drawer" data-drawer="output" data-tip="Output" data-kbd="Mod+Shift+U"></button>
      <span class="stats"></span>
    </footer>
  </div>
  <div class="study"></div>
  <script src="fixture.js"></script>
  <script src="icons.js"></script>
  <script src="kit.js"></script>
  <script src="app.js"></script>
  <script src="editors-scene.js"></script>
  <script src="editors-graph.js"></script>
  <script src="editors-props.js"></script>
  <script>
    document.querySelector('[data-drawer=assets]').innerHTML = icon('assets') + '<span>Assets</span>';
    document.querySelector('[data-drawer=output]').innerHTML = icon('output') + '<span>Output</span>';
    App.init();
  </script>
</body>
</html>
