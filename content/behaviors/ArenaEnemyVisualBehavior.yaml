    type: Event
    reference_name: Begin
    outputs:
      Then: {id: 1}
  - id: 4
    type: Random Range Vector
    inputs:
      Max:
        default: {x: 6.2831855, "y": 6.2831855, z: 6.2831855}
  - {id: 8, type: Set_GameVisualMotion_rotation}
  - id: 14
    type: Random Range Vector
    inputs:
      Min:
        default: {x: -10.0, "y": -10.0, z: -10.0}
      Max:
        default: {x: 10.0, "y": 10.0, z: 10.0}
  - id: 18
    type: Set_GameVisualMotion_angular_velocity
  - id: 24
    type: Event
    reference_name: Contact Begin
    outputs:
      Other: {type: handle, type_name: ecs.entity, kind: data}
      Point: {id: 160, type: struct, type_name: CF_V2, kind: data}
  - id: 27
    type: Call Function
    reference_id: 96
    reference_name: Bump
    inputs:
      Strength: {type: float, kind: data, default: 1.0}
  - id: 31
    type: Event
    reference_name: Damaged
    outputs:
