version: 1
name: CombatLab
physics:
  gravity: {x: 0.0, "y": 240.0}
seed: 3
entities:
- name: Player
  prototype: Wren
  components:
    GameTransform: {x: 0.0, "y": 330.0}
  behaviors: [Hardpoints, PlayerEffects, ShipFlight, ShipHull]
- name: Camera
  prototype: WellCamera
  components:
    GameTransform: {x: 0.0, "y": 330.0}
  behaviors: [CameraFollow]
- name: Lighting
  prototype: WellLighting
  behaviors: [Ambience, Atmosphere]
- {name: FireMouse, prototype: FireMouse}
- {name: FireStick, prototype: FireStick}
- {name: SecondaryMouse, prototype: SecondaryMouse}
- name: Run
  prototype: RunState
  behaviors: [Run]
- name: HUD
  prototype: WellHud
  behaviors: [WellHudDisplay]
- name: Throat deep
  prototype: BackdropDeep
  components:
    GameBackdrop2D: {material: ThroatDeep, parallax: 0.12, layer: 0, intensity: 1.0}
- name: Throat columns
  prototype: BackdropFar
  components:
    GameBackdrop2D: {material: ThroatColumns, parallax: 0.45, layer: 1, intensity: 1.0, lit: true}
- {name: Basalt Throat, prototype: StratumThroat}
- name: Mite 1
  prototype: Mite
  components:
    GameTransform: {x: 150, "y": 300}
  behaviors: [Chaser, Creature]
- name: Mite 2
  prototype: Mite
  components:
    GameTransform: {x: 180, "y": 340}
  behaviors: [Chaser, Creature]
- name: Mite 3
  prototype: Mite
  components:
    GameTransform: {x: 160, "y": 380}
  behaviors: [Chaser, Creature]
- name: Spitter
  prototype: Spitter
  components:
    GameTransform: {x: 250, "y": 280}
  behaviors: [Creature, Spitter]
- name: Lancer
  prototype: Lancer
  components:
    GameTransform: {x: 200, "y": 420}
  behaviors: [Creature, Lancer]
- name: Barnacle
  prototype: Barnacle
  components:
    GameTransform: {x: 330, "y": 420}
    GameOrientation: {radians: 3.14}
  behaviors: [Barnacle, Creature]
