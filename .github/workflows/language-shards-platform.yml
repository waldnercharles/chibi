name: Language shard platform proof

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      llvm_bin:
        required: true
        type: string

permissions:
  contents: read

env:
  CC: clang-18
  CXX: clang++-18
  GH_TOKEN: ${{ github.token }}
  XDG_RUNTIME_DIR: /tmp/chibi-runtime
  SDL_AUDIODRIVER: dummy
  # This proof always measures the full sanitizer lane, not ordinary fast PR CI.
  CHIBI_CI_SANITIZERS: 'ON'

jobs:
  build:
    name: Build language artifacts (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      CHIBI_LLVM_BIN: ${{ inputs.llvm_bin }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          python3 .github/install-ubuntu-dependencies.py ccache clang-18 clang-tools-18 libclang-18-dev libclang-rt-18-dev llvm-18 lld-18 \
            libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
          echo LLVM=/usr/lib/llvm-18 >> "$GITHUB_ENV"
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm ccache
          LLVM="$(brew --prefix llvm)"
          echo "LLVM=$LLVM" >> "$GITHUB_ENV"
          echo "CC=$LLVM/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$LLVM/bin/clang++" >> "$GITHUB_ENV"
      - name: Install pinned build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake"
          "$RUNNER_TEMP/cmake/bin/pip" install --only-binary=:all: --require-hashes -r .github/build-tools.txt
          echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
      - name: Select full sanitizer profile
        run: python3 .github/native-profile.py
      - name: Build Release generation and macOS planning hosts
        shell: bash
        run: |
          make build-release BUILD_TARGET='chibi-build-host chibi-compiler-host' LIBCLANG_ROOT="$LLVM"
          if [ "$RUNNER_OS" = macOS ]; then
            echo "BUILD_HOST=$PWD/build-release/sdk/chibi-build-host" >> "$GITHUB_ENV"
          fi
      - name: Build the sanitized drivers once
        env:
          VERBOSE: '1'
        shell: bash
        run: |
          set -o pipefail
          make build BUILD_TARGET='test_tools test_language chibi-compiler-host' ASSET_GENERATOR_HOSTS=build-release/sdk LIBCLANG_ROOT="$LLVM" 2>&1 | tee "$RUNNER_TEMP/native-build.log"
      - name: Verify native profile evidence
        run: python3 .github/verify-native-profile.py
      - name: Stage exact-source runtime closure and selector manifest
        run: |
          python3 tools/language_test_artifact.py pack "$RUNNER_TEMP/language-stage"
          python3 tools/language_test_artifact.py verify "$RUNNER_TEMP/language-stage"
          tar -C "$RUNNER_TEMP/language-stage" -cf "$RUNNER_TEMP/language-runtime.tar" \
            manifest.json build/test/language/test_language build/test/language/corpus.txt \
            build/test/tools/test_tools build/sdk/chibi-compiler-host
          wc -c "$RUNNER_TEMP/language-runtime.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: language-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/language-runtime.tar
          compression-level: 1
          if-no-files-found: error
          retention-days: 3

  language:
    name: Serial language shard ${{ matrix.shard }} (${{ inputs.runner }})
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CHIBI_LLVM_BIN: ${{ inputs.llvm_bin }}
      # Same stricter Linux policy as ordinary CI; no selector is unsanitized.
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux runtime and LLVM tools
        if: runner.os == 'Linux'
        run: |
          python3 .github/install-ubuntu-dependencies.py clang-18 libclang-18-dev libclang-rt-18-dev llvm-18 lld-18 \
            libgl1-mesa-dev libvulkan1 libx11-dev libxcursor-dev libxext-dev libxi-dev \
            libxrandr-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev
      - name: Install matching macOS LLVM runtime
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          LLVM="$(brew --prefix llvm)"
          echo "CC=$LLVM/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$LLVM/bin/clang++" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: language-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/language-download
      - name: Restore the same-run artifact at its original source path
        run: |
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          python3 tools/language_test_artifact.py unpack "$RUNNER_TEMP/language-download/language-runtime.tar" "$RUNNER_TEMP/language-stage"
          python3 tools/language_test_artifact.py restore "$RUNNER_TEMP/language-stage"
      - name: Execute the full assigned selector list serially
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 tools/test_policy.py --jobs 1 --shard "$SHARD/3" group language

  result:
    name: Language shard proof
    if: always()
    needs: [build, language]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every producer and shard to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          LANGUAGE_RESULT: ${{ needs.language.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$LANGUAGE_RESULT" = success
